// Overview lens: the fleet at a glance (scope "all") or one agent's session.

function sparkline(agentId, width = 84, height = 22) {
  const buckets = 12;
  const now = Date.now();
  const counts = Array(buckets).fill(0);
  const errs = Array(buckets).fill(false);
  for (const c of DB.calls.filter((x) => x.agent === agentId)) {
    const age = (now - c.ts) / 60000;
    if (age < 0 || age >= 60) continue;
    const b = buckets - 1 - Math.floor(age / 5);
    counts[b]++;
    if (c.status === "error") errs[b] = true;
  }
  const max = Math.max(...counts, 1);
  const bw = width / buckets;
  const bars = counts
    .map((n, k) => {
      const h = n ? Math.max(3, (n / max) * (height - 2)) : 1.5;
      const color = errs[k] ? "var(--blocked)" : n ? "var(--accent)" : "#ffffff18";
      return `<rect x="${k * bw + 1}" y="${height - h}" width="${bw - 2}" height="${h}" rx="1.5" fill="${color}"/>`;
    })
    .join("");
  return raw(`<svg class="spark" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="최근 1시간 도구 호출 ${sum(counts)}회">${bars}</svg>`);
}

function nowCell(a) {
  if (a.status === "offline") return html`<span class="dim">${a.offlineReason}</span>`;
  const c = currentCall(a.id);
  if (!c) return html`<span class="dim">—</span>`;
  return html`<span class="now-cell"><span style="color:${kindColor(c)};display:inline-flex">${toolIcon(c, 14)}</span><span class="tname">${toolTitle(c)}</span><span class="ttarget truncate">${toolTarget(c)}</span></span>`;
}

function statusPillFor(a) {
  const ago = a.status === "working" || a.status === "blocked" ? raw(`<span data-elapsed-ko="${a.sinceTs}">${fmtDurKo((Date.now() - a.sinceTs) / 1000)}</span>`) : shortAgo(a.sinceTs);
  const glyph = a.status === "working" ? spinner(12) : a.status === "blocked" ? icon("alert", 12) : a.status === "done" ? icon("check", 12) : "";
  const cls = a.status === "offline" || a.status === "ended" || a.status === "running" ? "unknown" : a.status;
  return html`<span class="pill ${cls}">${glyph} ${STATUS_LABEL[a.status]}${a.status === "offline" ? "" : html` · ${ago}`}</span>`;
}

function attentionCard(a) {
  const c = DB.calls.find((x) => x.agent === a.id && x.status === "pending");
  const ask = c?.name === "AskUserQuestion" ? c.input.questions[0] : null;
  return html`<div class="attn">
    ${logo(a.app, 34)}
    <div style="min-width:0">
      <div class="who"><span class="truncate">${a.title}</span><span class="dim" style="font-weight:400;font-size:var(--fs-sm)">${a.space} › ${a.tab}</span>
        <span class="pill blocked" style="margin-left:4px">${icon("alert", 12)}<span><span data-elapsed-ko="${a.sinceTs}">${fmtDurKo((Date.now() - a.sinceTs) / 1000)}</span>째 대기</span></span></div>
      <div class="why">${c?.permission ? c.permission.question : ask ? ask.question : "에이전트가 답을 기다려요"}</div>
      ${c ? html`<div class="what"><span class="chip mono">${toolIcon(c, 12)} ${toolTitle(c)}</span><span class="chip mono truncate">${toolTarget(c)}</span>${c.permission ? html`<span class="chip">${c.permission.impact}</span>` : ""}</div>` : ""}
    </div>
    <div class="acts">
      <button class="btn primary sm" data-action="open-call" data-agent="${a.id}" data-call="${c?.id || ""}">자세히 보기</button>
      <button class="btn sm" data-action="boundary" data-cmd="herdr-app do agent.focus --terminal ${a.id}">herdr에서 답하기 ${icon("arrow-up-right", 12)}</button>
    </div>
  </div>`;
}

function fleetOverview() {
  const agents = [...DB.agents].sort((x, y) => STATUS_RANK[y.status] - STATUS_RANK[x.status] || y.sinceTs - x.sinceTs);
  const blocked = agents.filter((a) => a.status === "blocked");
  const totals = DB.agents.map((a) => agentStats(a.id));
  return html`<div class="fleet">
    ${blocked.length ? html`<section aria-label="응답 필요"><h2 class="section-title" style="color:var(--blocked)">응답 필요 <small>${blocked.length}</small></h2><div class="col" style="gap:10px">${blocked.map(attentionCard)}</div></section>` : ""}
    <section aria-label="모든 에이전트">
      <h2 class="section-title">모든 에이전트 <small>도구 호출 ${sum(totals, (t) => t.calls)} · 바뀐 파일 ${sum(totals, (t) => t.files)} · 링크 ${sum(totals, (t) => t.links)}</small></h2>
      <div class="card" style="overflow-x:auto">
        <table class="ftable">
          <thead><tr><th>에이전트</th><th>상태</th><th>지금 하는 일</th><th>최근 1시간</th><th class="r">도구</th><th class="r">변경</th><th class="r">토큰</th></tr></thead>
          <tbody>${agents.map((a) => {
            const s = agentStats(a.id);
            const tok = a.tokens.input + a.tokens.output + a.tokens.cacheRead + a.tokens.cacheWrite;
            return html`<tr tabindex="0" data-action="scope" data-scope="${a.id}" aria-label="${a.title} 열기">
              <td><div class="who">${logo(a.app, 28)}<div style="min-width:0"><div class="t truncate">${a.title}${a.unseen ? html` <span class="st dot" title="안 본 완료"></span>` : ""}</div><div class="s">${a.sub && agentById(a.parent) ? `↳ ${agentById(a.parent).title}의 하위 에이전트` : `${a.machine ? `${a.machine} · ` : ""}${a.space} › ${a.tab}`} · ${a.model}</div></div></div></td>
              <td>${statusPillFor(a)}</td>
              <td>${nowCell(a)}</td>
              <td>${a.status === "offline" ? "" : sparkline(a.id)}</td>
              <td class="r">${s.calls}${s.errors ? html` <span style="color:#ff8a80">· ${s.errors}✕</span>` : ""}</td>
              <td class="r">${s.files ? html`<span class="digest"><span class="a">+${s.add}</span> <span class="d">−${s.del}</span></span>` : html`<span class="dim">—</span>`}</td>
              <td class="r">${tok ? fmtK(tok) : "—"}</td>
            </tr>`;
          })}</tbody>
        </table>
      </div>
    </section>
  </div>`;
}

function tokenCard(a) {
  const t = a.tokens;
  const parts = [
    ["캐시 읽기", t.cacheRead, "var(--done)"],
    ["캐시 쓰기", t.cacheWrite, "#d9822b"],
    ["입력", t.input, "#57ab5a"],
    ["출력", t.output, "var(--working)"],
    ...(t.reasoning ? [["추론", t.reasoning, "var(--ansi13)"]] : []),
  ].filter(([, v]) => v > 0);
  const total = sum(parts, (p) => p[1]);
  const prompt = t.input + t.cacheRead + t.cacheWrite;
  const hit = prompt ? Math.round((t.cacheRead / prompt) * 100) : 0;
  return html`<div class="card"><div class="card-h"><span class="grow">토큰 구성</span><span class="num" style="color:var(--foreground)">${fmtK(total)}</span></div>
    <div class="card-b">
      <div class="tokbar" role="img" aria-label="토큰 구성">${parts.map(([, v, c]) => raw(`<i style="flex:${v};background:${c}"></i>`))}</div>
      <div class="legend">${parts.map(([k, v, c]) => html`<div><i style="background:${c}"></i>${k}<span class="v">${fmtK(v)}</span><span class="p">${((v / total) * 100).toFixed(1)}%</span></div>`)}</div>
      <div class="kv" style="margin:14px 0 6px"><span>캐시 적중</span><b>${hit}%</b></div>
      <div class="meter"><i style="width:${hit}%"></i></div>
    </div></div>`;
}

function contextCard(a) {
  const pct = Math.round((a.context.used / a.context.limit) * 100);
  return html`<div class="card"><div class="card-b">
    <div class="kv"><span>컨텍스트</span><b>${fmtK(a.context.used)} <span class="dim" style="font-weight:400;font-size:var(--fs-sm)">/ ${fmtK(a.context.limit)}</span></b></div>
    <div class="meter ${pct > 70 ? "warn" : ""}"><i style="width:${pct}%"></i></div>
    <div class="dim" style="font-size:var(--fs-xs);margin-top:6px">마지막 요청의 프롬프트 토큰 · ${pct}%${pct > 70 ? " · 곧 자동 압축돼요" : ""}</div>
  </div></div>`;
}

function filesCard(a) {
  const files = filesOf(a.id);
  if (!files.length) return "";
  const blocks = (add, del) => {
    const total = add + del || 1;
    const nA = Math.round((add / total) * 5);
    const cells = Array.from({ length: 5 }, (_, k) => (k < nA ? "a" : k < nA + Math.round((del / total) * 5) ? "d" : ""));
    return raw(`<span class="blocks">${cells.map((c) => `<i class="${c}"></i>`).join("")}</span>`);
  };
  return html`<div class="card files-top"><div class="card-h"><span class="grow">바뀐 파일</span><button class="btn ghost sm" data-action="lens" data-lens="diffs">전부 보기 ${icon("arrow-right", 12)}</button></div>
    <div class="card-b" style="padding-top:6px">${files.slice(0, 6).map((f) => {
      const s = fileStats(f);
      return html`<button class="frow" data-action="open-file" data-agent="${a.id}" data-path="${f.path}">${fileIcon(f.path)}<span class="p truncate">${dirName(f.path) ? `${dirName(f.path)}/` : ""}<b>${baseName(f.path)}</b></span><span class="digest">${s.lock ? "lock" : raw(`<span class="a">+${s.add}</span> <span class="d">−${s.del}</span>`)}</span>${blocks(s.add, s.del)}</button>`;
    })}</div></div>`;
}

function nowCard(a) {
  if (a.status === "offline") {
    return html`<div class="card"><div class="empty"><div class="e-ico">${icon("server", 20)}</div><h3>home 머신에 닿지 않아요</h3><p>이 에이전트의 기록은 그 머신의 herdr-core에 있어요. 로그인하면 다시 보여요.</p><button class="btn sm" data-action="copy" data-copy="hc machine login home">${icon("copy", 12)} hc machine login home</button></div></div>`;
  }
  const c = currentCall(a.id);
  const lastReply = repliesOf(a.id).slice(-1)[0];
  const showReply = (a.status === "done" || a.status === "idle") && lastReply && (!c || lastReply.ts > c.ts);
  const label = a.status === "blocked" ? "응답을 기다리는 호출" : a.status === "working" ? "지금 하는 일" : showReply ? "마지막 답변" : "마지막 호출";
  return html`<div class="card now">
    <div class="now-h">${statusPillFor(a)}<span class="lbl">${label}</span><span class="grow"></span>
      ${c && !showReply ? html`<button class="btn sm" data-action="open-call" data-agent="${a.id}" data-call="${c.id}">도구 호출에서 열기 ${icon("arrow-right", 12)}</button>` : ""}
      ${showReply ? html`<button class="btn sm" data-action="lens" data-lens="prompts">프롬프트에서 보기 ${icon("arrow-right", 12)}</button>` : ""}
    </div>
    <div class="now-body">${showReply ? md(lastReply.text, { numbers: new Map() }) : c ? html`${permissionBanner(c)}${rendererFor(c)(c)}` : html`<div class="dim">아직 호출이 없어요.</div>`}</div>
  </div>`;
}

function turnsCard(a) {
  const prompts = promptsOf(a.id);
  if (!prompts.length) return "";
  return html`<div class="card"><div class="card-h"><span class="grow">턴</span><span class="dim" style="font-weight:400">프롬프트 하나에 이어진 도구 호출</span></div>
    <div class="card-b turns">${[...prompts].reverse().map((p) => {
      const calls = callsOf(a.id).filter((c) => c.turn === p.n);
      return html`<button class="turn" data-action="open-prompt" data-agent="${a.id}" data-prompt="${p.n}">
        <span class="n">#${p.n}</span>
        <span style="min-width:0"><div class="q truncate">${p.text.split("\n")[0]}</div>
          <div class="ticks" aria-label="도구 호출 ${calls.length}개">${calls.map((c) => raw(`<i class="${c.status === "error" ? "err" : ""}" style="background:${kindColor(c)}" title="${esc(toolTitle(c))}"></i>`))}</div></span>
        <span class="t">${relTime(p.ts)}</span>
      </button>`;
    })}</div></div>`;
}

function agentOverview(a) {
  const s = agentStats(a.id);
  const tok = a.tokens.input + a.tokens.output + a.tokens.cacheRead + a.tokens.cacheWrite + (a.tokens.reasoning || 0);
  const firstPrompt = promptsOf(a.id)[0];
  const workSec = firstPrompt ? ((a.status === "working" || a.status === "blocked" ? Date.now() : a.sinceTs) - firstPrompt.ts) / 1000 : 0;
  return html`<div class="ov">
    <div class="ov-col">${nowCard(a)}${subsCard(a)}${turnsCard(a)}</div>
    <div class="ov-col">
      ${a.status === "offline" ? html`<div class="card"><div class="card-b dim" style="font-size:var(--fs-sm)">마지막으로 본 때: ${relTime(a.sinceTs)} · 기록은 연결되면 다시 읽어요.</div></div>` : html`<div class="stats">
        <div class="stat"><div class="k">토큰</div><div class="v">${fmtK(tok)}</div><div class="s">출력 ${fmtK(a.tokens.output)}</div></div>
        <div class="stat"><div class="k">작업 시간</div><div class="v">${fmtDurKo(workSec)}</div><div class="s">턴 ${s.prompts}회</div></div>
        <div class="stat"><div class="k">도구 호출</div><div class="v">${s.calls}</div><div class="s">${s.errors ? html`<span class="d">실패 ${s.errors}</span>` : "실패 없음"}</div></div>
        <div class="stat"><div class="k">바뀐 파일</div><div class="v">${s.files}</div><div class="s"><span class="a">+${s.add}</span> <span class="d">−${s.del}</span></div></div>
      </div>`}
      ${a.status === "offline" ? "" : html`${tokenCard(a)}${contextCard(a)}`}
      ${filesCard(a)}
    </div>
  </div>`;
}

/* ---- src/js/views/tools-lens.js ---- */
// Tools lens: calls (newest first, grouped by the prompt that caused them) beside the stage.

const scopeKey = () => STATE.scope;

function scopeCalls() {
  const list = STATE.scope === "all" ? DB.calls.filter((c) => !c.parent) : callsOf(STATE.scope);
  return [...list].sort((a, b) => b.ts - a.ts);
}

function filteredCalls() {
  const q = STATE.query.trim().toLowerCase();
  return scopeCalls().filter((c) => {
    if (STATE.kindFilter !== "all" && kindOf(c) !== STATE.kindFilter) return false;
    if (STATE.scope === "all" && STATE.agentFilter !== "all" && c.agent !== STATE.agentFilter) return false;
    if (!q) return true;
    return `${toolTitle(c)} ${toolTarget(c)} ${c.name}`.toLowerCase().includes(q);
  });
}

function selectedCallId() {
  const id = STATE.sel.call[scopeKey()];
  const list = filteredCalls();
  if (id && (list.some((c) => c.id === id) || callById(id)?.parent)) return id;
  return list[0]?.id || null;
}

function callRow(c, selected) {
  const a = agentById(c.agent);
  return html`<button class="item" role="option" aria-selected="${selected}" data-action="select-call" data-call="${c.id}" id="row-${c.id}">
    ${callStatusIcon(c)}
    ${STATE.scope === "all" ? html`<span title="${a.title}">${logo(a.app, 16)}</span>` : ""}
    <span style="color:${kindColor(c)};display:inline-flex">${toolIcon(c, 14)}</span>
    <span class="tname" style="color:${kindColor(c)}">${toolTitle(c)}</span>
    <span class="ttarget truncate grow">${toolTarget(c)}</span>
    ${digestHTML(c)}
    <span class="tdur">${c.status === "running" ? raw(`<span data-elapsed="${c.ts}">${fmtDur((Date.now() - c.ts) / 1000)}</span>`) : c.status === "pending" ? "" : fmtDur(c.dur)}</span>
  </button>`;
}

function kindChips(calls) {
  const counts = groupBy(calls, kindOf);
  const chip = (k, label, n) =>
    html`<button class="chip" data-action="kind" data-kind="${k}" aria-pressed="${STATE.kindFilter === k}">${k !== "all" ? raw(`<i style="width:7px;height:7px;border-radius:2px;background:${KINDS[k].color}"></i>`) : ""}${label} <span class="count">${n}</span></button>`;
  return html`<div class="chips">${chip("all", "전체", calls.length)}${Object.keys(KINDS)
    .filter((k) => counts[k])
    .map((k) => chip(k, KINDS[k].label, counts[k].length))}</div>`;
}

const LIST_PAGE = 400;

function callListView() {
  const all = scopeCalls();
  const matched = filteredCalls();
  // Thousands of rows re-render on every live update; draw the newest page, more on request.
  const limit = STATE.listLimit?.[scopeKey()] ?? LIST_PAGE;
  const list = matched.slice(0, limit);
  const more = matched.length - list.length;
  const sel = selectedCallId();
  const unseen = STATE.unseenCalls[scopeKey()] || 0;
  let body;
  if (!all.length) {
    body = html`<div class="empty"><div class="e-ico">${icon("terminal", 20)}</div><h3>도구 호출이 없어요</h3><p>${STATE.scope !== "all" && agentById(STATE.scope)?.status === "offline" ? "이 에이전트의 머신에 닿지 않아서 기록을 못 읽었어요." : "에이전트가 도구를 쓰면 여기에 쌓여요."}</p></div>`;
  } else if (!list.length) {
    body = html`<div class="empty"><div class="e-ico">${icon("search", 20)}</div><h3>맞는 호출이 없어요</h3><p>검색어나 종류 필터를 바꿔 보세요.</p><button class="btn sm" data-action="clear-filters">필터 지우기</button></div>`;
  } else if (STATE.scope === "all") {
    body = list.map((c) => callRow(c, c.id === sel));
  } else {
    const prompts = promptsOf(STATE.scope);
    const byTurn = groupBy(list, (c) => c.turn);
    body = Object.keys(byTurn)
      .map(Number)
      .sort((x, y) => y - x)
      .map((turn) => {
        const p = prompts.find((x) => x.n === turn);
        const quiet = !p || p.kind === "notice" || p.kind === "answer";
        const label = p ? (p.display ?? p.text).split("\n").find((l) => l.trim()) || (p.images ? `이미지 ${p.images}개` : "") : "프롬프트 전";
        // The list reads from the bottom up: a turn's calls, then the prompt that caused them.
        return html`${byTurn[turn].map((c) => callRow(c, c.id === sel))}<div class="list-sep ${quiet ? "quiet" : ""}">
          <span class="turn-n">#${turn}</span>${icon(quiet ? "info" : "message", 12)}
          ${p ? html`<button class="q" data-action="open-prompt" data-agent="${STATE.scope}" data-prompt="${turn}" title="이 프롬프트 보기">${label}</button>` : html`<span class="q">${label}</span>`}
          <span class="meta">호출 ${byTurn[turn].length}${p ? ` · ${relTime(p.ts)}` : ""}</span>
        </div>`;
      });
  }
  return html`<div class="list-tools">
      <div class="row">
        <label class="input grow">${icon("search", 14)}<input type="search" placeholder="도구 · 대상 검색" value="${STATE.query}" data-input="query" data-focus-key="q-tools" aria-label="도구 호출 검색"></label>
        <button class="btn sm" data-action="follow" aria-pressed="${STATE.follow}" title="새 호출을 따라가기 (f)">${STATE.follow ? raw('<span class="st" style="width:10px"><i style="width:7px;height:7px;border-radius:50%;background:#7fcf86;display:block"></i></span>') : icon("circle", 10)} 따라가기</button>
      </div>
      ${kindChips(all)}
      ${STATE.scope === "all"
        ? html`<div class="chips">${[{ id: "all", title: "모든 에이전트" }, ...DB.agents.filter((a) => callsOf(a.id).length)].map(
            (a) => html`<button class="chip" data-action="agent-filter" data-agent="${a.id}" aria-pressed="${STATE.agentFilter === a.id}">${a.id === "all" ? "" : logo(a.app, 13)} ${a.id === "all" ? a.title : a.title.length > 10 ? `${a.title.slice(0, 10)}…` : a.title}</button>`,
          )}</div>`
        : ""}
    </div>
    <div class="list-body" role="listbox" aria-label="도구 호출" data-keep-scroll="calls-${esc(scopeKey())}" tabindex="-1">
      ${unseen ? html`<button class="new-calls" data-action="jump-latest">${icon("chevron-up", 13)} 새 호출 ${unseen}개</button>` : ""}
      ${body}
      ${more > 0 ? html`<button class="more-row" data-action="more-calls">이전 호출 ${fmtInt(more)}개 더 보기</button>` : ""}
    </div>`;
}

function toolsLens() {
  const sel = selectedCallId();
  return html`<div class="split ${STATE.mobileDetail ? "has-detail" : ""}">
    <div class="pane-list" id="call-list">${callListView()}</div>
    <div class="pane-detail" id="stage" data-keep-scroll="stage">
      <button class="btn ghost sm back-btn" style="margin:10px 0 0 12px" data-action="mobile-back">${icon("arrow-left", 13)} 목록</button>
      ${stageView(sel ? callById(sel) : null)}
    </div>
  </div>`;
}

/* ---- src/js/views/links.js ---- */
// Links lens: every link in the conversation, told apart by who brought it (yours, in a prompt;
// the agent's, in a reply), grouped by that prompt or reply, with the sentence it came from
// and the URL taken apart.

function scopeLinks() {
  const list = STATE.scope === "all" ? allLinks() : linksOf(STATE.scope);
  const q = STATE.linkQuery.trim().toLowerCase();
  const from = uiGet("links:from", "all");
  return list.filter((l) => (from === "all" || l.from === from) && (STATE.linkDomain === "all" || hostOf(l.url) === STATE.linkDomain) && (!q || `${l.title} ${l.url}`.toLowerCase().includes(q)));
}

function selectedLink(list) {
  const key = STATE.sel.link[scopeKey()];
  return list.find((l) => l.key === key) || list[0] || null;
}

function linkRow(l, selected) {
  return html`<button class="link-row" role="option" aria-selected="${selected}" data-action="select-link" data-key="${l.key}">
    <span class="n">[${l.n}]</span>${fav(l.url, 22)}
    <span style="min-width:0"><div class="ti truncate">${l.title}</div><div class="do"><span class="truncate">${hostOf(l.url)}</span>${l.badge ? html`<span class="lbadge ${l.badge.cls}">${l.badge.text}</span>` : ""}</div></span>
  </button>`;
}

function linkGroups(list, sel) {
  const byReply = groupBy(list, (l) => `${l.agent}:${l.from}:${l.srcN}`);
  const keys = Object.keys(byReply).sort((x, y) => byReply[y][0].replyTs - byReply[x][0].replyTs);
  let lastAgent = null;
  return keys.map((k) => {
    const items = byReply[k];
    const a = agentById(items[0].agent);
    const agentHead = STATE.scope === "all" && a.id !== lastAgent ? html`<div class="list-sep" style="color:var(--muted);font-weight:600">${logo(a.app, 14)} ${a.title}</div>` : "";
    lastAgent = a.id;
    const mine = items[0].from === "user";
    return html`${agentHead}<div class="list-sep link-src ${mine ? "mine" : ""}"><span>${icon(mine ? "message" : "bot", 12)} ${mine ? `내가 보낸 링크 · 프롬프트 #${items[0].srcN}` : `에이전트 답변 #${items[0].srcN}`} · ${relTime(items[0].replyTs)} · ${items.length}개</span></div>${items.map((l) => linkRow(l, sel && l.key === sel.key))}`;
  });
}

function urlAnatomy(url) {
  const u = parseUrl(url);
  if (!u) return html`<div class="anatomy">${url}</div>`;
  const params = [...u.searchParams.entries()];
  return html`<div class="anatomy"><span class="sch">${u.protocol}//</span><span class="hst">${u.host}</span><span class="pth">${decodeURIComponent(u.pathname)}</span>${u.search ? html`<span class="qry">${u.search}</span>` : ""}${u.hash ? html`<span class="frg">${decodeURIComponent(u.hash)}</span>` : ""}
    ${params.length ? html`<div class="qtable">${params.map(([k, v]) => html`<span class="k">${k}</span><span class="v">${v}</span>`)}</div>` : ""}
  </div>`;
}

function linkDetail(l, list) {
  if (!l) return html`<div class="empty"><div class="e-ico">${icon("link", 20)}</div><h3>링크를 고르세요</h3></div>`;
  const a = agentById(l.agent);
  const mine = l.from === "user";
  const reply = mine ? promptsOf(l.agent).find((p) => p.n === l.srcN) : DB.replies.find((r) => r.agent === l.agent && r.n === l.reply);
  const quote = (() => {
    const text = esc(l.context);
    const label = esc(l.label || l.url);
    const i = text.indexOf(label);
    if (i < 0) return raw(`${text}<sup>${l.n}</sup>`);
    return raw(`${text.slice(0, i)}<span class="hl">${label}</span><sup>${l.n}</sup>${text.slice(i + label.length)}`);
  })();
  const sameHost = list.filter((x) => hostOf(x.url) === hostOf(l.url) && x.key !== l.key);
  const siblings = (reply?.links ?? []).filter((x) => x.url !== l.url);
  const mdLink = `[${l.title}](${l.url})`;
  return html`<div class="link-detail">
    <div class="ld-head">${fav(l.url, 44)}<div style="min-width:0"><h2>${l.title}</h2><div class="host">${hostOf(l.url)}${l.badge ? html` · <span class="lbadge ${l.badge.cls}">${l.badge.text}</span>` : ""}</div></div></div>
    <div class="ld-actions">
      <a class="btn primary" href="${l.url}" target="_blank" rel="noopener noreferrer">${icon("external", 14)} 열기</a>
      <button class="btn" data-action="copy" data-copy="${l.url}">${icon("copy", 14)} URL 복사</button>
      <button class="btn" data-action="copy" data-copy="${mdLink}">${icon("copy", 14)} 마크다운으로 복사</button>
    </div>
    <div class="ld-label">${mine ? "프롬프트 속 문장" : "답변 속 문장"} <span class="chip ${mine ? "mine" : ""}">${mine ? "내가 보낸 링크" : "에이전트 답변"}</span></div>
    <div class="quote">${quote}</div>
    <div class="quote-meta">${logo(a.app, 14)} ${a.title} · ${mine ? `프롬프트 #${l.srcN}` : `답변 #${l.reply}`} · ${clock(l.replyTs)} (${relTime(l.replyTs)})
      <button class="btn ghost sm" data-action="open-prompt" data-agent="${l.agent}" data-prompt="${l.turn}">${mine ? "이 프롬프트 보기" : "이 답변의 프롬프트"} ${icon("arrow-right", 12)}</button></div>
    <div class="ld-label">주소 뜯어보기</div>
    ${urlAnatomy(l.url)}
    ${siblings.length ? html`<div class="ld-label">${mine ? "같은 프롬프트의 다른 링크" : "같은 답변의 다른 링크"}</div><div class="chips">${siblings.map((x) => html`<button class="chip" data-action="select-link" data-key="${l.agent}:${mine ? `p${l.srcN}` : l.reply}:${x.n}">${fav(x.url, 14)} <span class="chip-t">[${x.n}] ${x.title}</span></button>`)}</div>` : ""}
    ${sameHost.length ? html`<div class="ld-label">${hostOf(l.url)}의 다른 링크 ${sameHost.length}개</div><div class="chips">${sameHost.map((x) => html`<button class="chip" data-action="select-link" data-key="${x.key}"><span class="chip-t">${x.title}</span></button>`)}</div>` : ""}
  </div>`;
}

function linksLens() {
  const base = STATE.scope === "all" ? allLinks() : linksOf(STATE.scope);
  const list = scopeLinks();
  const sel = selectedLink(list);
  const domains = Object.entries(groupBy(base, (l) => hostOf(l.url)))
    .sort((x, y) => y[1].length - x[1].length)
    .slice(0, 6);
  const allMd = list.map((l) => `- [${l.title}](${l.url})`).join("\n");
  const from = uiGet("links:from", "all");
  const mineCount = base.filter((l) => l.from === "user").length;
  let body;
  if (!base.length) {
    body = html`<div class="empty"><div class="e-ico">${icon("link", 20)}</div><h3>링크가 없어요</h3><p>프롬프트에 넣은 링크와 에이전트 답변에 나온 링크가 여기 모여요. 코드 블록 안의 주소는 빼요.</p></div>`;
  } else if (!list.length) {
    body = html`<div class="empty"><h3>맞는 링크가 없어요</h3><button class="btn sm" data-action="clear-link-filters">필터 지우기</button></div>`;
  } else body = linkGroups(list, sel);
  return html`<div class="split ${STATE.mobileDetail ? "has-detail" : ""}">
    <div class="pane-list">
      <div class="list-tools">
        <div class="row">
          <label class="input grow">${icon("search", 14)}<input type="search" placeholder="제목 · 주소 검색" value="${STATE.linkQuery}" data-input="linkQuery" data-focus-key="q-links" aria-label="링크 검색"></label>
          <button class="btn sm" data-action="copy" data-copy="${allMd}" ${list.length ? "" : raw("disabled")} title="보이는 링크를 마크다운 목록으로">${icon("copy", 13)} 전부</button>
        </div>
        <div class="seg" role="group" aria-label="누구의 링크인지">${[["all", `전체 ${base.length}`], ["user", `내가 보낸 ${mineCount}`], ["agent", `에이전트 답변 ${base.length - mineCount}`]].map(
          ([id, label]) => html`<button data-action="ui-set" data-key="links:from" data-value="${id}" aria-pressed="${from === id}">${label}</button>`,
        )}</div>
        ${domains.length > 1 ? html`<div class="chips"><button class="chip" data-action="link-domain" data-domain="all" aria-pressed="${STATE.linkDomain === "all"}">전체 <span class="count">${base.length}</span></button>${domains.map(
          ([d, ls]) => html`<button class="chip" data-action="link-domain" data-domain="${d}" aria-pressed="${STATE.linkDomain === d}">${fav(`https://${d}`, 13)} <span class="chip-t">${d}</span> <span class="count">${ls.length}</span></button>`,
        )}</div>` : ""}
      </div>

      ${linkDetail(sel, base)}

  </div>`;
}

// Prompts lens: what you asked, by day (prompt-history), and what each prompt set off.

function scopePrompts() {
  const list = STATE.scope === "all" ? DB.prompts : promptsOf(STATE.scope);
  return [...list].sort((a, b) => b.ts - a.ts);
}

const promptKey = (p) => `${p.agent}:${p.n}`;

function selectedPrompt(list) {
  const key = STATE.sel.prompt[scopeKey()];
  return list.find((p) => promptKey(p) === key) || list[0] || null;
}

function oneLine(text) {
  return raw(
    text
      .split("\n")
      .filter((l, i, arr) => l.trim() || i < arr.length - 1)
      .map((l) => esc(l.trim()))
      .join('<span class="nl">↵</span>'),
  );
}

function promptRow(p, selected) {
  const a = agentById(p.agent);
  return html`<button class="prompt-row" role="option" aria-selected="${selected}" data-action="select-prompt" data-key="${promptKey(p)}">
    <span class="n">${p.n}</span>
    <span class="row" style="min-width:0;gap:7px">${STATE.scope === "all" ? logo(a.app, 15) : ""}<span class="truncate">${oneLine(p.text)}</span></span>
    <span class="rt" data-rel="${p.ts}">${relTime(p.ts)}</span>
  </button>`;
}

function turnSummary(p) {
  const calls = callsOf(p.agent).filter((c) => c.turn === p.n);
  const next = promptsOf(p.agent).find((x) => x.n === p.n + 1);
  // Every answer of the turn, in order: an agent that thinks between steps answers several times.
  const replies = repliesOf(p.agent).filter((r) => r.turn === p.n).sort((x, y) => x.ts - y.ts);
  const reply = replies[replies.length - 1] ?? null;
  const end = reply ? reply.ts : next ? next.ts : Date.now();
  const files = uniq(calls.filter((c) => kindOf(c) === "edit").flatMap((c) => (c.name === "apply_patch" ? patchFiles(c.input.patch).map((f) => f.path) : [c.input.file_path])));
  const running = calls.some((c) => c.status === "running" || c.status === "pending");
  return { calls, reply, replies, files, secs: (end - p.ts) / 1000, running };
}

function promptDetail(p) {
  if (!p) return html`<div class="empty"><div class="e-ico">${icon("message", 20)}</div><h3>보낸 프롬프트가 없어요</h3></div>`;
  const a = agentById(p.agent);
  const t = turnSummary(p);
  const textHTML = raw(esc(p.text) + (p.images ? Array.from({ length: p.images }, (_, k) => ` <span class="att">${icon("image", 13).s} [Image #${k + 1}]</span>`).join("") : ""));
  const me = /^data:image\/(png|jpeg|webp|gif);base64,/.test(LIVE.me?.avatar ?? "") ? raw(`<img class="cav" src="${LIVE.me.avatar}" alt="나">`) : raw('<span class="cav me">나</span>');
  // Laid out like a chat in KakaoTalk's high-contrast look: what the prompt did first, then your
  // message (yellow, right) and the agent's answer (dark, left), both nearly full width.
  return html`<div class="prompt-detail">
    <div class="pd-head">
      <span class="no">#${p.n}</span><span>${clock(p.ts)} · <span data-rel="${p.ts}">${relTime(p.ts)}</span></span>
      ${STATE.scope === "all" ? html`<span class="chip">${logo(a.app, 13)} ${a.title}</span>` : ""}
      <span class="grow"></span>
      <button class="btn sm" data-action="copy" data-copy="${p.text}">${icon("copy", 13)} 복사</button>
      ${t.calls.length ? html`<button class="btn sm primary" data-action="open-call" data-agent="${p.agent}" data-call="${[...t.calls].sort((x, y) => x.ts - y.ts)[0].id}" title="이 프롬프트가 부른 도구 호출로 이동">${icon("terminal", 13)} 이 턴의 호출 ${t.calls.length}개</button>` : ""}
    </div>
    <div class="ld-label" style="margin-top:14px">이 프롬프트가 한 일</div>
    <div class="after">
      <div class="stat"><div class="k">걸린 시간</div><div class="v">${t.running ? html`<span class="pulse" style="color:var(--working)">진행 중</span>` : fmtDurKo(t.secs)}</div></div>
      <div class="stat"><div class="k">도구 호출</div><div class="v">${t.calls.length}</div></div>
      <div class="stat"><div class="k">바뀐 파일</div><div class="v">${t.files.length}</div></div>
      <div class="stat"><div class="k">답변 속 링크</div><div class="v">${t.replies.reduce((n, r) => n + r.links.length, 0)}</div></div>
    </div>
    ${t.calls.length ? html`<div class="strip">${[...t.calls].sort((x, y) => x.ts - y.ts).map(
      (c) => html`<button data-action="open-call" data-agent="${c.agent}" data-call="${c.id}" title="${toolTarget(c)}"><span style="color:${kindColor(c)};display:inline-flex">${toolIcon(c, 13)}</span><b>${toolTitle(c)}</b><span class="truncate mono" style="font-size:11px">${toolTarget(c)}</span></button>`,
    )}</div>` : ""}
    <div class="chat">
      <div class="lights chat-lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="cmsg me"><div class="cbody">
        ${p.images && p.at != null ? html`<div class="pd-imgs ${p.images > 1 ? "many" : ""}" style="--cols:${Math.min(p.images, 3)}">${Array.from({ length: Math.min(p.images, 8) }, (_x, k) => promptImage(p.agent, p.at, k))}</div>` : ""}
        <div class="cbubble pd-text">${textHTML}</div></div>${me}</div>
      <div class="cmsg ai"><span class="cav ai">${logo(a.app, 22)}</span><div class="cbody">
        ${t.replies.map((r) => html`<div class="cbubble reply">${md(r.text, { numbers: new Map() })}</div><div class="ctime">${clock(r.ts)}</div>`)}
        ${t.running ? html`<div class="cbubble reply dim">아직 답하는 중이에요…</div>` : t.replies.length ? "" : html`<div class="cbubble reply dim">답변이 없어요.</div>`}</div></div>
    </div>
  </div>`;
}

function promptsLens() {
  const list = scopePrompts();
  const sel = selectedPrompt(list);
  const byDay = groupBy(list, (p) => dayKey(p.ts));
  const body = list.length
    ? Object.values(byDay).map((ps) => html`<div class="list-sep"><span>${dayLabel(ps[0].ts)}</span></div>${ps.map((p) => promptRow(p, sel && promptKey(p) === promptKey(sel)))}`)

/* ---- src/js/views/diffs.js ---- */
// Changes lens (diff-explorer): the files an agent changed, as a VS Code-like tree and a
// cumulative diff from before its first touch.

// Before/after texts load on demand from the server: the file as the agent first found it
// (Claude records it; else the last commit) and the file as it is now.
const FILE_TEXTS = new Map();

function fileTexts(f) {
  const key = `${f.key}@${f.last}`;
  const hit = FILE_TEXTS.get(key);
  if (hit) return hit;
  FILE_TEXTS.set(key, { state: "loading" });
  loadTexts(f)
    .then((value) => FILE_TEXTS.set(key, { state: "ready", ...value }))
    .catch((error) => FILE_TEXTS.set(key, { state: "error", error: String(error.message ?? error) }))
    .finally(renderAll);
  return FILE_TEXTS.get(key);
}

async function loadTexts(f) {
  const q = (path) => `agent=${encodeURIComponent(f.agent)}&path=${encodeURIComponent(path)}`;
  const now = await (await api(`/api/current?${q(f.abs)}`)).json();
  if (now.tooLarge) throw new Error("파일이 2MB가 넘어서 비교하지 않았어요");
  const after = now.missing ? "" : now.text;
  if (f.status === "A") return { before: "", after, source: "new" };
  const agent = agentById(f.agent);
  if (agent?.provider === "claude") {
    const original = await (await api(`/api/original?${q(f.abs)}`)).json();
    if (original.found) return { before: original.created ? "" : original.text, after, source: "original" };
  }
  const head = await (await api(`/api/head?${q(f.abs)}`)).json();
  if (!head.found) throw new Error("처음 내용을 찾지 못했어요 (기록에도, 마지막 커밋에도 없어요)");
  return { before: head.text, after, source: "head" };
}

function repoName(a) {
  return baseName(a.cwd);
}

function scopeFiles() {
  const list = STATE.scope === "all" ? DB.files : filesOf(STATE.scope);
  return list.map((f) => {
    const a = agentById(f.agent);
    const display = STATE.scope === "all" && !f.path.startsWith("~") ? `${repoName(a)}/${f.path}` : f.path;
    return { ...f, key: `${f.agent}:${f.path}`, display, touchedBy: f.calls };
  });
}

function selectedFile(list) {
  const key = STATE.sel.file[scopeKey()];
  return list.find((f) => f.key === key) || list[0] || null;
}

function gutterFor(f, t) {
  const rows = diffRows(t.before, t.after, "text");
  const marks = {};
  let pendingDel = false;
  for (const r of rows) {
    if (r.t === "del") pendingDel = true;
    else {
      if (r.t === "add") marks[r.b] = r.pair ? "g-mod" : "g-add";
      else if (pendingDel) marks[r.b] = "g-del";
      pendingDel = false;
    }
  }
  return (n) => marks[n] || "";
}

function treeView(list, sel) {
  const tree = buildTree(list, (f) => f.display);
  const rows = [];
  const walk = (node, depth) => {
    const dirs = [...node.dirs].sort((a, b) => a.name.localeCompare(b.name));
    for (const d of dirs) {
      const closed = STATE.openFolds.has(`dx:${d.path}`);
      rows.push(
        html`<button class="tn dir" data-action="unfold" data-fold="dx:${d.path}" aria-expanded="${!closed}" style="padding-left:${6 + depth * 14}px">${guides(depth)}<span class="chev">${icon(closed ? "chevron-right" : "chevron-down", 12)}</span>${folderIcon(baseName(d.name))}<span class="nm">${d.name}</span></button>`,
      );
      if (!closed) walk(d, depth + 1);
    }
    for (const fnode of node.files) {
      const f = fnode.item;
      const s = fileStats(f);
      const t = FILE_TEXTS.get(`${f.key}@${f.last}`);
      const reverted = t?.state === "ready" && t.before === t.after;
      rows.push(
        html`<button class="tn st-${f.status} ${reverted ? "reverted" : ""}" role="option" aria-selected="${sel && f.key === sel.key}" data-action="select-file" data-key="${f.key}" style="padding-left:${6 + depth * 14 + 14}px" title="${f.display} · +${s.add} −${s.del}">${guides(depth)}${fileIcon(f.path)}<span class="nm">${fnode.name}</span><span class="gs ${reverted ? "R" : f.status}">${reverted ? "↺" : f.status}</span></button>`,
      );
    }
  };
  const guides = (depth) => raw(Array.from({ length: depth }, (_, k) => `<span class="guide" style="left:${13 + k * 14}px"></span>`).join(""));
  walk(tree, 0);
  return rows;
}

function diffBody(f) {
  const t = fileTexts(f);
  if (t.state === "loading") return html`<div class="empty"><div class="e-ico">${spinner(18)}</div><p>처음 내용과 지금 파일을 읽는 중…</p></div>`;
  if (t.state === "error") return html`<div class="empty"><div class="e-ico">${icon("info", 20)}</div><h3>비교할 수 없어요</h3><p>${t.error}. 위의 호출을 누르면 편집마다 바뀐 부분을 볼 수 있어요.</p></div>`;
  const view = STATE.diff.view;
  const lang = langOf(f.path);
  if (view === "file") {
    const text = f.status === "D" ? t.before : t.after;
    return codeView(text, { lang, wrap: STATE.diff.wrap, gutter: f.status === "D" ? () => "" : gutterFor(f, t), scrollKey: `dx-file-${f.key}` });
  }
  if (t.before === t.after) return html`<div class="empty"><h3>원래대로 돌아왔어요</h3><p>이 파일은 수정됐다가 처음 내용으로 되돌아갔어요.</p></div>`;
  return html`<div class="dim" style="padding:8px 14px;font-size:var(--fs-xs)">${icon("info", 12)} ${t.source === "head" ? "기준: 마지막 커밋(HEAD) → 지금 파일" : t.source === "new" ? "새로 만든 파일" : "기준: 에이전트가 처음 고치기 직전 → 지금 파일"}</div>
    ${renderDiff(t.before, t.after, { lang, mode: STATE.diff.mode, wrap: STATE.diff.wrap, foldKey: `f:${f.key}`, openFolds: STATE.openFolds })}`;
}

function fileHeader(f, idx, total) {
  const s = fileStats(f);
  const parts = f.display.split("/");
  const name = parts.pop();
  const totalLines = s.add + s.del || 1;
  const nA = Math.round((s.add / totalLines) * 5);
  const nD = Math.min(5 - nA, Math.round((s.del / totalLines) * 5));
  const blocks = raw(`<span class="blocks" aria-hidden="true">${Array.from({ length: 5 }, (_, k) => `<i class="${k < nA ? "a" : k < nA + nD ? "d" : ""}"></i>`).join("")}</span>`);
  return html`<div class="dv-head">
    <div class="crumbs truncate">${parts.map((p) => html`<span>${p}</span><span class="sep">›</span>`)}${fileIcon(f.path)} <b>${name}</b></div>
    ${f.status === "A" ? html`<span class="patch-op add">NEW</span>` : f.status === "D" ? html`<span class="patch-op del">DELETED</span>` : ""}
    <span class="grow"></span>
    ${s.lock ? html`<span class="chip">lockfile</span>` : html`${plusMinusHTML(s.add, s.del)}${blocks}`}
    <div class="row" style="gap:2px">
      <button class="btn ghost sm icon" data-action="file-step" data-step="-1" title="이전 파일 (p)" aria-label="이전 파일">${icon("chevron-left", 14)}</button>
      <span class="num dim" style="font-size:var(--fs-xs);min-width:30px;text-align:center">${idx + 1}/${total}</span>
      <button class="btn ghost sm icon" data-action="file-step" data-step="1" title="다음 파일 (n)" aria-label="다음 파일">${icon("chevron-right", 14)}</button>
    </div>
  </div>`;
}

function diffsLens() {
  const list = scopeFiles();
  const sel = selectedFile(list);
  if (!list.length) {
    const a = STATE.scope !== "all" ? agentById(STATE.scope) : null;
    return html`<div class="empty" style="flex:1"><div class="e-ico">${icon("diff", 20)}</div><h3>바뀐 파일이 없어요</h3><p>${a ? `${a.title}은(는) 이 세션에서 파일을 고치지 않았어요. 읽기와 조사만 했어요.` : "에이전트가 파일을 고치면 여기에 모여요."}</p></div>`;
  }
  const all = list.map(fileStats);
  const idx = list.findIndex((f) => f.key === sel.key);
  const touched = (sel.touchedBy || []).map(callById).filter(Boolean).slice(-12);
  const d = STATE.diff;
  return html`<div class="dx ${d.tree ? "" : "no-tree"}">
    <div class="tree-pane">
      <div class="tree-head"><span class="grow">EXPLORER · 바뀐 파일만</span><button class="btn ghost sm icon" data-action="collapse-tree" title="모두 접기" aria-label="폴더 모두 접기">${icon("fold", 13)}</button></div>
      <div class="tree" role="listbox" aria-label="바뀐 파일" data-keep-scroll="tree-${esc(scopeKey())}">${treeView(list, sel)}</div>
    </div>
    <div class="dv">
      <div class="dv-tools">
        <button class="btn ghost sm" data-action="diff-tree" aria-pressed="${d.tree}" title="탐색기 (t)">${icon("panel-left", 13)} 탐색기</button>
        <span style="font-size:var(--fs-sm)">파일 <b>${list.length}</b>개 ${plusMinusHTML(sum(all, (s) => s.add), sum(all, (s) => s.del))}</span>
        <span class="grow"></span>
        <div class="seg" role="group" aria-label="보기">
          <button data-action="diff-set" data-key="view" data-value="diff" aria-pressed="${d.view === "diff"}">${icon("diff", 12)} Diff</button>
          <button data-action="diff-set" data-key="view" data-value="file" aria-pressed="${d.view === "file"}">${icon("file", 12)} 파일</button>
        </div>
        <div class="seg" role="group" aria-label="diff 배치" ${d.view === "file" ? raw('style="opacity:.4;pointer-events:none"') : ""}>
          <button data-action="diff-set" data-key="mode" data-value="unified" aria-pressed="${d.mode === "unified"}">${icon("rows", 12)} 한 줄</button>
          <button data-action="diff-set" data-key="mode" data-value="split" aria-pressed="${d.mode === "split"}">${icon("columns", 12)} 나란히</button>
        </div>
        <button class="btn ghost sm" data-action="diff-set" data-key="wrap" data-value="${!d.wrap}" aria-pressed="${d.wrap}" title="줄바꿈 (w)">${icon("wrap", 13)} 줄바꿈</button>
      </div>
      ${fileHeader(sel, idx, list.length)}
      ${touched.length ? html`<div class="dv-tools touched">이 파일을 바꾼 호출 ${touched.map((c) => html`<button class="chip" data-action="open-call" data-agent="${c.agent}" data-call="${c.id}"><span style="color:${kindColor(c)};display:inline-flex">${toolIcon(c, 12)}</span>${toolTitle(c)} · ${hhmm(c.ts)}</button>`)}<span class="dim">· 기준점은 처음 건드리기 직전 내용</span></div>` : ""}
      <div class="dv-body" data-keep-scroll="dv-${esc(sel.key)}">${diffBody(sel)}</div>
    </div>
  </div>`;
}

/* ---- src/js/views/subs.js ---- */
// 하위 에이전트: the terminals an agent started with `hc run`, as a tree (who started whom),
// and for the one picked: what it was asked, its steps (newest first) and what it reported.

const STEP_LIMIT = 150;

/** Tree rows for the scope: an agent's descendants, or (all) every agent that has some. */
function subRows() {
  if (STATE.scope !== "all") return subsOf(STATE.scope);
  return DB.roster.roots.filter((r) => DB.roster.kids[r]?.length).flatMap((r) => [{ node: DB.roster.nodes[r], lines: [], head: true }, ...subsOf(r)]);
}

function pickedSub() {
  const rows = subRows();
  const subs = rows.filter((r) => !r.head);
  if (!subs.length) return null;
  const id = uiGet(`sub:${STATE.scope}`, null);
  const hit = rows.find((r) => r.node.id === id);
  return (hit ?? subs.find((r) => r.node.status === "working") ?? subs.find((r) => r.node.isAgent && r.node.state === "live") ?? subs.find((r) => r.node.isAgent) ?? subs[0]).node;
}

function subStepLine(a) {
  if (!a.isAgent) return a.command;
  const calls = callsOf(a.id);
  if (!calls.length) return a.task ? a.task.split("\n")[0] : a.note ? "기록 없음" : a.loaded ? "아직 도구를 쓰지 않았어요" : "기록을 읽는 중…";
  const last = calls[calls.length - 1];
  return `${toolTitle(last)} ${toolTarget(last)}`.trim();
}

const subElapsed = (a) => (a.created ? fmtDurKo(((a.finished ?? Date.now()) - a.created) / 1000) : "");

function subTreeRow({ node: a, lines, head }, picked) {
  const calls = callsOf(a.id).length;
  return html`<button class="sub-row ${a.state === "ended" ? "ended" : ""} ${head ? "head" : ""}" role="option" aria-selected="${picked?.id === a.id}" data-action="pick-sub" data-sub="${a.id}">
    ${treeLines(lines)}${logo(a.app, head ? 24 : 22)}
    <span class="grow" style="min-width:0">
      <span class="t"><span class="truncate">${a.title}</span><span class="addr mono">${a.id}</span></span>
      <span class="s mono truncate ${a.status === "working" ? "working" : ""}">${subStepLine(a)}</span>
    </span>
    <span class="r">${statusGlyph(a, 13)}<span>${calls ? `호출 ${fmtInt(calls)}` : subElapsed(a)}</span></span>
  </button>`;
}

function subCrumbs(a) {
  const chain = parentsOf(a.id).reverse().map(agentById).filter(Boolean);
  return html`<nav class="sub-crumbs" aria-label="띄운 순서">${chain.map(
    (p) => html`<button data-action="${p.sub ? "pick-sub" : "scope"}" data-sub="${p.id}" data-scope="${p.id}">${logo(p.app, 15)}<span class="truncate">${p.title}</span></button>${icon("chevron-right", 12)}`,
  )}<b>${a.title}</b></nav>`;
}

function subSteps(a) {
  const all = callsOf(a.id);
  const calls = all.slice(-STEP_LIMIT).reverse();
  const prompts = promptsOf(a.id);
  const byTurn = groupBy(calls, (c) => c.turn);
  const turns = Object.keys(byTurn).map(Number).sort((x, y) => y - x);
  return html`<h2 class="section-title">단계 <small>${fmtInt(all.length)} · 최신이 위 · 누르면 그 호출을 열어요</small></h2>
    <div class="sub-steps">${turns.map((turn) => {
      const p = prompts.find((x) => x.n === turn);
      const label = p ? (p.display ?? p.text).split("\n").find((l) => l.trim()) || "" : "프롬프트 전";
      return html`<div class="sub-turn"><span class="n">#${turn}</span><span class="truncate grow">${label}</span>${p ? html`<span class="dim">${relTime(p.ts)}</span>` : ""}</div>
        ${byTurn[turn].map(
          (c) => html`<button class="item" data-action="open-call" data-agent="${a.id}" data-call="${c.id}">
            ${callStatusIcon(c)}<span style="color:${kindColor(c)};display:inline-flex">${toolIcon(c, 14)}</span>
            <span class="tname" style="color:${kindColor(c)}">${toolTitle(c)}</span><span class="ttarget truncate grow">${toolTarget(c)}</span>
            ${digestHTML(c)}<span class="tdur">${c.status === "running" ? "" : fmtDur(c.dur)}</span>
          </button>`,
        )}`;
    })}</div>
    ${all.length > calls.length ? html`<button class="more-row" data-action="open-lens" data-agent="${a.id}" data-lens="tools">이전 단계 ${fmtInt(all.length - calls.length)}개는 '자세히 보기'에서</button>` : ""}`;
}

function subDetail(a) {
  const time = a.state === "ended"
    ? `${subElapsed(a)} 동안 실행 · ${relTime(a.finished)} 끝남${a.exit ? ` · 종료 코드 ${a.exit}` : a.reason === "killed" ? " · 중지됨" : ""}`
    : `${subElapsed(a)} 전 시작`;
  const head = html`${subCrumbs(a)}
    <div class="sub-head">
      ${logo(a.app, 36)}
      <div class="grow" style="min-width:0">
        <div class="sub-title"><h2 class="truncate">${a.title}</h2><span class="chip mono">${a.id}</span>${a.inferred ? html`<span class="chip" title="시작 시각과 맡긴 일로 이 하위 에이전트의 기록을 골랐어요">추정 연결</span>` : ""}${statusPillFor(a)}</div>
        <div class="dim truncate" style="font-size:var(--fs-sm)">${[a.model, a.cwd, time].filter(Boolean).join(" · ")}</div>
      </div>
      ${a.isAgent && a.provider && !a.note ? html`<button class="btn" data-action="scope-a" data-scope="${a.id}" title="이 하위 에이전트의 도구 호출·프롬프트·변경을 렌즈로 봐요">${icon("arrow-right", 14)}<span>자세히 보기</span></button>` : ""}
    </div>`;
  if (!a.isAgent) {
    return html`${head}<div class="sub-box"><div class="k">실행한 명령</div><pre class="mono">${a.command}</pre></div>
      <p class="dim" style="font-size:var(--fs-sm)">에이전트가 아닌 프로그램이라 단계 기록은 없어요. 화면은 herdr에서 볼 수 있어요.</p>`;
  }
  const prompts = promptsOf(a.id);
  const task = a.task ?? (prompts.find((p) => LS.isHumanPrompt(p)) ?? prompts[0])?.text ?? null;
  const replies = repliesOf(a.id);
  const reply = replies[replies.length - 1];
  const s = agentStats(a.id);
  const tok = a.tokens.input + a.tokens.output + a.tokens.cacheRead + a.tokens.cacheWrite;
  const taskBox = task ? html`<div class="sub-box"><div class="k">맡긴 일</div><div class="task">${task.length > 1500 ? `${task.slice(0, 1500)}…` : task}</div></div>` : "";
  if (!a.provider) return html`${head}${taskBox}<p class="dim" style="font-size:var(--fs-sm)">이 프로그램의 기록 형식은 읽지 못해요. Claude Code와 Codex의 단계만 보여요.</p>`;
  if (!a.loaded) return html`${head}${taskBox}<p class="dim" style="font-size:var(--fs-sm)">기록을 읽는 중이에요…</p>`;
  if (a.note) return html`${head}${taskBox}<p class="dim" style="font-size:var(--fs-sm)">이 하위 에이전트의 대화 기록 파일을 찾지 못했어요.</p>`;
  return html`${head}${taskBox}
    ${reply && a.status !== "working" ? html`<div class="sub-box"><div class="k">마지막 답변 · ${relTime(reply.ts)}</div><div class="reply">${md(reply.text.length > 1500 ? `${reply.text.slice(0, 1500)}…` : reply.text)}</div></div>` : ""}
    <div class="stats">
      <div class="stat"><div class="k">도구 호출</div><div class="v">${s.calls}</div><div class="s">${s.errors ? html`<span class="d">실패 ${s.errors}</span>` : "실패 없음"}</div></div>
      <div class="stat"><div class="k">바뀐 파일</div><div class="v">${s.files}</div><div class="s"><span class="a">+${s.add}</span> <span class="d">−${s.del}</span></div></div>
      <div class="stat"><div class="k">토큰</div><div class="v">${fmtK(tok)}</div><div class="s">출력 ${fmtK(a.tokens.output)}</div></div>
    </div>
    ${s.calls ? subSteps(a) : html`<p class="dim" style="font-size:var(--fs-sm)">아직 도구를 쓰지 않았어요.</p>`}`;
}

function subsLens() {
  const rows = subRows();
  const subs = rows.filter((r) => !r.head);
  if (!subs.length) {
    return html`<div class="empty"><div class="e-ico">${icon("workflow", 20)}</div><h3>하위 에이전트가 없어요</h3><p>에이전트가 <span class="mono">hc run</span>으로 다른 에이전트나 프로그램을 띄우면, 누가 누구를 띄웠는지와 각자의 단계가 여기 나타나요.</p></div>`;
  }
  const picked = pickedSub();
  const live = subs.filter((r) => r.node.state === "live").length;
  return html`<div class="split ${STATE.mobileDetail ? "has-detail" : ""}">
    <div class="pane-list">
      <div class="list-tools"><div class="row" style="font-size:var(--fs-sm)">${icon("workflow", 14)}<b>하위 에이전트 ${subs.length}</b><span class="dim">실행 중 ${live} · 끝남 ${subs.length - live}</span></div></div>
      <div class="list-body sub-tree" role="listbox" aria-label="하위 에이전트" data-keep-scroll="subs-${esc(STATE.scope)}">${rows.map((r) => subTreeRow(r, picked))}</div>
    </div>
    <div class="pane-detail sub-detail" data-keep-scroll="sub-detail">
      <button class="btn ghost sm back-btn" data-action="mobile-back">${icon("arrow-left", 13)} 목록</button>
      ${subDetail(picked)}
    </div>
  </div>`;
}

/** The overview's block: this agent's sub-agents at a glance. */
function subsCard(a) {
  const rows = subsOf(a.id);
  if (!rows.length) return "";
  const shown = rows.slice(0, 8);
  return html`<div class="card"><div class="card-h"><span class="grow">하위 에이전트 <span class="dim" style="font-weight:400">${rows.length}</span></span><button class="btn ghost sm" data-action="lens" data-lens="subs">모두 보기 ${icon("arrow-right", 12)}</button></div>
    <div class="card-b sub-tree" style="padding:6px">${shown.map((r) => subTreeRow(r, null))}</div></div>`;
}

// Prototype strip, product top bar and concept A (control room: rail | head + lens).

const LENSES = [
  { id: "overview", label: "개요", icon: "activity" },
  { id: "tools", label: "도구 호출", icon: "terminal" },
  { id: "links", label: "링크", icon: "link" },
  { id: "prompts", label: "프롬프트", icon: "message" },
  { id: "diffs", label: "변경", icon: "diff" },
  // Shown when the scope has sub-agents (terminals started with `hc run`).
  { id: "subs", label: "하위 에이전트", icon: "workflow", optional: true },
];

// One line about the connection: live, or what to do when the server or token is gone.
function connBar() {
  const e = LIVE.error;
  if (!LIVE.token) return html`<div class="conn err"><i></i>토큰이 없어요. herdr의 Agent Dash에서 <b>웹에서 열기</b>로 다시 열어 주세요.</div>`;
  if (e?.status === 401) return html`<div class="conn err"><i></i>서버가 다시 시작돼서 토큰이 바뀌었어요. herdr에서 <b>웹에서 열기</b>를 다시 눌러 주세요.</div>`;
  if (e) return html`<div class="conn err"><i></i>서버에 닿지 않아요 (${String(e.message ?? e)}). herdr에서 <b>웹에서 열기</b>를 누르면 다시 켜져요.</div>`;
  const working = DB.agents.filter((a) => a.status === "working").length;
  return html`<div class="conn"><i></i>herdr-core 실시간 · 에이전트 ${DB.agents.length} · 작업 중 ${working}<span class="grow"></span><button class="btn ghost sm" data-action="help">${icon("keyboard", 13)} 단축키</button></div>`;
}

function fleetChips() {
  const count = (s) => DB.agents.filter((a) => a.status === s).length;
  const chip = (s, glyph) =>
    count(s)
      ? html`<button class="fleet-chip ${s === "blocked" ? "alert" : ""}" data-action="fleet-status" data-status="${s}" title="${STATUS_LABEL[s]} 에이전트 보기">${glyph}<b>${count(s)}</b> ${STATUS_LABEL[s]}</button>`
      : "";
  return html`<div class="fleet-chips">${chip("blocked", raw('<span class="st blocked"></span>'))}${chip("working", spinner(13))}${chip("done", raw('<span class="st dot"></span>'))}${chip("idle", raw('<span class="st ring"></span>'))}</div>`;
}

function topBar() {
  return html`<header class="topbar">
    <div class="brand"><span class="brand-mark">${brandMark(17)}</span>Herdr <small>에이전트 대시보드</small></div>
    ${fleetChips()}
    <span class="grow"></span>
    <button class="search-btn" data-action="palette" aria-label="모두 검색 (⌘K)">${icon("search", 14)}<span class="grow">에이전트·호출·링크·파일 검색</span><span class="kbd">⌘K</span></button>
    <label class="sr-only" for="theme-sel">테마</label>
    <select class="select" id="theme-sel" data-input="theme" title="herdr 테마">
      ${["graphite", "ink", "moss"].map((t) => html`<option value="${t}" ${STATE.theme === t ? raw("selected") : ""}>${t}</option>`)}
    </select>
    <span class="source" title="bin/server.py가 hc와 대화 기록을 읽어요">${raw('<i class="pulse"></i>')} 127.0.0.1 · 로컬</span>
  </header>`;
}

function wsHead() {
  // 전체 현황 starts empty: only its name, until what it should show is decided.
  if (STATE.scope === "all") return "";
  if (STATE.scope === "all") {
    const blocked = DB.agents.filter((a) => a.status === "blocked").length;
    return html`<div class="ident">
        <div class="ident-main">
          <div class="ident-title"><h1>전체 현황</h1>${blocked ? html`<span class="pill blocked">${icon("alert", 12)} ${blocked}개가 기다려요</span>` : ""}</div>
          <div class="ident-meta"><span class="m">${icon("monitor", 13)} This computer · ${DB.agents.filter((a) => !a.machine).length}</span><span class="m dim">렌즈를 바꿔도 범위는 모든 에이전트예요</span></div>
        </div>
      </div>
      ${lensTabs()}`;
  }
  const a = agentById(STATE.scope);
  return html`<div class="ident">
      ${logo(a.app, 40)}
      <div class="ident-main">
        <div class="ident-title"><h1 class="truncate">${a.title}</h1>${statusPillFor(a)}</div>
        <div class="ident-meta">
          ${a.sub && agentById(a.parent)
            ? html`<button class="chip sub-of" data-action="open-sub" data-sub="${a.id}" title="이 에이전트를 띄운 에이전트로 가요">${icon("workflow", 12)} ${agentById(a.parent).title}의 하위 에이전트</button>`
            : html`<span class="m">${icon(a.machine ? "server" : "monitor", 13)} ${a.machine || "This computer"} · ${a.space} › ${a.tab}</span>`}
          ${a.branch ? html`<span class="m">${icon("branch", 13)} ${a.branch}</span>` : ""}
          <span class="m">${icon("folder", 13)} <span class="mono" style="font-size:12.5px">${a.cwd}</span></span>
          <span class="m">${a.model ? html`<span class="chip mono">${a.model}</span>` : ""}<span class="chip mono" title="hc 터미널 주소">${a.id}</span>${a.inferred ? html`<span class="chip" title="Codex는 세션 id를 알려 주지 않아서, 같은 폴더에서 이 프로세스 이후에 쓰인 기록을 골랐어요">추정 연결</span>` : ""}</span>

      </div>
    </div>
    ${lensTabs()}`;
}

function lensCounts() {
  if (STATE.scope === "all") {
    const files = DB.files.map(fileStats);
    return {
      tools: DB.calls.filter((c) => !c.parent).length,
      links: allLinks().length,
      prompts: DB.prompts.length,
      diffs: DB.files.length,
      add: sum(files, (s) => s.add),
      del: sum(files, (s) => s.del),
      subs: DB.agents.filter((a) => a.parent && agentById(a.parent)).length,
    };
  }
  const s = agentStats(STATE.scope);
  return { tools: s.calls, links: s.links, prompts: s.prompts, diffs: s.files, add: s.add, del: s.del, subs: subsOf(STATE.scope).length };
}

function lensTabs() {
  const c = lensCounts();
  return html`<div class="lens-tabs" role="tablist" aria-label="렌즈">${LENSES.map((l, k) => {
    if (l.optional && !c[l.id] && STATE.lens !== l.id) return "";
    const count = l.id === "overview" ? "" : l.id === "diffs" ? (c.diffs ? raw(`${c.diffs} <span class="a">+${c.add}</span> <span class="d">−${c.del}</span>`) : "0") : c[l.id];
    return html`<button class="lens-tab" role="tab" aria-selected="${STATE.lens === l.id}" data-action="lens" data-lens="${l.id}" id="tab-${l.id}">
      ${icon(l.icon, 14)} ${l.label} ${count !== "" ? html`<span class="count">${count}</span>` : ""}<span class="kbd">${k + 1}</span>
    </button>`;
  })}</div>`;
}

function lensBody() {
  if (STATE.scope === "all") return html`<div class="fleet-empty"><h1>전체 현황</h1></div>`;
  const a = STATE.scope === "all" ? null : agentById(STATE.scope);
  switch (STATE.lens) {
    case "tools":
      return toolsLens();
    case "links":
      return linksLens();
    case "prompts":
      return promptsLens();
    case "diffs":
      return diffsLens();
    case "subs":
      return subsLens();
    default:
      return html`<div class="scroll" data-keep-scroll="ov-${esc(scopeKey())}">${a ? agentOverview(a) : fleetOverview()}</div>`;
  }
}

function conceptA() {
  return html`<main class="concept concept-a ${STATE.railFolded ? "rail-folded" : ""}">
    <aside class="rail" id="rail" aria-label="에이전트 목록">${railView()}</aside>
    <section class="ws">
      <div class="ws-head" id="ws-head">${wsHead()}</div>
      <div class="lens" id="lens" role="tabpanel" aria-labelledby="tab-${STATE.lens}">${lensBody()}</div>
    </section>
  </main>`;
}

// ⌘K palette, shortcut sheet, toasts and the hover tooltip.

function paletteItems(q) {
  const query = q.trim().toLowerCase();
  const hit = (text) => !query || text.toLowerCase().includes(query);
  const groups = [];
  const commands = [
    ...CONCEPTS.map((c) => ({ label: `시안 ${c.id} · ${c.name}`, sub: "시안 전환", icon: c.icon, run: () => setConcept(c.id) })),
    ...LENSES.map((l) => ({ label: `${l.label} 렌즈`, sub: STATE.scope === "all" ? "전체 현황" : agentById(STATE.scope).title, icon: l.icon, run: () => go({ concept: "A", lens: l.id }) })),
    { label: "전체 현황", sub: "모든 에이전트", icon: "grid", run: () => go({ concept: "A", scope: "all", lens: "overview" }) },
  ].filter((c) => hit(`${c.label} ${c.sub}`));
  const agents = DB.agents.filter((a) => hit(`${a.title} ${a.space} ${a.tab} ${a.id}`)).map((a) => ({ label: a.title, sub: `${STATUS_LABEL[a.status]} · ${a.space} › ${a.tab}`, logo: a.app, run: () => go({ concept: "A", scope: a.id, lens: "overview" }) }));
  const calls = query
    ? DB.calls
        .filter((c) => !c.parent && hit(`${toolTitle(c)} ${toolTarget(c)}`))
        .slice(0, 6)
        .map((c) => ({ label: `${toolTitle(c)} ${toolTarget(c)}`, sub: agentById(c.agent).title, call: c, run: () => openCall(c.agent, c.id) }))
    : [];
  const links = query
    ? allLinks()
        .filter((l) => hit(`${l.title} ${l.url}`))
        .slice(0, 5)
        .map((l) => ({ label: l.title, sub: l.url, fav: l.url, run: () => go({ concept: "A", scope: l.agent, lens: "links", select: ["link", l.key] }) }))
    : [];
  const prompts = query
    ? DB.prompts
        .filter((p) => hit(p.text))
        .slice(0, 5)
        .map((p) => ({ label: p.text.split("\n")[0], sub: `${agentById(p.agent).title} · #${p.n}`, icon: "message", run: () => openPrompt(p.agent, p.n) }))
    : [];
  const files = query
    ? DB.files
        .filter((f) => hit(f.path))
        .slice(0, 5)
        .map((f) => ({ label: f.path, sub: agentById(f.agent).title, file: f.path, run: () => openFile(f.agent, f.path) }))
    : [];
  if (agents.length) groups.push(["에이전트", agents]);
  if (calls.length) groups.push(["도구 호출", calls]);
  if (links.length) groups.push(["링크", links]);
  if (prompts.length) groups.push(["프롬프트", prompts]);
  if (files.length) groups.push(["파일", files]);
  if (commands.length) groups.push(["이동", commands]);
  return groups;
}

function markMatch(text, q) {
  const t = String(text);
  const i = q ? t.toLowerCase().indexOf(q.toLowerCase()) : -1;
  if (i < 0) return esc(t);
  return `${esc(t.slice(0, i))}<mark>${esc(t.slice(i, i + q.length))}</mark>${esc(t.slice(i + q.length))}`;
}

function renderPalette() {
  const root = $("#overlay-root");
  if (!STATE.palette) {
    if (root.dataset.kind === "palette") {
      root.innerHTML = "";
      root.dataset.kind = "";
    }
    return;
  }
  const groups = paletteItems(STATE.palette.q);
  const flat = groups.flatMap(([, items]) => items);
  STATE.palette.flat = flat;
  const sel = clamp(STATE.palette.i, 0, Math.max(0, flat.length - 1));
  let n = -1;
  const body = groups.length
    ? groups
        .map(
          ([label, items]) =>
            `<div class="p-group">${esc(label)}</div>${items
              .map((it) => {
                n++;
                const lead = it.logo ? logo(it.logo, 20).s : it.fav ? fav(it.fav, 20).s : it.call ? `<span style="color:${kindColor(it.call)};display:inline-flex">${toolIcon(it.call, 16).s}</span>` : it.file ? fileIcon(it.file, 16).s : icon(it.icon || "arrow-right", 16).s;
                return `<button class="p-item" role="option" id="p-${n}" aria-selected="${n === sel}" data-action="palette-run" data-index="${n}">${lead}<span style="min-width:0;flex:1"><div class="truncate">${markMatch(it.label, STATE.palette.q)}</div><div class="p-sub truncate">${esc(it.sub || "")}</div></span></button>`;
              })
              .join("")}`,
        )
        .join("")
    : `<div class="empty" style="min-height:140px"><p>“${esc(STATE.palette.q)}”에 맞는 게 없어요</p></div>`;
  const keep = root.dataset.kind === "palette" ? $("#palette-input") : null;
  if (keep) {
    $(".p-body", root).innerHTML = body;
    $(`#p-${sel}`, root)?.scrollIntoView({ block: "nearest" });
    return;
  }
  root.dataset.kind = "palette";
  root.innerHTML = `<div class="scrim" data-action="palette-close-bg"><div class="palette" role="dialog" aria-modal="true" aria-label="모두 검색">
    <div class="p-input">${icon("search", 18).s}<input id="palette-input" placeholder="에이전트, 도구 호출, 링크, 프롬프트, 파일…" value="${esc(STATE.palette.q)}" role="combobox" aria-expanded="true" aria-controls="p-list" autocomplete="off"><span class="kbd">esc</span></div>
    <div class="p-body" id="p-list" role="listbox">${body}</div>
    <div class="p-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span> 고르기</span><span><span class="kbd">↵</span> 열기</span><span><span class="kbd">esc</span> 닫기</span></div>
  </div></div>`;
  $("#palette-input").focus();
}

const SHORTCUTS = [
  [["⌘", "K"], "모두 검색"],
  [["1"], "개요"],
  [["2"], "도구 호출"],

function toast({ title, body = "", kind = "", action = null, timeout = 5200 }) {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  const lead = kind === "blocked" ? `<span style="color:var(--blocked)">${icon("alert", 18).s}</span>` : kind === "done" ? `<span style="color:var(--done)">${icon("circle-check", 18).s}</span>` : `<span style="color:var(--accent)">${icon("info", 18).s}</span>`;
  el.innerHTML = `${lead}<div style="min-width:0;flex:1"><div class="t-title">${esc(title)}</div>${body ? `<div class="t-body">${body}</div>` : ""}${action ? `<div class="t-actions"><button class="btn sm">${esc(action.label)}</button></div>` : ""}</div><button class="btn ghost sm icon" aria-label="알림 닫기">${icon("x", 13).s}</button>`;
  const close = () => el.remove();
  el.querySelector('[aria-label="알림 닫기"]').addEventListener("click", close);
  if (action) {
    el.querySelector(".t-actions button").addEventListener("click", () => {
      action.run();
      close();
    });
  }
  let timer = setTimeout(close, timeout);
  el.addEventListener("mouseenter", () => clearTimeout(timer));
  el.addEventListener("mouseleave", () => {
    timer = setTimeout(close, 2500);
  });
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
}

function boundaryToast(cmd, note) {
  toast({ title: "실제 제품에서는 이 명령을 실행해요", body: `<code>${esc(cmd)}</code>${note ? `<div style="margin-top:6px">${esc(note)}</div>` : ""}` });
}

function showTip(target, x, y) {
  const tip = $("#tooltip");
  if (!target) {
    tip.hidden = true;
    return;
  }
  tip.innerHTML = target.dataset.tip;
  tip.hidden = false;
  const w = tip.offsetWidth;
  const h = tip.offsetHeight;
  tip.style.left = `${clamp(x + 14, 8, window.innerWidth - w - 8)}px`;
  tip.style.top = `${y + h + 22 > window.innerHeight ? y - h - 12 : y + 16}px`;
}
