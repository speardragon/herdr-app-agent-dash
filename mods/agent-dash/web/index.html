  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.sub-av {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #ffffff10;
  flex: none;
}

.sub-h h3 {
  margin: 0;
  font-size: var(--fs-md);
}

.sub-stats {
  display: flex;
  gap: 16px;
  margin-left: auto;
}

.sub-prompt {
  position: relative;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  max-height: 150px;
  overflow: hidden;
}

.sub-prompt.open {
  max-height: none;
}

.sub-prompt:not(.open)::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 48px;
  background: linear-gradient(transparent, var(--surface));
}

.sub-more {
  position: relative;
  z-index: 1;
  display: block;
  margin: -6px 16px 6px;
  font-size: var(--fs-xs);
  color: var(--accent);
}

.steps {
  padding: 6px 8px 10px;
}

.step {
  display: grid;
  grid-template-columns: 22px 18px auto minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  min-height: 32px;
  padding: 4px 8px;
  border-radius: 7px;
  text-align: left;
  font-size: var(--fs-sm);
}

.step:hover {
  background: var(--hover);
}

.step .rail-line {
  align-self: stretch;
  position: relative;
}

.step .rail-line::before {
  content: "";
  position: absolute;
  left: 10px;
  top: -6px;
  bottom: -6px;
  width: 1px;
  background: var(--input);
}

.step .rail-line::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 50%;
  width: 7px;
  height: 7px;
  margin-top: -3.5px;
  border-radius: 50%;
  background: var(--kc, var(--dim));
}

.report {
  padding: 14px 16px 16px;
  border-top: 1px solid var(--border);
}

.todo-prog {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.todo-bar {
  flex: 1;
  height: 10px;
  border-radius: 5px;
  background: #ffffff0c;
  display: flex;
  overflow: hidden;
  gap: 2px;
}

.todo-bar i {
  display: block;
  height: 100%;
}

.todo-bar .c {
  background: var(--accent);
}

.todo-bar .p {
  background: repeating-linear-gradient(135deg, var(--working) 0 5px, color-mix(in srgb, var(--working) 60%, transparent) 5px 10px);
}

.todo-item {
  display: grid;
  grid-template-columns: 22px 34px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: start;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: var(--fs);
}

.todo-item + .todo-item {
  margin-top: 2px;
}

.todo-item .no {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  margin-top: 2px;
}

.todo-item .ic {
  margin-top: 2px;
}

.todo-item.completed .tx {
  color: var(--dim);
  text-decoration: line-through;
  text-decoration-color: #ffffff40;
}

.todo-item.in_progress {
  background: color-mix(in srgb, var(--working) 8%, transparent);
}

.todo-item.in_progress .tx {
  font-weight: 600;
}

.todo-item .af {
  display: block;
  margin-top: 2px;
  font-size: var(--fs-xs);
  color: var(--working);
  font-weight: 500;
}

.todo-item.changed {
  box-shadow: inset 2px 0 0 var(--accent);
}

.trans {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.trans.new {
  background: var(--add-bg);
  color: #7fcf86;
}

.owner {
  color: var(--ansi13);
  font-size: var(--fs-xs);
  font-family: var(--mono);
}

.blockedby {
  color: #ff8a80;
  font-size: var(--fs-xs);
}

.ask {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  padding: 16px 18px 18px;
}

.ask + .ask {
  margin-top: 12px;
}

.ask-head {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 600;
}

.ask-q {
  margin: 10px 0 12px;
  font-size: var(--fs-md);
  font-weight: 600;
}

.ask-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}

.ask-body.with-preview {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.opt {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid transparent;
}

.opt + .opt {
  margin-top: 4px;
}

.opt .rd {
  width: 16px;
  height: 16px;
  margin-top: 2px;
  border-radius: 50%;
  border: 1.5px solid var(--input);
  display: grid;
  place-items: center;
}

.opt.multi .rd {
  border-radius: 4px;
}

.opt .lb {
  font-weight: 500;
}

.opt .ds {
  margin-top: 1px;
  font-size: var(--fs-sm);
  color: var(--dim);
}

.opt.on {
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
}

.opt.on .rd {
  border-color: var(--accent);
}

.opt.on .rd::after {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

.opt.multi.on .rd::after {
  border-radius: 2px;
}

.opt .picked {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
}

.ask-typed {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 9px;
  background: #ffffff08;
  font-size: var(--fs-sm);
  color: var(--muted);
}

.ask-preview {
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--background);
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre;
  overflow: auto;
  color: var(--muted);
}

.plan {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
}

.plan-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
  color: var(--muted);
}

.plan-b {
  padding: 16px 22px 20px;
}

.skill {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 16px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}

.skill-ic {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(140deg, color-mix(in srgb, var(--ansi13) 35%, transparent), color-mix(in srgb, var(--ansi4) 25%, transparent));
  color: var(--foreground);
}

.skill h3 {
  margin: 0;
  font-family: var(--mono);
  font-size: var(--fs-lg);
}

.skill .desc {
  margin-top: 4px;
  color: var(--muted);
  font-size: var(--fs-sm);
}

.skill .args {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 9px;
  background: var(--background);
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--foreground);
  white-space: pre-wrap;
}

/* ---------- Generic MCP & Jira ---------- */
.mcp-h {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.kvt {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 1px;
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--border);
}

.kvt > div {
  padding: 8px 12px;
  background: var(--background);
  font-size: 12.5px;
  min-width: 0;
}

.kvt .k {
  font-family: var(--mono);
  color: var(--ansi12);
}

.kvt .v {
  font-family: var(--mono);
  color: var(--foreground);
  white-space: pre-wrap;
  word-break: break-word;
}

.res-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0 8px;
}

.res-bar .meta {
  margin-left: auto;
  font-size: var(--fs-xs);
  color: var(--dim);
}

.jt {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 21px;
  padding: 10px 12px;
}

.jt-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: nowrap;
}

.jt-row button {
  color: var(--dim);
  width: 14px;
  flex: none;
}

.jt-k {
  color: var(--ansi12);
}

.jt-meta {
  color: var(--dim);
}

.jt-kids {
  padding-left: 18px;
  border-left: 1px solid #ffffff0e;
  margin-left: 6px;
}

.jcards {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px;
}

.jcard {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  border-radius: 9px;
  background: #ffffff06;
  border: 1px solid #ffffff0a;
}

.jcard .key {
  font-family: var(--mono);
  font-size: 12.5px;
  color: #9cbdf5;
  font-weight: 600;
  margin-right: 6px;
}

.jcard .sm {
  font-weight: 600;
}

.jcard .meta {
  margin-top: 4px;
  font-size: var(--fs-xs);
  color: var(--dim);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.av {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 9.5px;
  font-weight: 700;
  color: #111;
}

.jst {
  display: inline-flex;
  height: 20px;
  align-items: center;
  padding: 0 7px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.jst.todo {
  background: #ffffff14;
  color: #cfd2d7;
}

.jst.prog {
  background: #2f6fe433;
  color: #9cbdf5;
}

.jst.done {
  background: #57ab5a2e;
  color: #8fd694;
}

.jira-issue {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
}

.ji-h {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
}

.ji-crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-xs);
  color: var(--dim);
}

.ji-h h3 {
  margin: 8px 0 0;
  font-size: var(--fs-lg);
}

.ji-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 240px;
}

.ji-main {
  padding: 14px 18px 18px;
  border-right: 1px solid var(--border);
  min-width: 0;
}

.ji-side {
  padding: 14px 16px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 12px;
  align-content: start;
  font-size: var(--fs-sm);
}

.ji-side .k {
  color: var(--dim);
  font-size: var(--fs-xs);
  padding-top: 2px;
}

@container stage (max-width: 620px) {
  .stage-meta .when,
  .term-chips .chip.cwd {
    display: none;
  }
  .raw .raw-grid,
  .ask-body.with-preview,
  .ji-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .ji-main {
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .sev {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sub-stats {
    display: none;
  }
}

@container stage (max-width: 440px) {
  .stage-in {
    padding: 12px;
  }
  .term-title {
    text-align: left;
  }
  .lights {
    display: none;
  }
}

/* ---------- MongoDB MCP, the Compass way ---------- */
.cp {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.cp-head {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.leaf {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--k-mongo) 16%, transparent);
  color: var(--k-mongo);
}

.cp-crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-lg);
  color: var(--muted);
  min-width: 0;
  white-space: nowrap;
}

.cp-crumbs b {
  color: var(--foreground);
  font-weight: 600;
}

.cp-crumbs .sep {
  color: var(--faint);
}

.cp-badges {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 5px;
  font-size: var(--fs-xs);
  color: var(--dim);
  flex-wrap: wrap;
}

.opb {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

.opb.read {
  background: #2f6fe430;
  color: #8fb8ff;
}

.opb.write {
  background: #d9822b30;
  color: #f0b06a;
}

.opb.meta {
  background: #ffffff12;
  color: var(--muted);
}

.opname {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 7px;
  border-radius: 5px;
  border: 1px solid var(--input);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--foreground);
}

.cp-query {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 12px 14px;
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr);
  gap: 10px 12px;
  align-items: start;
}

.cp-query .ql {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--muted);
  padding-top: 7px;
}

.qfield {
  min-height: 34px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--input);
  background: var(--background);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 20px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--foreground);
}

.qopts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
}

.qopt {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--muted);
}

.qopt code {
  display: inline-block;
  line-height: 26px;
  min-height: 28px;
  padding: 0 10px;
  border-radius: 7px;
  border: 1px solid var(--input);
  background: var(--background);
  font-size: 12.5px;
  font-weight: 400;
  color: var(--foreground);
}

.cp-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.cp-stat {
  min-width: 132px;
  padding: 12px 16px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: var(--surface);
}

.cp-stat .k {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--dim);
}

.cp-stat .v {
  font-size: 26px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.cp-stat.del .v {
  color: #ff8a80;
}

.cp-stat.ins .v {
  color: #7fcf86;
}

.cp-bar {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cp-bar h4 {
  margin: 0;
  font-size: var(--fs-md);
}

.cp-bar .rng {
  color: var(--dim);
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}

.cp-bar .grow {
  flex: 1;
}

/* Document cards */
.docs {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.doc {
  position: relative;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--background);
  padding: 10px 14px 12px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 22px;
  min-width: 0;
  overflow-x: auto;
}

.doc:hover .doc-acts {
  opacity: 1;
}

.doc-acts {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.12s;
  font-family: var(--ui);
}

.doc:focus-within .doc-acts {
  opacity: 1;
}

.f {
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: nowrap;
  min-width: max-content;
}

.f .tg {
  width: 14px;
  flex: none;
  color: var(--dim);
  display: inline-grid;
  place-items: center;
}

.f .tg:hover {
  color: var(--foreground);
}

.f .fk {
  font-weight: 700;
  color: var(--foreground);
}

.f .colon {
  color: var(--dim);
  margin-left: -5px;
}

.f .ty {
  color: var(--dim);
}

.kids {
  padding-left: 20px;
}

.bv-oid { color: var(--bson-oid); }
.bv-str { color: var(--bson-str); }
.bv-num { color: var(--bson-num); }
.bv-date { color: var(--bson-date); }
.bv-bool { color: var(--bson-bool); }
.bv-null { color: var(--bson-null); }
.bv-wrap { color: var(--bson-num); }

/* Field-level change marks (update-many) */
.doc-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.doc-h .fk {
  font-weight: 700;
}

.chg {
  display: inline-flex;
  height: 19px;
  align-items: center;
  padding: 0 7px;
  border-radius: 5px;
  font-family: var(--ui);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.05em;
}

.chg.mod {
  background: #d9822b30;
  color: #f0b06a;
}

.chg.del {
  background: var(--del-bg);
  color: #ff8a80;
}

.chg.ins {
  background: var(--add-bg);
  color: #7fcf86;
}

.chg-n {
  font-size: 11.5px;
  color: var(--dim);
  display: inline-flex;
  gap: 8px;
}

.chg-n .m {
  color: #f0b06a;
}

.chg-n .a {
  color: #7fcf86;
}

.chg-n .d {
  color: #ff8a80;
}

.v-old {
  background: var(--del-strong);
  color: #ffc9c3;
  text-decoration: line-through;
  text-decoration-color: #ffc9c399;
  border-radius: 3px;
  padding: 0 2px;
}

.v-new {
  background: var(--add-strong);
  color: #d6f5d4;
  border-radius: 3px;
  padding: 0 2px;
}

.f.f-add {
  background: var(--add-bg);
  margin: 0 -14px;
  padding: 0 14px;
  box-shadow: inset 3px 0 0 var(--add);
}

.f.f-del {
  background: var(--del-bg);
  margin: 0 -14px;
  padding: 0 14px;
  box-shadow: inset 3px 0 0 var(--del);
}

.f.f-del .fk,
.f.f-del span {
  text-decoration: line-through;
  text-decoration-color: #ff8a8088;
}

.doc.deleted {
  border-color: color-mix(in srgb, var(--del) 40%, transparent);
  background: color-mix(in srgb, var(--del) 5%, var(--background));
}

.doc.inserted {
  border-color: color-mix(in srgb, var(--add) 40%, transparent);
  background: color-mix(in srgb, var(--add) 5%, var(--background));
}

/* Table view */
.cp-table-wrap {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: auto;
  max-height: 520px;
  background: var(--background);
}

.cp-table {
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12.5px;
  min-width: 100%;
}

.cp-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #1c1e22;
  text-align: left;
  font-weight: 600;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  white-space: nowrap;
}

.cp-table th small {
  display: block;
  font-weight: 500;
  color: var(--dim);
  font-size: 10.5px;
  font-family: var(--mono);
}

.cp-table td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  font-family: var(--mono);
  white-space: nowrap;
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cp-table td.rn {
  color: var(--dim);
  text-align: right;
  background: #ffffff04;
}

.cp-table tr:hover td {
  background: var(--hover);
}

.nest {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px;
  border-radius: 4px;
  background: #ffffff0d;
  color: var(--muted);
  font-size: 11px;
}

/* Aggregation pipeline */
.pipe {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.pstage {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  overflow: hidden;
}

.pstage-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: #ffffff05;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-xs);
  color: var(--dim);
}

.pstage-h code {
  font-size: 13px;
  font-weight: 700;
  color: var(--k-mongo);
}

.pstage-h .note {
  margin-left: auto;
  font-size: 11.5px;
}

.pstage-b {
  padding: 9px 14px;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 20px;
  white-space: pre-wrap;
  word-break: break-word;
}

.pjoin {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 22px;
  margin-left: 22px;
  border-left: 1px dashed var(--input);
  padding-left: 12px;
  font-size: 11px;
  color: var(--dim);
}

/* Schema */
.schema {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--background);
}

.sf {
  display: grid;
  grid-template-columns: minmax(150px, 0.9fr) minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 14px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}

.sf:last-child {
  border-bottom: 0;
}

.sf .nm {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.sf .nm .pth {
  color: var(--dim);
  font-weight: 400;
}

.sf .types {
  display: flex;
  height: 18px;
  border-radius: 4px;
  overflow: hidden;
  gap: 2px;
}

.sf .types i {
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-style: normal;
  font-size: 10.5px;
  font-weight: 700;
  color: #0c0d0f;
  white-space: nowrap;
  overflow: hidden;
  min-width: 4px;
}

.sf .samples {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  min-width: 0;
}

.sf .samples span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--mono);
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  background: #ffffff0b;
  color: var(--muted);
}

.sf .pres {
  font-size: 10.5px;
  color: var(--dim);
  margin-top: 3px;
}

/* Indexes */
.ixk {
  font-family: var(--mono);
  font-size: 12.5px;
}

.ixk .dir {
  color: var(--k-mongo);
  font-weight: 700;
}

.ixb {
  display: inline-flex;
  height: 19px;
  align-items: center;
  padding: 0 6px;
  margin: 1px 2px 1px 0;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  background: #ffffff10;
  color: var(--muted);
}

.ixb.unique {
  background: #b5a2ce2a;
  color: var(--ansi13);
}

.ixb.ttl {
  background: #e5c07b26;
  color: var(--working);
}

.ixb.partial {
  background: #8cbdc326;
  color: var(--ansi6);
}

.usage {
  display: flex;
  align-items: center;
  gap: 8px;
}

.usage .meter {
  width: 70px;
}

/* Explain plan */
.xsum {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.xwarn {
  display: flex;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--working) 9%, transparent);
  border: 1px solid color-mix(in srgb, var(--working) 35%, transparent);
  color: var(--foreground);
  font-size: var(--fs-sm);
}

.xwarn .ico {
  color: var(--working);
  margin-top: 2px;
}

.xwarn code {
  font-size: 12px;
  background: #ffffff10;
  padding: 1px 5px;
  border-radius: 4px;
}

.xtree {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 8px 0;
}

.xnode {
  width: min(420px, 100%);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 10px 14px;
}

.xnode-h {
  display: flex;
  align-items: center;
  gap: 8px;
}

.xnode-h b {
  font-family: var(--mono);
  font-size: 13px;
}

.xnode-h .t {
  margin-left: auto;
  font-size: var(--fs-xs);
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}

.xnode .xm {
  display: flex;
  gap: 14px;
  margin-top: 6px;
  font-size: var(--fs-xs);
  color: var(--dim);
  flex-wrap: wrap;
}

.xnode .xm b {
  color: var(--foreground);
  font-variant-numeric: tabular-nums;
}

.xnode.bad {
  border-color: color-mix(in srgb, var(--working) 50%, transparent);
}

.xnode.bad .xnode-h b {
  color: var(--working);
}

.xedge {
  width: 1px;
  height: 20px;
  background: var(--input);
}

/* Databases & collections */
.dbrow {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) 160px 80px;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
}

.dbrow:last-child {
  border-bottom: 0;
}

.dbrow .nm {
  font-family: var(--mono);
  font-weight: 600;
}

.dbrow .sz {
  text-align: right;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.cnt-big {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 18px 20px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
}

.cnt-big b {
  font-size: 40px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.cnt-big span {
  color: var(--muted);
}

@container stage (max-width: 620px) {
  .cp-query {
    grid-template-columns: minmax(0, 1fr);
  }
  .cp-query .ql {
    padding-top: 0;
  }
  .sf {
    grid-template-columns: minmax(0, 1fr);
    gap: 6px;
  }
  .xsum {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .dbrow {
    grid-template-columns: 22px minmax(0, 1fr) 70px;
  }
  .dbrow .meter {
    display: none;
  }
}

/* Agent Dash web: what the live page adds to the prototype's look. */
.conn { display: flex; align-items: center; gap: 10px; padding: 7px 16px; font-size: var(--fs-sm); border-bottom: 1px solid var(--border); background: var(--chrome); color: var(--muted); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: #7fcf86; box-shadow: 0 0 0 3px #7fcf8622; }
.conn.err { background: color-mix(in srgb, var(--blocked) 10%, var(--chrome)); color: var(--foreground); }
.conn.err i { background: var(--blocked); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blocked) 20%, transparent); }
.conn code { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--raised); }
.more-row { display: block; width: 100%; padding: 8px; text-align: center; color: var(--accent); font-size: var(--fs-sm); border-top: 1px solid var(--border); }
.more-row:hover { background: var(--hover); }
.img-real { max-width: 100%; max-height: 560px; border-radius: 6px; display: block; margin: 0 auto; }
.cut-row { color: var(--dim); font-style: italic; }

/* ---------- sub-agents (terminals started with `hc run`) ---------- */
.tl { flex: none; align-self: stretch; width: 12px; margin-right: 2px; position: relative; }
.tl.bar::before, .tl.mid::before, .tl.end::before { content: ""; position: absolute; left: 4px; top: -3px; border-left: 1.5px solid var(--input, #ffffff24); }
.tl.bar::before, .tl.mid::before { bottom: -3px; }
.tl.end::before { height: calc(50% + 3px); }
.tl.mid::after, .tl.end::after { content: ""; position: absolute; left: 4px; top: 0; width: 8px; height: 50%; border-bottom: 1.5px solid var(--input, #ffffff24); border-left: 1.5px solid transparent; border-bottom-left-radius: 6px; }
.tl.end::after { border-left-color: var(--input, #ffffff24); top: -3px; height: calc(50% + 3px); }

.agent-sub { display: flex; align-items: center; gap: 7px; width: 100%; height: 30px; padding: 0 16px 0 28px; border-radius: 0; text-align: left; font-size: var(--fs-sm); color: var(--muted); }
.agent-sub:hover { background: var(--hover); }
.agent-sub[aria-current="true"] { background: var(--selected); color: var(--foreground); font-weight: 600; }
.agent-sub.ended { color: var(--dim); }
.agent-sub.ended .logo { opacity: 0.5; }
.rail-folded .agent-sub { padding: 0; justify-content: center; }
.rail-folded .agent-sub .t, .rail-folded .agent-sub .tl, .rail-folded .agent-sub .st, .rail-folded .agent-sub .sub-mark { display: none; }
.sub-mark { display: inline-flex; color: var(--dim); }
.sub-mark.bad { color: #ff8a80; }
.chip.sub-of { cursor: pointer; color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-color: transparent; }
.chip.sub-of:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }

.sub-tree { display: flex; flex-direction: column; gap: 0; padding: 6px 0; }
.sub-row { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 50px; padding: 0 16px; border-radius: 0; text-align: left; }
.sub-row:hover { background: var(--hover); }
.sub-row[aria-selected="true"] { background: var(--selected); }
.sub-row .t { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs); font-weight: 500; color: var(--foreground); min-width: 0; }
.sub-row.head .t { font-weight: 600; }
.sub-row .addr { flex: none; font-size: 11px; color: var(--dim); }
.sub-row .s { display: block; margin-top: 2px; font-size: 11.5px; color: var(--dim); }
.sub-row .s.working { color: var(--working); }
.sub-row .r { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.sub-row.ended .t { color: var(--dim); }
.sub-row.ended .logo { opacity: 0.55; }

.sub-detail { padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
.sub-crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: var(--fs-sm); color: var(--dim); }
.sub-crumbs button { display: inline-flex; align-items: center; gap: 5px; max-width: 220px; padding: 2px 6px; border-radius: 6px; color: var(--muted); }
.sub-crumbs button:hover { background: var(--hover); }
.sub-crumbs b { color: var(--foreground); padding: 0 4px; }
.sub-head { display: flex; align-items: center; gap: 12px; }
.sub-title { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 3px; }
.sub-title h2 { font-size: 17px; font-weight: 600; margin: 0; }
.sub-box { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-lg); }
.sub-box .k { font-size: var(--fs-xs); color: var(--dim); margin-bottom: 6px; }
.sub-box .task { white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--fs); line-height: 1.55; }
.sub-box pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; }
.sub-box .reply { max-height: 240px; overflow: auto; }
.sub-detail .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sub-steps { display: flex; flex-direction: column; gap: 1px; }
.sub-turn { display: flex; align-items: center; gap: 8px; height: 28px; margin-top: 8px; padding: 0 9px; border-radius: 6px; font-size: var(--fs-sm); color: var(--muted); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.sub-turn:first-child { margin-top: 0; }
.sub-turn .n { flex: none; font-weight: 700; font-size: 11px; color: var(--accent); }
.sub-turn .dim { flex: none; font-size: 11px; }

/* 전체 현황: empty for now, just its name in the middle. */
.fleet-empty { height: 100%; display: flex; align-items: center; justify-content: center; }
.fleet-empty h1 { margin: 0; font-size: 22px; font-weight: 600; color: var(--muted); }

/* Links: yours (handed over in a prompt) set apart from the agent's. */
.list-sep.link-src span { display: inline-flex; align-items: center; gap: 5px; }
.list-sep.link-src.mine { color: var(--accent); }
.chip.mine { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }

/* Hover feedback for the last clickable things that had none. */
.new-calls:hover { filter: brightness(1.12); }

/* Jira, Notion and Slack calls drawn in those sites' own light themes. The colors, sizes and
   radii are the sites' (read from the live pages), not this page's tokens. */
.site { border-radius: 10px; overflow: hidden; border: 1px solid #dddee1; background: #fff; color-scheme: light; text-align: left; }
.site a { text-decoration: none; }
.site .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site .grow { flex: 1; }
.site-top { display: flex; align-items: center; gap: 10px; padding: 14px 24px 0; min-height: 44px; }
.site .open { flex: none; display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 4px; border: 1px solid #b7b9be; font-size: 13px; color: inherit; white-space: nowrap; }
.site .open:hover { background: #f0f1f2; }
.site .av { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 600; }
.site .av.lg { width: 32px; height: 32px; font-size: 12px; }
.site .av.sq { width: 36px; height: 36px; border-radius: 8px; font-size: 13px; font-weight: 700; }

/* rich text (shared structure, per-site look below) */
.site .rich > * + * { margin-top: 0.5em; }
.site .rich p, .site .rich h2, .site .rich h3, .site .rich h4 { margin: 0; }
.site .rich h2, .site .rich h3, .site .rich h4 { margin-top: 1.1em; }
.site .rich > :first-child { margin-top: 0; }
.site .bli { display: flex; gap: 6px; align-items: flex-start; margin-top: 0.25em !important; }

.site .bli.done > div { color: #7d7a75; }
.site .todo { flex: none; width: 15px; height: 15px; margin-top: 0.3em; border: 1.5px solid #8c8f97; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
.site .todo.on { background: #1868db; border-color: #1868db; }
.site .bcode { margin: 0; padding: 10px 12px; overflow-x: auto; font-family: var(--mono, "SFMono-Regular", Menlo, monospace); font-size: 0.86em; line-height: 1.6; white-space: pre; }
.site blockquote { margin: 0; padding-left: 12px; }
.site hr { border: 0; height: 1px; margin: 12px 0; }
.site .btable-wrap { overflow-x: auto; }
.site .btable { border-collapse: collapse; width: 100%; font-size: 0.93em; }
.site .btable td { padding: 6px 9px; vertical-align: top; min-width: 80px; }
.site .bcallout { display: flex; gap: 10px; padding: 14px; }
.site .bcallout .ci { flex: none; font-size: 1.2em; }
.site .bcallout .rich { flex: 1; min-width: 0; }
.site .btoggle { display: flex; gap: 6px; }
.site .btoggle > span { font-size: 0.65em; padding-top: 0.5em; }
.site .bembed { display: block; padding: 7px 10px; border-radius: 4px; font-size: 0.93em; }
.site .bmore { font-size: 12px; opacity: 0.7; }

/* ---------- Jira ---------- */
.site.jira { --jt: #292a2e; --jd: #505258; --js: #6b6e76; --jl: #1868db; --jb: #dddee1; color: var(--jt); font: 14px/1.714 "Atlassian Sans", ui-sans-serif, -apple-system, "system-ui", "Segoe UI", Ubuntu, sans-serif; }

.jira .rich a { text-decoration: underline; }

/* ---------- Notion ---------- */
.site.notion { --nt: #2c2c2b; --nd: #7d7a75; --nb: #e9e9e7; border-color: var(--nb); color: var(--nt); font: 16px/1.5 ui-sans-serif, -apple-system, "system-ui", "Segoe UI Variable Display", "Segoe UI", Helvetica, sans-serif; }
.notion .site-top { padding: 0 14px; font-size: 14px; }
.notion .open { border-color: var(--nb); border-radius: 6px; }
.notion .open:hover { background: #f1f1ef; }
.ncrumbs { min-width: 0; }
.ncrumbs i { font-style: normal; margin: 0 6px; color: #b4b3af; }
.npage { max-width: 760px; margin: 0 auto; padding: 34px 48px 48px; }

.notion .rich code, .nprops code, .nres code { padding: 0.2em 0.4em; border-radius: 4px; background: rgba(33, 27, 23, 0.05); color: #cf5148; font-family: SFMono-Regular, Menlo, Consolas, "PT Mono", "Liberation Mono", Courier, monospace; font-size: 85%; }

.notion .bcallout.blue_bg { background: #e7f3f8; } .notion .bcallout.yellow_bg { background: #fbf3db; } .notion .bcallout.red_bg { background: #fdebec; }
.notion .bcallout.green_bg { background: #edf3ec; } .notion .bcallout.orange_bg { background: #fbecdd; } .notion .bcallout.purple_bg { background: #f4f0f7; }
.notion .bcallout.pink_bg { background: #f9eef3; } .notion .bcallout.brown_bg { background: #f4eeee; }

.notion .mention { color: inherit; }
.notion .mention.user { color: var(--nd); }
.ndim { color: var(--nd); font-size: 14px; }

.ncheck.on { background: #2383e2; border-color: #2383e2; }
.ntag { display: inline-block; max-width: 240px; padding: 0 6px; border-radius: 3px; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nres:hover { background: #f1f1ef; }
.nres .t { display: block; font-size: 14px; font-weight: 500; }
.nres .p { display: block; font-size: 12px; color: var(--nd); }
.nres .h { display: block; font-size: 12.5px; line-height: 1.45; color: var(--nd); }
.nres .d { flex: none; font-size: 12px; color: var(--nd); }
.ntable-wrap { overflow-x: auto; padding: 0 14px 16px; }
.ntable { border-collapse: collapse; font-size: 14px; }
.ntable th { height: 34px; padding: 0 8px; text-align: left; font-weight: 400; color: var(--nd); white-space: nowrap; border-top: 1px solid var(--nb); border-bottom: 1px solid var(--nb); border-right: 1px solid var(--nb); }
.ntable td { min-width: 70px; max-width: 320px; height: 33px; padding: 5px 8px; border-bottom: 1px solid var(--nb); border-right: 1px solid var(--nb); vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.nedit { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- Slack ---------- */

.sdim { font-size: 12px; color: var(--sd); margin-top: 2px; }
.sreact { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* ---- src/js/lib-bridge.js ---- */

// for the herdr mod and this page; bin/server.py serves it at /lib/.

import * as LT from "/lib/tools.js";
import * as LD from "/lib/diff.js";
import * as LH from "/lib/highlight.js";
import * as LL from "/lib/links.js";

/* ---- src/js/util.js ---- */
// Small helpers shared by every view. One classic script: names here are global.

const T0 = Date.now();
const atOffset = (sec) => T0 + sec * 1000;

const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ESC_MAP[c]);

class Raw {
  constructor(s) {
    this.s = s;
  }
  toString() {
    return this.s;
  }
}
const raw = (s) => new Raw(String(s));

// Booleans print as "true"/"false" so aria-* attributes carry their state.
function renderValue(v) {
  if (v == null) return "";
  if (typeof v === "boolean") return String(v);
  if (v instanceof Raw) return v.s;
  if (Array.isArray(v)) return v.map(renderValue).join("");
  return esc(v);
}

// Tagged template: interpolations are escaped unless wrapped in raw().
function html(strings, ...values) {
  let out = strings[0];
  for (let i = 0; i < values.length; i++) out += renderValue(values[i]) + strings[i + 1];
  return new Raw(out);
}

const cx = (...parts) => parts.filter(Boolean).join(" ");
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const sum = (list, f = (x) => x) => list.reduce((acc, x) => acc + f(x), 0);
const uniq = (list) => [...new Set(list)];
const groupBy = (list, keyOf) =>
  list.reduce((acc, item) => {
    const k = keyOf(item);
    return { ...acc, [k]: [...(acc[k] || []), item] };
  }, {});

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// ---------- Numbers ----------
const fmtInt = (n) => Number(n).toLocaleString("en-US");

function fmtK(n) {
  if (n >= 1e6) return `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 2).replace(/\.?0+$/, "")}M`;
  if (n >= 1e3) return `${(n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "")}K`;
  return String(n);
}

function fmtBytes(b) {
  if (b >= 1024 * 1024) return `${(b / 1024 / 1024).toFixed(1)} MB`;
  if (b >= 1024) return `${(b / 1024).toFixed(1).replace(/\.0$/, "")} KB`;
  return `${b} B`;
}

function fmtDur(sec) {
  if (sec == null) return "";
  if (sec < 1) return `${Math.max(1, Math.round(sec * 1000))}ms`;
  if (sec < 10) return `${sec.toFixed(1)}s`;
  if (sec < 60) return `${Math.round(sec)}s`;
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return s ? `${m}m ${s}s` : `${m}m`;
}

function fmtDurKo(sec) {
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h) return `${h}시간 ${m}분`;
  if (m) return `${m}분 ${String(r).padStart(2, "0")}초`;
  return `${r}초`;
}

// ---------- Time ----------
const UI = { locale: "ko" };

function relTime(ts, now = Date.now()) {
  const d = Math.max(0, Math.round((now - ts) / 1000));
  const ko = UI.locale === "ko";
  if (d < 45) return ko ? "방금 전" : "just now";
  const m = Math.round(d / 60);
  if (m < 60) return ko ? `${m}분 전` : `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 24) return ko ? `${h}시간 전` : `${h}h ago`;
  const days = Math.round(h / 24);
  if (days === 1) return ko ? "어제" : "yesterday";
  if (days < 7) return ko ? `${days}일 전` : `${days}d ago`;
  return dateLabel(ts);
}

function shortAgo(ts, now = Date.now()) {
  const d = Math.max(0, Math.round((now - ts) / 1000));
  if (d < 60) return "<1m";
  const m = Math.round(d / 60);
  if (m < 60) return `${m}m`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}h` : `${Math.round(h / 24)}d`;
}

function clock(ts) {
  const d = new Date(ts);
  const h = d.getHours();
  const mm = String(d.getMinutes()).padStart(2, "0");
  if (UI.locale === "ko") return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}:${mm}`;
  return `${h % 12 || 12}:${mm} ${h < 12 ? "AM" : "PM"}`;
}

function hhmm(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function hhmmss(ts) {
  const d = new Date(ts);
  return `${hhmm(ts)}:${String(d.getSeconds()).padStart(2, "0")}`;
}

function dayKey(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function dateLabel(ts) {
  const d = new Date(ts);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  if (UI.locale === "ko") return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", weekday: "short" });
}

function dayLabel(ts) {
  const today = dayKey(Date.now());
  const yest = dayKey(Date.now() - 86400000);
  const k = dayKey(ts);
  if (k === today) return UI.locale === "ko" ? "오늘" : "Today";
  if (k === yest) return UI.locale === "ko" ? "어제" : "Yesterday";
  return dateLabel(ts);
}

// ---------- Paths & URLs ----------
const baseName = (p) => p.split("/").filter(Boolean).pop() || p;
const dirName = (p) => p.split("/").slice(0, -1).join("/");
const extOf = (p) => {
  const b = baseName(p);
  const i = b.lastIndexOf(".");
  return i > 0 ? b.slice(i + 1).toLowerCase() : "";
};

const LANG_BY_EXT = {
  ts: "ts",
  tsx: "tsx",
  js: "js",
  mjs: "js",
  cjs: "js",
  jsx: "tsx",
  json: "json",
  md: "md",
  css: "css",
  scss: "css",
  sh: "bash",
  swift: "swift",
  yml: "yaml",
  yaml: "yaml",
};
const langOf = (p) => LANG_BY_EXT[extOf(p)] || "text";

function shortPath(p) {
  return p.replace(/^\/Users\/[^/]+/, "~");
}

function parseUrl(u) {
  try {
    return new URL(u);
  } catch {
    return null;
  }
}

const hostOf = (u) => (parseUrl(u)?.hostname || u).replace(/^www\./, "");

// ---------- DOM ----------
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// Re-renders a region, keeping scroll positions and the focused control.
function mount(el, content) {
  if (!el) return;
  const scrolls = $$("[data-keep-scroll]", el).map((n) => [n.dataset.keepScroll, n.scrollTop, n.scrollLeft]);
  const own = el.hasAttribute("data-keep-scroll") ? [el.scrollTop, el.scrollLeft] : null;
  const active = document.activeElement;
  const focusKey = active && el.contains(active) ? active.dataset.focusKey : null;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  el.innerHTML = renderValue(content);
  for (const [key, top, left] of scrolls) {
    const n = el.querySelector(`[data-keep-scroll="${key}"]`);
    if (n) {
      n.scrollTop = top;
      n.scrollLeft = left;
    }
  }
  if (own) {
    el.scrollTop = own[0];
    el.scrollLeft = own[1];
  }
  if (focusKey) {
    const n = el.querySelector(`[data-focus-key="${focusKey}"]`);
    if (n) {
      n.focus({ preventScroll: true });
      if (selStart != null && "setSelectionRange" in n) n.setSelectionRange(selStart, selStart);
    }
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }
}

const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- src/js/icons.js ---- */

function icon(name, size = 16, cls = "") {
  const body = ICON_PATHS[name] || ICON_PATHS.file;
  return raw(
    `<svg class="ico ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`,
  );
}

  const inner = Math.round(size * (app === "codex" ? 0.78 : 0.68));
  const svg = (LOGOS[app] || (() => icon("bot", inner).s))();
  return raw(
    `<span class="logo" style="width:${size}px;height:${size}px;border-radius:${Math.round(size * 0.27)}px"><span style="width:${inner}px;height:${inner}px;display:block">${svg}</span></span>`,
  );
}

const FILE_KINDS = {
  ts: ["#3178c6", "TS"],
  tsx: ["#61dafb", "atom"],

function fileIcon(path, size = 15) {
  const ext = extOf(path);
  const name = baseName(path);
  if (name === "package.json") return raw(`<span class="ico" style="color:#cb3837;display:inline-flex">${icon("package", size).s}</span>`);
  if (name.endsWith(".lock") || name === "package-lock.json")
    return raw(`<span class="ico" style="color:#8f9297;display:inline-flex">${icon("lock", size).s}</span>`);
  const kind = FILE_KINDS[ext];
  if (!kind) return raw(`<span class="ico" style="color:var(--dim);display:inline-flex">${icon("file", size).s}</span>`);
  const [color, glyph, fg] = kind;
  if (glyph === "atom")
    return raw(

/* ---- src/js/highlight.js ---- */
// Syntax highlighting, ANSI colours and a compact Markdown renderer.
// Tokens keep multi-line comments and strings right, then split per line.

// The lexer is the mod's (lib/highlight.js): same {c, t} tokens, one implementation.
const tokenize = (code, lang) => LH.tokenize(code, lang);

const tokSpan = (c, text) => (c ? `<span class="tk-${c}">${esc(text)}</span>` : esc(text));

// marks: sorted, non-overlapping [start, end) character ranges to wrap in <mark>.
function lineHTML(tokens, marks = null) {
  if (!marks || !marks.length) return tokens.map((t) => tokSpan(t.c, t.t)).join("");
  let out = "";
  let pos = 0;
  for (const tok of tokens) {
    const start = pos;
    const end = pos + tok.t.length;
    const cuts = [start, end];
    for (const [ms, me] of marks) {
      if (ms > start && ms < end) cuts.push(ms);
      if (me > start && me < end) cuts.push(me);
    }
    const sorted = uniq(cuts).sort((a, b) => a - b);
    for (let k = 0; k < sorted.length - 1; k++) {
      const a = sorted[k];
      const b = sorted[k + 1];
      const piece = tok.t.slice(a - start, b - start);
      const marked = marks.some(([ms, me]) => a >= ms && b <= me);
      const span = tokSpan(tok.c, piece);
      out += marked ? `<mark>${span}</mark>` : span;
    }
    pos = end;
  }
  return out;
}

const hl = (code, lang) => tokenize(code, lang).map((line) => lineHTML(line));
const hlInline = (code, lang) => raw(hl(code, lang).join("\n"));

// ---------- ANSI SGR -> spans ----------
function ansiToHtml(text) {
  const state = { b: false, d: false, fg: null, bg: null };
  let out = "";
  const re = /\x1b\[([\d;]*)m/g;
  let last = 0;
  const open = () => {
    const cls = [state.b && "a-b", state.d && "a-d", state.fg && `a-${state.fg}`, state.bg && `a-${state.bg}`].filter(Boolean);
    return cls.length ? `<span class="${cls.join(" ")}">` : "<span>";
  };
  const emit = (s) => {
    if (s) out += `${open()}${esc(s)}</span>`;
  };
  let m;
  while ((m = re.exec(text))) {
    emit(text.slice(last, m.index));
    last = re.lastIndex;
    const codes = (m[1] || "0").split(";").map(Number);
    for (const c of codes) {
      if (c === 0) Object.assign(state, { b: false, d: false, fg: null, bg: null });
      else if (c === 1) state.b = true;
      else if (c === 2) state.d = true;
      else if (c === 22) Object.assign(state, { b: false, d: false });
      else if ((c >= 30 && c <= 37) || (c >= 90 && c <= 97)) state.fg = c;
      else if (c === 39) state.fg = null;
      else if (c >= 40 && c <= 47) state.bg = c;
      else if (c === 49) state.bg = null;
    }
  }
  emit(text.slice(last));
  return out;
}

const stripAnsi = (s) => s.replace(/\x1b\[[\d;]*m/g, "");

// ---------- Markdown ----------
const URL_RE = /https?:\/\/[^\s<>()\]]+[^\s<>()\].,;:!?'"]/g;

function mdInline(src, ctx = {}) {
  // Protect inline code first.
  const codes = [];
  let s = src.replace(/`([^`]+)`/g, (_, code) => {
    codes.push(code);
    return `\u0000${codes.length - 1}\u0000`;
  });
  s = esc(s);
  const linkTag = (label, url) => {
    let sup = "";
    if (ctx.numbers) {
      if (!ctx.numbers.has(url)) ctx.numbers.set(url, ctx.numbers.size + 1);
      sup = `<sup>${ctx.numbers.get(url)}</sup>`;
    }
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>${sup}`;
  };
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) => linkTag(label, url));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, (m, pre, url) => (m.includes("href=") ? m : `${pre}${linkTag(url, url)}`));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[Number(i)])}</code>`);
  return s;
}

// -> [{html, from, to}] with 1-based source line numbers, so callers can mark a read range.
function mdBlocks(text, ctx = {}) {
  const lines = text.split("\n");
  const blocks = [];
  let i = 0;
  const push = (htmlStr, from, to) => blocks.push({ html: htmlStr, from: from + 1, to: to + 1 });
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) {
      i++;
      continue;
    }
    const fence = line.match(/^```(\w*)/);
    if (fence) {
      const start = i;
      const body = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) body.push(lines[i++]);
      i++;
      const lang = fence[1] === "sh" ? "bash" : fence[1] || "text";
      push(`<pre><code>${hl(body.join("\n"), lang).join("\n")}</code></pre>`, start, i - 1);
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      push(`<h${h[1].length}>${mdInline(h[2], ctx)}</h${h[1].length}>`, i, i);
      i++;
      continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) {
      push("<hr>", i, i);
      i++;
      continue;
    }
    if (line.startsWith(">")) {
      const start = i;
      const body = [];
      while (i < lines.length && lines[i].startsWith(">")) body.push(lines[i++].replace(/^>\s?/, ""));
      push(`<blockquote>${mdInline(body.join(" "), ctx)}</blockquote>`, start, i - 1);
      continue;
    }
    if (line.trim().startsWith("|") && lines[i + 1] && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const start = i;
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      const th = head.map((c) => `<th>${mdInline(c, ctx)}</th>`).join("");
      const tb = rows.map((r) => `<tr>${r.map((c) => `<td>${mdInline(c, ctx)}</td>`).join("")}</tr>`).join("");
      push(`<table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>`, start, i - 1);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const start = i;
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])) item += ` ${lines[i++].trim()}`;
        items.push(item);
      }
      const lis = items
        .map((it) => {
          const task = it.match(/^\[( |x)\]\s+(.*)$/i);
          if (task) {
            const on = task[1].toLowerCase() === "x";
            return `<li class="task${on ? " on" : ""}"><span class="cbx">${on ? icon("check", 11).s : ""}</span><span class="tlbl">${mdInline(task[2], ctx)}</span></li>`;
          }
          return `<li>${mdInline(it, ctx)}</li>`;
        })
        .join("");
      push(ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`, start, i - 1);
      continue;
    }
    const start = i;
    const para = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^(#{1,4}\s|```|>|\s*([-*+]|\d+\.)\s+|\s*\|)/.test(lines[i])
    )
      para.push(lines[i++]);
    if (!para.length) {
      push(`<p>${mdInline(lines[i], ctx)}</p>`, i, i);
      i++;
      continue;
    }
    push(`<p>${mdInline(para.join(" "), ctx)}</p>`, start, i - 1);
  }
  return blocks;
}

const md = (text, ctx = {}) => raw(`<div class="md">${mdBlocks(text, ctx).map((b) => b.html).join("")}</div>`);

/* ---- src/js/diff.js ---- */
// Line diff (LCS), word-level marks inside paired lines, folded context, unified/split rendering.

// Edit scripts (Myers) and word marks are the mod's lib/diff.js.
const lcsOps = (a, b) => LD.lcsOps(a, b);
const wordMarks = (a, b) => LD.wordMarks(a, b);

// Rows for a whole before/after pair. Line numbers are 1-based and can start later (Edit snippets).
function diffRows(before, after, lang = "text", startA = 1, startB = 1) {
  const aL = before === "" ? [] : before.split("\n");
  const bL = after === "" ? [] : after.split("\n");
  const aTok = tokenize(before, lang);
  const bTok = tokenize(after, lang);
  const ops = lcsOps(aL, bL);
  const rows = [];
  let k = 0;
  while (k < ops.length) {
    const op = ops[k];
    if (op.t === "eq") {
      rows.push({ t: "eq", a: op.a + startA, b: op.b + startB, html: lineHTML(bTok[op.b] || []) });
      k++;
      continue;
    }
    const dels = [];
    const adds = [];
    while (k < ops.length && ops[k].t === "del") dels.push(ops[k++]);
    while (k < ops.length && ops[k].t === "add") adds.push(ops[k++]);
    const pairs = Math.min(dels.length, adds.length);
    const marks = [];
    for (let p = 0; p < pairs; p++) marks.push(wordMarks(aL[dels[p].a], bL[adds[p].b]));
    dels.forEach((d, p) => rows.push({ t: "del", a: d.a + startA, b: null, html: lineHTML(aTok[d.a] || [], marks[p] && marks[p].a), pair: p < pairs }));
    adds.forEach((d, p) => rows.push({ t: "add", a: null, b: d.b + startB, html: lineHTML(bTok[d.b] || [], marks[p] && marks[p].b), pair: p < pairs }));
  }
  return rows;
}

function diffStats(before, after) {
  const rows = lcsOps(before ? before.split("\n") : [], after ? after.split("\n") : []);
  return { add: rows.filter((r) => r.t === "add").length, del: rows.filter((r) => r.t === "del").length };
}

// Visible rows near changes, folds elsewhere, hunk headers at each visible run.
function foldItems(rows, context = 3) {
  const changed = rows.map((r) => r.t !== "eq");
  const near = rows.map((_, i) => {
    for (let d = -context; d <= context; d++) if (changed[i + d]) return true;
    return false;
  });
  const items = [];
  let i = 0;
  let foldNo = 0;
  while (i < rows.length) {
    if (near[i]) {
      const run = [];
      while (i < rows.length && near[i]) run.push(rows[i++]);
      const firstA = run.find((r) => r.a != null)?.a ?? 0;
      const firstB = run.find((r) => r.b != null)?.b ?? 0;
      const cntA = run.filter((r) => r.a != null).length;
      const cntB = run.filter((r) => r.b != null).length;
      items.push({ t: "hunk", text: `@@ -${firstA},${cntA} +${firstB},${cntB} @@` });
      items.push(...run);
    } else {
      const run = [];
      while (i < rows.length && !near[i]) run.push(rows[i++]);
      items.push({ t: "fold", rows: run, no: foldNo++ });
    }
  }
  return items;
}

function unifiedRow(r) {
  const mk = r.t === "add" ? "+" : r.t === "del" ? "−" : " ";
  return `<div class="dl ${r.t}"><span class="ln">${r.a ?? ""}</span><span class="ln">${r.b ?? ""}</span><span class="mk">${mk}</span><span class="tx">${r.html || " "}</span></div>`;
}

function foldRowHTML(item, key, label) {
  return `<div class="dl fold"><span class="ln"></span><span class="ln"></span><span class="mk"></span><span class="tx"><button data-action="unfold" data-fold="${esc(key)}">${icon("fold", 12).s} ${label}</button></span></div>`;
}

function renderUnified(items, opts) {
  const out = [];
  for (const it of items) {
    if (it.t === "hunk") {
      if (opts.hunks !== false) out.push(`<div class="dl hunk"><span class="ln"></span><span class="ln"></span><span class="mk"></span><span class="tx">${esc(it.text)}</span></div>`);
    } else if (it.t === "fold") {
      const key = `${opts.foldKey}:${it.no}`;
      if (opts.openFolds && opts.openFolds.has(key)) out.push(...it.rows.map(unifiedRow));
      else out.push(foldRowHTML(it, key, `${it.rows.length}줄 같음 · 펼치기`));
    } else out.push(unifiedRow(it));
  }
  return out.join("");
}

function splitCell(r, side) {
  if (!r) return `<div class="sd ${side} blank"><span class="ln"></span><span class="mk"></span><span class="tx"></span></div>`;
  const no = side === "left" ? r.a : r.b;
  const mk = r.t === "add" ? "+" : r.t === "del" ? "−" : "";
  return `<div class="sd ${side} ${r.t === "eq" ? "" : r.t}"><span class="ln">${no ?? ""}</span><span class="mk">${mk}</span><span class="tx">${r.html || " "}</span></div>`;
}

function renderSplit(items, opts) {
  const out = [];
  const flushBlock = (dels, adds) => {
    const n = Math.max(dels.length, adds.length);
    for (let i = 0; i < n; i++) out.push(splitCell(dels[i], "left") + splitCell(adds[i], "right"));
  };
  const emitRows = (rows) => {
    let dels = [];
    let adds = [];
    for (const r of rows) {
      if (r.t === "del") dels.push(r);
      else if (r.t === "add") adds.push(r);
      else {
        flushBlock(dels, adds);
        dels = [];
        adds = [];
        out.push(splitCell(r, "left") + splitCell(r, "right"));
      }
    }
    flushBlock(dels, adds);
  };
  let pending = [];
  for (const it of items) {
    if (it.t === "hunk" || it.t === "fold") {
      emitRows(pending);
      pending = [];
      if (it.t === "hunk") out.push(`<div class="sd hunk">${esc(it.text)}</div>`);
      else {
        const key = `${opts.foldKey}:${it.no}`;
        if (opts.openFolds && opts.openFolds.has(key)) emitRows(it.rows);
        else out.push(`<div class="sd fold"><button data-action="unfold" data-fold="${esc(key)}">${icon("fold", 12).s} ${it.rows.length}줄 같음 · 펼치기</button></div>`);
      }
    } else pending.push(it);
  }
  emitRows(pending);
  return out.join("");
}

function renderDiff(before, after, opts = {}) {
  const o = { lang: "text", mode: "unified", wrap: false, startA: 1, startB: 1, context: 3, foldKey: "d", ...opts };
  const numbered = diffRows(before, after, o.lang, o.startA, o.startB);
  const rows = o.numbers === false ? numbered.map((r) => ({ ...r, a: null, b: null })) : numbered;
  const items = o.fold === false ? rows : foldItems(rows, o.context);
  const body = o.mode === "split" ? renderSplit(items, o) : renderUnified(items, o);
  return raw(`<div class="diff ${o.mode === "split" ? "diff-split" : ""} ${o.wrap ? "wrap" : ""}"><div class="diff-in">${body}</div></div>`);
}

// A few changed lines for small cards.
function miniDiff(before, after, max = 6) {
  const ops = lcsOps(before.split("\n"), after.split("\n"));
  const a = before.split("\n");
  const b = after.split("\n");
  return ops
    .filter((o) => o.t !== "eq")
    .slice(0, max)
    .map((o) => (o.t === "add" ? { t: "a", text: b[o.b] } : { t: "d", text: a[o.a] }));
}

// The page's store, in the shape the views read: agents, calls, prompts, replies (with their
// links) and changed files. data/real.js rebuilds it whenever herdr or a transcript changes.

let DB = emptyStore();

function emptyStore() {
  return { roster: { nodes: {}, kids: {}, roots: [] }, agents: [], calls: [], prompts: [], replies: [], files: [], agentIndex: new Map(), callIndex: new Map(), callsByAgent: new Map(), byAgent: new Map() };
}

const agentById = (id) => DB.agentIndex.get(id) ?? null;
const callById = (id) => DB.callIndex.get(id) ?? null;
const callsOf = (id) => DB.callsByAgent.get(id) ?? [];
const childCalls = () => [];
const promptsOf = (id) => DB.byAgent.get(id)?.prompts ?? [];
const repliesOf = (id) => DB.byAgent.get(id)?.replies ?? [];
const filesOf = (id) => DB.byAgent.get(id)?.files ?? [];

// Every link of an agent, told apart by who brought it: `from` is "agent" (in a reply) or
// "user" (in a prompt); `src` and `srcN` name that reply or prompt.
const linksOf = (id) => [
  ...repliesOf(id).flatMap((r) => r.links.map((l) => ({ ...l, from: "agent", agent: r.agent, reply: r.n, srcN: r.n, turn: r.turn, replyTs: r.ts, key: `${r.agent}:${r.n}:${l.n}` }))),
  ...promptsOf(id).flatMap((p) => (p.links ?? []).map((l) => ({ ...l, from: "user", agent: p.agent, reply: null, srcN: p.n, turn: p.n, replyTs: p.ts, key: `${p.agent}:p${p.n}:${l.n}` }))),
];

const allLinks = () => DB.agents.flatMap((a) => linksOf(a.id));

const fileStats = (f) => ({ add: f.add ?? 0, del: f.del ?? 0, lock: false });

function agentStats(id) {
  const files = filesOf(id);
  const calls = callsOf(id);
  return {
    calls: calls.length,
    errors: calls.filter((c) => c.status === "error").length,
    links: linksOf(id).length,
    prompts: promptsOf(id).filter((p) => LS.isHumanPrompt(p)).length,
    files: files.length,
    add: sum(files, (f) => f.add),
    del: sum(files, (f) => f.del),
  };
}

// What the agent is doing now: a pending approval, a running call, else its last call.
function currentCall(id) {
  const calls = callsOf(id);
  return calls.find((c) => c.status === "pending") || [...calls].reverse().find((c) => c.status === "running") || calls[calls.length - 1] || null;
}

const STATUS_RANK = { blocked: 5, done: 4, working: 3, idle: 2, offline: 1, running: 1, ended: 0 };
const STATUS_LABEL = { blocked: "응답 필요", done: "완료", working: "작업 중", idle: "대기", offline: "연결 필요", running: "실행 중", ended: "끝남" };

// Sub-agents: terminals an agent started with `hc run` (the mod's lib/tree.js walks the tree).
const subsOf = (id) => LTR.descendants(DB.roster, id);
const parentsOf = (id) => LTR.ancestors(DB.roster, id);

// Live data from bin/server.py: herdr's agents, and each one's transcript read incrementally
// and reduced with the mod's lib/session.js (the same events the herdr mod reads).

const LIVE = {
  token: takeToken(),
  agents: [],
  spaces: [],
  spacesAt: 0,
  lastFocus: null,
  me: null,
  sessions: {},
  synced: {},
  busy: new Set(),
  home: "",
  error: null,
  agentsAt: 0,
  ticking: false,
  held: false,
  pending: false,
  link: null,
};

// The mod opens this page with #t=<token>&agent=…&lens=…&call=…; keep the token, drop it from the URL.
function takeToken() {
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("t");
  try {
    if (token) sessionStorage.setItem("agent-dash-token", token);
    return token || sessionStorage.getItem("agent-dash-token");
  } catch {
    return token;
  }
}

function deepLink() {
  const params = new URLSearchParams(location.hash.slice(1));
  const link = { agent: params.get("agent"), lens: params.get("lens"), call: params.get("call") };
  if (params.has("t")) history.replaceState(null, "", location.pathname + location.search);
  return link;
}

class ApiError extends Error {
  constructor(status, message) {
    super(message);
    this.status = status;
  }
}

async function api(path) {
  const response = await fetch(path, { headers: { "X-Agent-Dash-Token": LIVE.token ?? "" }, cache: "no-store" });
  if (!response.ok) throw new ApiError(response.status, response.status === 401 ? "토큰이 맞지 않아요" : `서버 응답 ${response.status}`);
  return response;
}

function parseEvents(text) {
  const events = [];
  let end = null;
  for (const line of text.split("\n")) {
    if (!line) continue;
    try {
      const event = JSON.parse(line);
      if (event.k === "end") end = event;
      else events.push(event);
    } catch {
      // A cut line: the next read starts from the last complete one.
    }
  }
  return { events, end };
}

// Spaces with their logos (the mod writes them when it opens this page); read now and then.
async function loadSpaces() {
  if (Date.now() - LIVE.spacesAt < 30000) return false;
  LIVE.spacesAt = Date.now();
  // Your own picture for the chat view, asked once.
  // (An older server answers with an error instead: ask again later, after it has been restarted.)
  if (LIVE.me === null) LIVE.me = await api("/api/me").then((r) => r.json()).then((body) => ("avatar" in body ? body : null)).catch(() => null);
  try {
    const body = await (await api("/api/spaces")).json();
    const next = body.spaces ?? [];
    const changed = JSON.stringify(next) !== JSON.stringify(LIVE.spaces);
    LIVE.spaces = next;
    return changed;
  } catch {
    return false;
  }
}

// Herdr's focus drives the page: when the agent in focus there changes, show that one. The first
// reading only records it, so a link that opened a specific agent keeps it.
async function followFocus() {
  if (!STATE.followFocus) {
    LIVE.lastFocus = null;
    return false;
  }
  const at = (await (await api("/api/focus-state")).json()).agent;
  if (!at || at === LIVE.lastFocus) return false;
  const first = LIVE.lastFocus === null;
  LIVE.lastFocus = at;
  if (first || at === STATE.scope || !LIVE.agents.some((a) => a.address === at && a.provider)) return false;
  go({ concept: "A", scope: at });
  return true;
}

async function loadAgents() {
  const spacesChanged = await loadSpaces();
  const body = await (await api("/api/agents")).json();
  const before = new Map(LIVE.agents.map((a) => [a.address, a.status]));
  LIVE.agents = body.agents ?? [];
  LIVE.home = body.home ?? LIVE.home;
  for (const a of LIVE.agents) {
    const was = before.get(a.address);
    if (was && was !== a.status) notifyStatus(a);
  }
  return spacesChanged || LIVE.agents.some((a) => before.get(a.address) !== a.status) || before.size !== LIVE.agents.length;
}

// Same cadence as the herdr mod: the agent on screen often, the rest gently.
function readEvery(a) {
  const selected = STATE.scope === a.address;
  const fleet = STATE.scope === "all";
  // A finished sub-agent's transcript is complete; the selected agent's sub-agents are read too.
  if (a.state === "ended") return LIVE.sessions[a.address]?.loaded && (LIVE.synced[a.address] ?? 0) > (a.finished_ms ?? 0) + 1000 ? 300000 : 2000;
  if (!selected && !fleet && parentsOf(a.address).includes(STATE.scope)) return a.status === "working" ? 2500 : 15000;
  if (selected) return a.status === "working" ? 1500 : 5000;
  if (fleet) return a.status === "working" ? 4000 : 20000;
  return a.status === "working" ? 12000 : 60000;
}

async function syncAgent(a) {
  LIVE.busy.add(a.address);
  LIVE.synced[a.address] = Date.now();
  let changed = false;
  try {
    for (let chunk = 0; chunk < 40; chunk++) {
      const prev = LIVE.sessions[a.address];
      const current = prev && prev.provider === a.provider && !prev.note ? prev : LS.emptySession(a.provider);
      const query = `agent=${encodeURIComponent(a.address)}&file=${encodeURIComponent(current.file ?? "-")}&offset=${current.offset}`;
      const { events, end } = parseEvents(await (await api(`/api/session?${query}`)).text());
      if (!end) break;
      if (events[0]?.k === "missing") {
        if (prev?.note !== "missing") changed = true;
        LIVE.sessions = { ...LIVE.sessions, [a.address]: { ...LS.emptySession(a.provider), loaded: true, note: "missing" } };
        break;
      }
      const fresh = events[0]?.k === "file";
      const base = fresh ? LS.emptySession(a.provider, events[0]) : end.reset ? LS.emptySession(a.provider, current) : current;
      const next = LS.applyBatch(base, fresh ? events.slice(1) : events, end);
      if (events.length || fresh || !prev?.loaded) {
        LIVE.sessions = { ...LIVE.sessions, [a.address]: next };
        if (prev?.loaded && next.calls.length > prev.calls.length) onNewCall({ id: next.calls[next.calls.length - 1].id, agent: a.address });
        changed = true;
      }
      if (!end.more) break;
    }
  } finally {
    LIVE.busy.delete(a.address);
  }
  return changed;
}

async function tick() {
  if (LIVE.ticking || !LIVE.token) return;
  LIVE.ticking = true;
  let changed = false;
  try {
    if (Date.now() - LIVE.agentsAt > 2500) {
      changed = (await loadAgents()) || changed;
      LIVE.agentsAt = Date.now();
    }
    changed = (await followFocus().catch(() => false)) || changed;
    const due = LIVE.agents.filter((a) => a.provider && !LIVE.busy.has(a.address) && Date.now() - (LIVE.synced[a.address] ?? 0) >= readEvery(a));
    const results = await Promise.all(due.map((a) => syncAgent(a).catch(() => false)));
    changed = results.some(Boolean) || changed;
    if (LIVE.error) changed = true;
    LIVE.error = null;
  } catch (error) {
    changed = changed || String(LIVE.error) !== String(error);
    LIVE.error = error;
  } finally {
    LIVE.ticking = false;
  }
  if (changed) refresh();
  applyDeepLink();
}

function refresh() {
  DB = buildStore();
  if (LIVE.held) LIVE.pending = true;
  else renderAll();
}

// A re-render under a pressed pointer would swallow the click: wait for release.
document.addEventListener("pointerdown", () => {
  LIVE.held = true;
});
const releasePointer = () => {
  LIVE.held = false;
  if (LIVE.pending) {
    LIVE.pending = false;
    setTimeout(renderAll, 0);
  }
};
document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);

function applyDeepLink() {
  const link = LIVE.link;
  if (!link || !link.agent || !agentById(link.agent)) return;
  if (link.call && !callById(link.call) && !LIVE.sessions[link.agent]?.loaded) return;
  LIVE.link = null;
  go({ scope: link.agent, lens: link.lens || (link.call ? "tools" : "overview"), select: link.call && callById(link.call) ? ["call", link.call] : null });
}

const lookingAt = (id) => document.visibilityState === "visible" && STATE.scope === id;

function notifyStatus(a) {
  if (lookingAt(a.address) || a.sub) return;
  const title = a.title || a.address;
  if (a.status === "blocked") {
    toast({ title: `응답 필요 · ${title}`, body: esc(a.msg || "에이전트가 답을 기다려요"), kind: "blocked", action: { label: "보기", run: () => go({ scope: a.address, lens: "overview" }) }, timeout: 8000 });
  } else if (a.status === "done") {
    toast({ title: `완료 · ${title}`, body: "보고 있지 않을 때 끝났어요.", kind: "done", action: { label: "열기", run: () => go({ scope: a.address, lens: "overview" }) } });
  }
}

const PART_MEMO = new WeakMap();

function windowOf(s) {
  if (s?.win) return s.win;
  if (/\[1m\]|1m/i.test(s?.model ?? "") || (s?.ctx ?? 0) > 200000) return 1000000;
  return 200000;
}

const BADGE_CLS = { pr: "pr", issue: "issue", adv: "adv", pkg: "pkg" };

function sessionPart(a, s) {
  const hit = PART_MEMO.get(s);
  if (hit && hit.status === a.status) return hit.value;
  const ms = (ts) => (ts - T0) / 1000;
  const calls = LS.visibleCalls(s).map((c) => {
    const end = c.result?.ts ?? null;
    const dur = c.result?.extra?.ms != null ? c.result.extra.ms / 1000 : end && c.ts ? Math.max(0, (end - c.ts) / 1000) : null;
    return { ...c, agent: a.address, status: LS.callStatus(c, s, a.status), dur, endTs: end, t: ms(c.ts) };
  });
  const linksByReply = groupBy(s.links.filter((l) => l.from !== "user"), (l) => l.reply);
  const linksByPrompt = groupBy(s.links.filter((l) => l.from === "user"), (l) => l.prompt);
  const value = {
    calls,
    // Links the person handed over in a prompt (the agent's are on its replies, below).
    prompts: s.prompts.map((p) => ({
      ...p, agent: a.address, t: ms(p.ts),
      links: (linksByPrompt[p.n] ?? []).map((l, k) => ({ url: l.url, label: l.label, title: l.title, context: l.context, local: l.local, n: k + 1, badge: l.badge ? { cls: BADGE_CLS[l.badge.kind] ?? "", text: l.badge.text } : null })),
    })),
    replies: s.replies.map((r) => ({
      ...r,
      agent: a.address,
      t: ms(r.ts),
      links: (linksByReply[r.n] ?? []).map((l, k) => ({ url: l.url, label: l.label, title: l.title, context: l.context, local: l.local, n: k + 1, badge: l.badge ? { cls: BADGE_CLS[l.badge.kind] ?? "", text: l.badge.text } : null })),
    })),
    files: LS.changedFiles(s).map((f) => ({ ...f, agent: a.address, abs: f.path, path: LP.relPath(f.path, a.cwd, LIVE.home), key: `${a.address}:${f.path}` })),
  };
  PART_MEMO.set(s, { status: a.status, value });
  return value;
}

function adaptAgent(a, s) {
  const u = s?.usage ?? { in: 0, out: 0, cr: 0, cw: 0 };
  return {
    id: a.address,
    title: (a.sub ? a.name || a.title : LTR.agentName(a.tab, a.title)) || s?.customTitle || s?.title || (a.provider === "codex" ? "Codex" : a.provider === "claude" ? "Claude Code" : a.program || a.address),
    summary: a.sub ? "" : a.title || "",
    app: a.provider === "codex" ? "codex" : a.provider === "claude" ? "claude" : a.app || "program",
    address: a.address,
    parent: a.parent ?? null,
    sub: !!a.sub,
    state: a.state ?? "live",
    isAgent: !!a.app,
    task: a.task ?? null,
    command: a.command ?? "",
    created: a.created_ms ?? null,
    finished: a.finished_ms ?? null,
    exit: a.exit_code ?? null,
    reason: a.reason ?? null,
    provider: a.provider,
    model: s?.model ?? "",
    space: a.space ?? "",
    tab: a.tab ?? "",
    machine: a.machine ?? null,
    cwd: LP.tildePath(a.cwd ?? s?.cwd ?? "", LIVE.home),
    cwdAbs: a.cwd ?? s?.cwd ?? null,
    branch: a.branch ?? null,
    status: a.status ?? "idle",
    sinceTs: a.status_ms ?? Date.now(),
    unseen: a.status === "done" && !a.sub,
    msg: a.msg ?? null,
    tokens: { input: u.in, output: u.out, cacheRead: u.cr, cacheWrite: u.cw },
    context: { used: s?.ctx ?? 0, limit: windowOf(s) },
    inferred: !!s?.inferred,
    note: s?.note ?? null,
    loaded: !!s?.loaded,
    compacts: s?.compacts?.length ?? 0,
  };
}

function buildRoster(agents) {
  const nodes = Object.fromEntries(agents.map((a) => [a.id, a]));
  const kids = {};
  for (const a of agents) {
    if (!a.parent || !nodes[a.parent] || a.parent === a.id) continue;
    kids[a.parent] = [...(kids[a.parent] ?? []), a.id];
  }
  const age = (id) => (nodes[id].state === "live" ? nodes[id].created ?? 0 : (nodes[id].finished ?? 0) + 1e15);
  for (const k of Object.keys(kids)) kids[k] = kids[k].sort((x, y) => age(x) - age(y));
  const roots = agents.filter((a) => !a.parent || !nodes[a.parent] || a.parent === a.id).map((a) => a.id);
  return { nodes, kids, roots };
}

function buildStore() {
  const store = emptyStore();
  store.roster = buildRoster(LIVE.agents.map((a) => adaptAgent(a, LIVE.sessions[a.address])));
  for (const a of LIVE.agents) {
    const s = LIVE.sessions[a.address];
    const agent = store.roster.nodes[a.address];
    store.agents.push(agent);
    store.agentIndex.set(agent.id, agent);
    const part = s ? sessionPart(a, s) : { calls: [], prompts: [], replies: [], files: [] };
    store.byAgent.set(agent.id, part);
    store.callsByAgent.set(agent.id, part.calls);
    for (const c of part.calls) store.callIndex.set(c.id, c);
    store.calls.push(...part.calls);
    store.prompts.push(...part.prompts);
    store.replies.push(...part.replies);
    store.files.push(...part.files);
  }
  return store;
}

function startLive() {
  LIVE.link = deepLink();
  tick();
  setInterval(tick, 1500);
}
