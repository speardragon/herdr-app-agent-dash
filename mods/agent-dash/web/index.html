// Bash and Codex shell, drawn as the terminal window they ran in.

// Secrets are masked by the mod's lib/tools.js (••••); here they become lock chips.
const unmaskHTML = (htmlStr) => htmlStr.replace(/••••/g, `<span class="secret" title="가려진 비밀값">${icon("lock", 11).s}••••</span>`);

// Real results -> what the terminal view reads: {stdout, stderr, exit, background, tests, readFile}.
function shellResult(call) {
  const x = call.result?.extra ?? {};
  const text = call.result?.text ?? "";
  const stdout = x.stdout ?? (x.stderr == null ? text : "");
  const exitText = /Exit code (\d+)/.exec(text);
  const exit = x.exit ?? (exitText ? Number(exitText[1]) : call.result ? (call.result.err ? 1 : 0) : null);
  const sed = /^\s*sed -n ['"]?(\d+),(\d+)p['"]?\s+(\S+)\s*$/.exec(shellText(call.input ?? {}));
  return {
    stdout: maskedText(stdout),
    stderr: maskedText(x.stderr ?? ""),
    exit,
    background: x.bg ?? null,
    tests: parseTests(stripAnsi(stdout)),
    readFile: sed && stdout && !call.result?.err ? { path: sed[3], from: Number(sed[1]), lang: langOf(sed[3]) } : null,
  };
}

// vitest ("Tests  9 passed (9)") and jest ("Tests: 1 failed, 9 passed, 10 total") summaries.
function parseTests(out) {
  const vitest = /Tests\s+(?:(\d+) failed \| )?(\d+) passed(?: \| (\d+) skipped)?/.exec(out);
  const jest = /Tests:\s+(?:(\d+) failed, )?(?:(\d+) skipped, )?(\d+) passed/.exec(out);
  const files = /Test (?:Files|Suites):?\s+(?:\d+ failed[,|] ?)?(\d+) (?:passed|total)/.exec(out);
  const duration = /(?:Duration|Time:)\s+([\d.]+\s?m?s)/.exec(out);
  if (vitest) return { failed: Number(vitest[1] ?? 0), passed: Number(vitest[2]), skipped: Number(vitest[3] ?? 0), files: Number(files?.[1] ?? 0), duration: duration?.[1] ?? "" };
  if (jest) return { failed: Number(jest[1] ?? 0), skipped: Number(jest[2] ?? 0), passed: Number(jest[3]), files: Number(files?.[1] ?? 0), duration: duration?.[1] ?? "" };
  return null;
}

function commandHTML(cmd) {
  const masked = maskSecrets(cmd);
  const lines = hl(masked.text, "bash");
  const body = lines.map((l, i) => `${i === 0 ? '<span class="ps1">$ </span>' : '<span class="ps1">  </span>'}${unmaskHTML(l)}`).join("\n");
  return { html: body, secrets: masked.count };
}

function outputHTML(call, text, isErr, foldKey) {
  const lines = text.replace(/\n$/, "").split("\n");
  const open = STATE.openFolds.has(foldKey);
  const render = (ls) => ls.map((l) => (isErr || /^(npm ERR!|error:|fatal:)/i.test(stripAnsi(l)) ? `<span class="term-err">${ansiToHtml(l) || " "}</span>` : ansiToHtml(l))).join("\n");
  if (lines.length <= 40 || open) return render(lines);
  const head = lines.slice(0, 14);
  const tail = lines.slice(-12);
  return `${render(head)}\n<button class="term-fold" data-action="unfold" data-fold="${esc(foldKey)}">${lines.length - 26}줄 더 보기</button>${render(tail)}`;
}

function shellDigest(call) {
  const r = shellResult(call);
  const out = r.stdout || "";
  if (r.tests) {
    const t = r.tests;
    const total = t.passed + t.failed + t.skipped;
    return html`<div class="digest-card">
      <div class="dstat ${t.failed ? "bad" : "ok"}"><b>${t.failed ? `${t.failed}개 실패` : "모두 통과"}</b>테스트 ${total}개 · 파일 ${t.files}개</div>
      <div class="testbar" role="img" aria-label="통과 ${t.passed}, 실패 ${t.failed}">
        <i class="p" style="flex:${t.passed}"></i>${t.failed ? raw(`<i class="f" style="flex:${t.failed}"></i>`) : ""}${t.skipped ? raw(`<i class="s" style="flex:${t.skipped}"></i>`) : ""}
      </div>
      <div class="dstat"><b>${t.duration}</b>걸린 시간</div>
    </div>`;
  }
  if (r.audit) {
    const c = r.audit.counts;
    return html`<div class="sev">
        <div class="crit"><div class="k">critical</div><div class="v">${c.critical}</div></div>
        <div class="high"><div class="k">high</div><div class="v">${c.high}</div></div>
        <div class="mod"><div class="k">moderate</div><div class="v">${c.moderate}</div></div>
        <div class="low"><div class="k">low</div><div class="v">${c.low}</div></div>
      </div>
      <div class="box" style="margin-bottom:12px;overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>패키지</th><th>심각도</th><th>내용</th><th>영향 범위</th><th>고친 버전</th><th>경로</th></tr></thead>
          <tbody>${r.audit.rows.map(
            (row) => html`<tr>
              <td class="mono"><b>${row.pkg}</b></td>
              <td><span class="sevp ${row.sev}">${row.sev}</span></td>
              <td><div>${row.title}</div><a class="mono dim" href="https://github.com/advisories/${row.id}" target="_blank" rel="noopener" style="font-size:11.5px">${row.id}</a></td>
              <td class="mono dim">${row.range}</td>
              <td class="mono"><span class="ver-new">${row.fix}</span></td>
              <td class="dim">${row.via}</td>
            </tr>`,
          )}</tbody>
        </table>
      </div>`;
  }
  if (/^Check passed:/m.test(out)) {
    const path = out.match(/^Check passed: (.*)$/m)[1];
    return html`<div class="digest-card"><span style="color:#7fcf86">${icon("circle-check", 20)}</span><div class="dstat ok"><b>herdr-app check 통과</b><span class="mono">${shortPath(path)}</span></div></div>`;
  }
  if (r.background) {
    const url = (out.match(/https?:\/\/localhost:\d+\/?/) || [])[0];
    return html`<div class="digest-card"><span class="pill working">${spinner(12)} 백그라운드 실행 중</span><div class="dstat"><b class="mono">${r.background}</b>셸 ID · BashOutput으로 읽음</div>${url ? html`<a class="btn sm" href="${url}" target="_blank" rel="noopener">${icon("external", 13)} ${url}</a>` : ""}</div>`;
  }
  return "";
}

function renderShellRead(call) {
  const r = shellResult(call);
  const cmd = shellText(call.input);
  const lines = hl(r.stdout, r.readFile.lang);
  return html`<div class="editor">
    <div class="ed-tabs"><div class="ed-tab on">${fileIcon(r.readFile.path)} ${baseName(r.readFile.path)}</div><div class="ed-right"><span class="chip mono">${icon("terminal", 12)} 셸로 읽음</span></div></div>
    <div class="ed-sub"><span class="path">${r.readFile.path}</span><span class="grow"></span><span class="mono">${cmd}</span></div>
    <div class="code" data-keep-scroll="code-${call.id}"><div class="code-in">${lines.map((l, i) => raw(`<div class="cl in-range"><span class="ln">${r.readFile.from + i}</span><span class="gm"></span><span class="tx">${l || " "}</span></div>`))}</div></div>
  </div>`;
}

// A command shows three lines until it is opened (long one-liners wrap, so the lines are
// counted as drawn, by CSS).
function shellCommandBlock(call, cmd, cmdHtml) {
  const text = String(cmd ?? "");
  const long = text.split("\n").length > 3 || text.length > 240;
  if (!long) return html`<div class="term-cmd">${raw(cmdHtml)}</div>`;
  const key = `cmd:${call.id}`;
  const open = STATE.openFolds.has(key);
  const more = text.split("\n").length - 3;
  return html`<div class="term-cmd ${open ? "" : "clamp"}">${raw(cmdHtml)}</div>
    <button class="term-fold cmd" data-action="unfold" data-fold="${key}" aria-expanded="${open}">${open ? "접기" : more > 0 ? `전체 명령 보기 (${more}줄 더)` : "전체 명령 보기"}</button>`;
}

function renderShell(call) {
  if (call.name === "exec") return renderExecScript(call);
  const i = call.input;
  const r = shellResult(call);
  if (r.readFile) return renderShellRead(call);
  const cmd = shellText(i);
  const { html: cmdHtml, secrets } = commandHTML(cmd);
  const running = call.status === "running";
  const cwd = i.workdir || i.cwd || agentById(call.agent)?.cwd;
  const title = i.description || (call.name === "Bash" ? cmd.split(" ")[0] : `codex · ${cmd.split(" ")[0]}`);
  const exitChip =
    r.exit == null
      ? ""
      : html`<span class="chip mono ${r.exit === 0 ? "exit-ok" : "exit-bad"}">exit ${r.exit}</span>`;
  const outText = r.stdout || "";
  const errText = r.stderr || "";
  const outLines = outText ? outText.replace(/\n$/, "").split("\n").length : 0;
  const errLines = errText ? errText.split("\n").length : 0;
  return html`${shellDigest(call)}
  <div class="term">
    <div class="term-bar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="term-title truncate">${title}</div>
      <div class="term-chips">
        ${cwd ? html`<span class="chip mono cwd" title="${cwd}">${icon("folder", 11)} ${baseName(cwd)}</span>` : ""}
        ${i.run_in_background ? html`<span class="chip mono">background</span>` : ""}
        ${i.timeout ? html`<span class="chip mono">timeout ${Math.round(i.timeout / 1000)}s</span>` : ""}
        ${i.dangerouslyDisableSandbox ? html`<span class="chip warn">${icon("alert", 11)} 샌드박스 해제</span>` : ""}
        ${secrets ? html`<span class="chip warn">${icon("lock", 11)} 비밀값 ${secrets}개 가림</span>` : ""}
        </div>
    </div>
    <div class="term-body term-sec in">
      <div class="term-lab">입력</div>${shellCommandBlock(call, cmd, cmdHtml)}
    </div>
    <div class="term-body term-sec out" data-keep-scroll="term-${call.id}">
      <div class="term-lab">출력${exitChip}</div>${outText || errText || running
        ? raw(
            `<div class="term-out">${outText ? outputHTML(call, outText, false, `out:${call.id}`) : ""}${errText ? `${outText ? "\n" : ""}${outputHTML(call, errText, true, `err:${call.id}`)}` : ""}${running ? '<span class="term-cursor" aria-hidden="true"></span>' : ""}</div>`,
          )
        : html`<div class="term-out dim">(출력 없음)</div>`}
    </div>
    <div class="term-foot">
      <span>출력 <b>${outLines}</b>줄</span>
      ${errLines ? html`<span style="color:#ff8a80">stderr <b>${errLines}</b>줄</span>` : ""}
      ${running ? html`<span class="pulse" style="color:var(--working)">실행 중 · <b data-elapsed="${call.ts}">${fmtDur((Date.now() - call.ts) / 1000)}</b></span>` : html`<span>걸린 시간 <b>${fmtDur(call.dur)}</b></span>`}
      <span class="grow"></span>
      <button class="btn ghost sm" data-action="copy" data-copy="${maskSecrets(cmd).text.replace(/\u0001\d+\u0001/g, "****")}">${icon("copy", 12)} 명령 복사${secrets ? " (비밀값 제외)" : ""}</button>
    </div>
  </div>`;
}

// Codex's exec tool: JavaScript that calls the real tools (each also listed on its own).
function renderExecScript(call) {
  const text = call.result?.text ?? "";
  return html`<div class="dim" style="margin-bottom:8px;font-size:var(--fs-sm)">Codex가 도구를 부르는 스크립트예요. 실행한 명령은 각각 따로 기록돼요.</div>

    ${text ? html`<div class="term" style="margin-top:10px"><div class="term-body"><div class="term-out">${raw(outputHTML(call, maskedText(text), false, `out:${call.id}`))}</div></div></div>` : ""}`;
}

/* ---- src/js/tools/files.js ---- */
// Read / Edit / MultiEdit / Write / apply_patch, drawn as an editor.

function rangeMinimap(call, range, total) {
  const prev = callsOf(call.agent)
    .filter((c) => c.name === "Read" && c.input.file_path === call.input.file_path && c.ts < call.ts)
    .map(readResult)
    .filter((r) => r?.kind === "text")
    .map((r) => r.range);
  const seg = ([a, b], cls) => `<i class="${cls}" style="left:${((a - 1) / total) * 100}%;width:max(3px, ${((b - a + 1) / total) * 100}%)"></i>`;
  return html`<div class="minimap" role="img" aria-label="전체 ${total}줄 중 ${range[0]}–${range[1]}번째 줄">${raw(prev.map((p) => seg(p, "prev")).join("") + seg(range, ""))}</div>
    <div class="minimap-lbl"><span>1</span><span>${prev.length ? `이 파일을 ${prev.length + 1}번째 읽음 · 흐린 칸은 이전에 읽은 곳` : `${range[0]}–${range[1]}번째 줄`}</span><span>${fmtInt(total)}</span></div>`;
}

// A Read result in the shape this view draws: the window of lines it returned, or an image.
function readResult(call) {
  const x = call.result?.extra ?? {};
  if (x.type === "image") {
    return { kind: "image", format: x.media ?? "image", width: x.dims?.originalWidth ?? x.dims?.width ?? "?", height: x.dims?.originalHeight ?? x.dims?.height ?? "?", bytes: x.size ?? 0 };
  }
  const f = x.file;
  if (!f) return null;
  const from = f.startLine ?? 1;
  const n = f.numLines ?? (f.content ?? "").split("\n").length;
  return { kind: "text", startLine: from, numLines: n, totalLines: f.totalLines ?? n, window: { text: f.content ?? "", from }, range: [from, from + Math.max(0, n - 1)] };
}

function mdWithRange(text, from, range) {
  const blocks = mdBlocks(text);
  const out = [];
  let inRun = [];
  const flush = () => {
    if (inRun.length) out.push(`<div class="md-range">${inRun.join("")}</div>`);
    inRun = [];
  };
  for (const b of blocks) {
    const a = from + b.from - 1;
    const z = from + b.to - 1;
    if (z >= range[0] && a <= range[1]) inRun.push(b.html);
    else {
      flush();
      out.push(`<div class="md-out">${b.html}</div>`);
    }
  }
  flush();
  return raw(`<div class="md" style="padding:14px 18px 18px">${out.join("")}</div>`);
}

function codeView(text, { from = 1, range = null, lang = "text", gutter = null, wrap = false, scrollKey = "" } = {}) {
  const lines = hl(text, lang);
  const rows = lines.map((l, idx) => {
    const n = from + idx;
    const inR = !range || (n >= range[0] && n <= range[1]);
    const g = gutter ? gutter(n) : "";
    return `<div class="cl ${range ? (inR ? "in-range" : "out-range") : ""} ${g}"><span class="ln">${n}</span><span class="gm"></span><span class="tx">${l || " "}</span></div>`;
  });
  return raw(`<div class="code ${wrap ? "wrap" : ""}" ${scrollKey ? `data-keep-scroll="${scrollKey}"` : ""}><div class="code-in">${rows.join("")}</div></div>`);
}

function renderImageRead(call) {
  const r = readResult(call);
  const path = relPath(call.input.file_path, call.agent);
  const actual = uiGet(`${call.id}:zoom`, "fit") === "actual";
  return html`<div class="editor">
    <div class="ed-tabs"><div class="ed-tab on">${fileIcon(path)} ${baseName(path)}</div><div class="ed-right">${r.format} · ${r.width}×${r.height} · ${fmtBytes(r.bytes)}</div></div>
    <div class="ed-sub"><span class="path truncate">${path}</span><span class="grow"></span>
      <div class="seg" role="group" aria-label="이미지 크기">
        <button data-action="ui-set" data-key="${call.id}:zoom" data-value="fit" aria-pressed="${!actual}">창에 맞춤</button>
        <button data-action="ui-set" data-key="${call.id}:zoom" data-value="actual" aria-pressed="${actual}">원본 비율</button>
      </div>
    </div>
    <div class="img-view ${actual ? "actual" : ""}" style="${actual ? "overflow:auto;place-items:start" : ""}">${apiImage(call.agent, call.input.file_path)}</div>
    <div class="ed-sub" style="border-top:1px solid var(--border);border-bottom:0">${icon("info", 12)} 기록에는 형식·크기만 남아서, 지금 디스크에 있는 파일을 보여줘요.</div>
  </div>`;
}

function renderRead(call) {
  const i = call.input;
  const r = readResult(call);
  if (!r) return resultNote(call);
  if (r.kind === "image") return renderImageRead(call);
  const path = relPath(i.file_path, call.agent);
  const range = r.range || [r.startLine, r.startLine + r.numLines - 1];
  const lang = r.lang || langOf(i.file_path);
  const isMd = lang === "md";
  const view = uiGet(`${call.id}:view`, isMd ? "rendered" : "code");
  const wrap = uiGet(`${call.id}:wrap`, false);
  return html`<div class="editor">
    <div class="ed-tabs">
      <div class="ed-tab on">${fileIcon(path)} ${baseName(path)}</div>
      <div class="ed-right">읽음 · <b style="color:var(--foreground)">${range[0]}–${range[1]}</b>번째 줄 / 전체 ${fmtInt(r.totalLines)}줄</div>
    </div>
    ${rangeMinimap(call, range, r.totalLines)}
    <div class="ed-sub"><span class="path truncate">${path}</span><span class="grow"></span>
      ${isMd
        ? html`<div class="seg" role="group" aria-label="보기">
            <button data-action="ui-set" data-key="${call.id}:view" data-value="rendered" aria-pressed="${view === "rendered"}">문서</button>
            <button data-action="ui-set" data-key="${call.id}:view" data-value="code" aria-pressed="${view === "code"}">원문</button>
          </div>`
        : ""}
      <button class="btn ghost sm" data-action="ui-toggle" data-key="${call.id}:wrap" aria-pressed="${wrap}">${icon("wrap", 13)} 줄바꿈</button>
    </div>
    <div class="ed-body">${isMd && view === "rendered"
      ? mdWithRange(r.window.text, r.window.from, range)
      : codeView(r.window.text, { from: r.window.from, range, lang, wrap, scrollKey: `read-${call.id}` })}</div>
  </div>`;
}

function editToolbar(call, path, plusMinus) {
  const mode = uiGet(`${call.id}:mode`, "unified");
  const wrap = uiGet(`${call.id}:wrap`, false);
  const file = DB.files.find((f) => f.agent === call.agent && f.abs === call.input.file_path);
  return html`<div class="ed-sub">
    <span class="path truncate">${path}</span>
    ${call.input.replace_all ? html`<span class="chip">모두 바꾸기</span>` : ""}
    ${call.result?.extra?.userModified ? html`<span class="chip warn">사용자가 고쳐서 승인</span>` : ""}
    <span class="grow"></span>
    ${plusMinus}
    <div class="seg" role="group" aria-label="diff 보기">
      <button data-action="ui-set" data-key="${call.id}:mode" data-value="unified" aria-pressed="${mode === "unified"}">${icon("rows", 12)} 한 줄</button>
      <button data-action="ui-set" data-key="${call.id}:mode" data-value="split" aria-pressed="${mode === "split"}">${icon("columns", 12)} 나란히</button>
    </div>
    <button class="btn ghost sm" data-action="ui-toggle" data-key="${call.id}:wrap" aria-pressed="${wrap}">${icon("wrap", 13)} 줄바꿈</button>
    ${file ? html`<button class="btn sm" data-action="open-file" data-agent="${call.agent}" data-path="${file.path}">누적 변경 ${icon("arrow-right", 12)}</button>` : ""}
  </div>`;
}

const plusMinusHTML = (add, del) => html`<span class="plus-minus"><span class="a">+${add}</span> <span class="d">−${del}</span></span>`;

function renderEdit(call) {
  const i = call.input;
  const r = call.result || {};
  const path = relPath(i.file_path, call.agent);
  const lang = langOf(i.file_path);
  const edits = editHunks(call);
  const ats = edits.map((e) => e.at);
  const stats = edits.map((e) => diffStats(e.old_string, e.new_string));
  const { add, del } = LT.editStats(call);
  const mode = uiGet(`${call.id}:mode`, "unified");
  const wrap = uiGet(`${call.id}:wrap`, false);
  const bodies = edits.map((e, k) => {
    const at = ats[k] || 1;
    const label = edits.length > 1 ? html`<div class="ed-sub" style="background:#ffffff04">편집 ${k + 1}/${edits.length} · ${at}번째 줄 ${plusMinusHTML(stats[k].add, stats[k].del)}</div>` : "";
    return html`${label}${renderDiff(e.old_string, e.new_string, { lang, mode, wrap, startA: at, startB: e.bt ?? at, foldKey: `${call.id}:${k}`, openFolds: STATE.openFolds })}`;
  });
  return html`<div class="editor">
    <div class="ed-tabs">
      <div class="ed-tab on">${fileIcon(path)} ${baseName(path)} <span class="dirty" title="수정됨"></span></div>
      <div class="ed-right"><span class="chip mono">${lang}</span>${edits.length > 1 ? html`<span class="chip">편집 ${edits.length}건</span>` : html`<span>${ats[0]}번째 줄에서 수정</span>`}</div>
    </div>
    ${editToolbar(call, path, plusMinusHTML(add, del))}
    ${call.result?.err ? resultNote(call) : ""}
    <div class="ed-body">${bodies}</div>
  </div>`;
}

function renderWrite(call) {
  const i = call.input;
  const path = relPath(i.file_path, call.agent);
  const lang = langOf(i.file_path);
  const lines = i.content.split("\n");
  const wrap = uiGet(`${call.id}:wrap`, false);
  const file = DB.files.find((f) => f.agent === call.agent && f.abs === i.file_path);
  if (call.result?.extra?.type === "update" && call.result.extra.patch?.length) return renderEdit(call);
  return html`<div class="editor">
    <div class="ed-tabs">
      <div class="ed-tab on">${fileIcon(path)} ${baseName(path)}</div>
      <div class="ed-right"><span class="patch-op add">NEW</span><span class="chip mono">${lang}</span><span>${lines.length}줄 · ${fmtBytes(new Blob([i.content]).size)}</span></div>
    </div>
    <div class="ed-sub"><span class="path truncate">${path}</span><span class="grow"></span>${plusMinusHTML(lines.length, 0)}
      <button class="btn ghost sm" data-action="ui-toggle" data-key="${call.id}:wrap" aria-pressed="${wrap}">${icon("wrap", 13)} 줄바꿈</button>
      ${file ? html`<button class="btn sm" data-action="open-file" data-agent="${call.agent}" data-path="${file.path}">누적 변경 ${icon("arrow-right", 12)}</button>` : ""}
    </div>
    <div class="ed-body">${codeView(i.content, { lang, wrap, gutter: () => "g-add", scrollKey: `write-${call.id}` })}</div>
  </div>`;
}

// Codex patch: one editor block per file, hunks without line numbers (the patch has none).
function renderPatch(call) {
  if (call.input?.changes) return renderFileChanges(call);
  const files = patchFiles(call.input.patch ?? "");
  const mode = uiGet(`${call.id}:mode`, "unified");
  const wrap = uiGet(`${call.id}:wrap`, false);
  const blocks = files.map((f, fi) => {
    const lang = langOf(f.path);
    const add = f.lines.filter((l) => l[0] === "+").length;
    const del = f.lines.filter((l) => l[0] === "-").length;
    const op = { add: ["add", "ADD"], update: ["upd", "UPDATE"], delete: ["del", "DELETE"] }[f.op];
    let body;
    if (f.op === "add") {
      body = codeView(f.lines.map((l) => l.slice(1)).join("\n"), { lang, wrap, gutter: () => "g-add" });
    } else {
      const hunks = [];
      let cur = null;
      for (const l of f.lines) {
        if (l.startsWith("@@")) {
          cur = { head: l.replace(/^@@\s?/, ""), a: [], b: [] };
          hunks.push(cur);
          continue;
        }
        if (!cur) {
          cur = { head: "", a: [], b: [] };
          hunks.push(cur);
        }
        const text = l.slice(1);
        if (l[0] !== "+") cur.a.push(text);
        if (l[0] !== "-") cur.b.push(text);
      }
      body = hunks.map(
        (h, hi) =>
          html`${h.head ? html`<div class="ed-sub mono" style="font-size:12px;background:color-mix(in srgb, var(--accent) 6%, transparent);color:var(--accent)">@@ ${h.head}</div>` : hi ? html`<div class="ed-sub" style="padding:2px 14px">⋯</div>` : ""}${renderDiff(h.a.join("\n"), h.b.join("\n"), { lang, mode, wrap, fold: false, numbers: false, foldKey: `${call.id}:${fi}:${hi}` })}`,
      );
    }
    const file = DB.files.find((x) => x.agent === call.agent && x.path === f.path);
    return html`<div class="editor patch-file">
      <div class="ed-tabs"><div class="ed-tab on">${fileIcon(f.path)} ${f.path}</div>
        <div class="ed-right"><span class="patch-op ${op[0]}">${op[1]}</span>${plusMinusHTML(add, del)}
          ${file ? html`<button class="btn ghost sm" data-action="open-file" data-agent="${call.agent}" data-path="${file.path}">누적 ${icon("arrow-right", 12)}</button>` : ""}</div></div>
      <div class="ed-body">${body}</div>
    </div>`;
  });
  return html`<div class="row" style="margin-bottom:10px;justify-content:space-between">
      <span class="dim" style="font-size:var(--fs-xs)">Codex patch · 파일 ${files.length}개 · 줄 번호 없이 문맥으로 적용</span>
      <div class="row">
        <div class="seg" role="group" aria-label="diff 보기">
          <button data-action="ui-set" data-key="${call.id}:mode" data-value="unified" aria-pressed="${mode === "unified"}">${icon("rows", 12)} 한 줄</button>
          <button data-action="ui-set" data-key="${call.id}:mode" data-value="split" aria-pressed="${mode === "split"}">${icon("columns", 12)} 나란히</button>
        </div>

      </div>
    </div>${blocks}`;
}

// The edits of an Edit/MultiEdit call: the recorded hunks when the result has them (real line
// numbers), else the strings it asked to replace.
function editHunks(call) {
  const patch = call.result?.extra?.patch;
  if (Array.isArray(patch) && patch.length) {
    return patch.map((h) => ({
      old_string: h.lines.filter((l) => l[0] !== "+").map((l) => l.slice(1)).join("\n"),
      new_string: h.lines.filter((l) => l[0] !== "-").map((l) => l.slice(1)).join("\n"),
      at: h.oldStart,
      bt: h.newStart,
    }));
  }
  const i = call.input ?? {};
  return (i.edits ?? [{ old_string: i.old_string, new_string: i.new_string }]).map((e) => ({ old_string: e.old_string ?? "", new_string: e.new_string ?? "", at: 1, bt: 1 }));
}

// When a call has no result yet, or failed: say so plainly.
function resultNote(call) {
  if (!call.result) return html`<div class="err-card" style="border-color:var(--border)">${icon("hourglass", 15)}<div>${call.status === "pending" ? "승인을 기다리고 있어요" : "결과가 아직 없어요"}</div></div>`;
  if (!call.result.err) return "";
  return html`<div class="err-card">${icon("circle-x", 15)}<div><b>실패</b>${maskedText(call.result.text ?? "").slice(0, 1500)}</div></div>`;
}

// Codex FileChange: one editor block per file, unified hunks with real line numbers.
function renderFileChanges(call) {
  const mode = uiGet(`${call.id}:mode`, "unified");
  const wrap = uiGet(`${call.id}:wrap`, false);
  const blocks = Object.entries(call.input.changes).map(([path, change], fi) => {
    const lang = langOf(path);
    const hunks = LD.parseUnified(change.diff ?? "");
    const lines = hunks.flatMap((h) => h.lines);
    const add = lines.filter((l) => l[0] === "+").length;
    const del = lines.filter((l) => l[0] === "-").length;
    const op = { add: ["add", "ADD"], update: ["upd", "UPDATE"], delete: ["del", "DELETE"] }[change.type] ?? ["upd", "UPDATE"];
    const body = change.type === "add"
      ? codeView(lines.map((l) => l.slice(1)).join("\n"), { lang, wrap, gutter: () => "g-add" })
      : hunks.map((h, hi) => renderDiff(
        h.lines.filter((l) => l[0] !== "+").map((l) => l.slice(1)).join("\n"),
        h.lines.filter((l) => l[0] !== "-").map((l) => l.slice(1)).join("\n"),
        { lang, mode, wrap, startA: h.oldStart, startB: h.newStart, foldKey: `${call.id}:${fi}:${hi}`, openFolds: STATE.openFolds },
      ));
    const file = DB.files.find((x) => x.agent === call.agent && x.abs === path);
    const shown = relPath(path, call.agent);
    return html`<div class="editor patch-file">
      <div class="ed-tabs"><div class="ed-tab on">${fileIcon(shown)} ${shown}</div>
        <div class="ed-right"><span class="patch-op ${op[0]}">${op[1]}</span>${plusMinusHTML(add, del)}
          ${file ? html`<button class="btn ghost sm" data-action="open-file" data-agent="${call.agent}" data-path="${file.path}">누적 ${icon("arrow-right", 12)}</button>` : ""}</div></div>
      <div class="ed-body">${body}</div>
    </div>`;
  });
  return html`<div class="row" style="margin-bottom:10px;justify-content:space-between">
      <span class="dim" style="font-size:var(--fs-xs)">Codex 파일 변경 · ${Object.keys(call.input.changes).length}개</span>
      <div class="row">
        <div class="seg" role="group" aria-label="diff 보기">
          <button data-action="ui-set" data-key="${call.id}:mode" data-value="unified" aria-pressed="${mode === "unified"}">${icon("rows", 12)} 한 줄</button>
          <button data-action="ui-set" data-key="${call.id}:mode" data-value="split" aria-pressed="${mode === "split"}">${icon("columns", 12)} 나란히</button>
        </div>
        <button class="btn ghost sm" data-action="ui-toggle" data-key="${call.id}:wrap" aria-pressed="${wrap}">${icon("wrap", 13)} 줄바꿈</button>
      </div>
    </div>${call.result?.err ? resultNote(call) : ""}${blocks}`;
}

// Images are served by the server with the page's token, so they load through fetch.
const API_IMAGES = new Map();

function apiImage(agent, path) {
  const key = `${agent}|${path}`;
  const url = API_IMAGES.get(key);
  if (url) return raw(`<img class="img-real" src="${esc(url)}" alt="${esc(baseName(path))}">`);
  return raw(`<img class="img-real" data-api-image="${esc(key)}" alt="${esc(baseName(path))}">`);
}

// A picture attached to a prompt: read out of the session's transcript by the server.
function promptImage(agent, at, index) {
  const key = `${agent}|${at}|${index}`;
  const url = API_IMAGES.get(`p:${key}`);
  const alt = `첨부한 이미지 ${index + 1}`;
  if (url) return raw(`<img class="img-real pd-img" src="${esc(url)}" alt="${alt}">`);
  return raw(`<img class="img-real pd-img" data-api-pimg="${esc(key)}" alt="${alt}">`);
}

function hydratePromptImages() {
  for (const img of document.querySelectorAll("img[data-api-pimg]")) {
    const key = img.dataset.apiPimg;
    img.removeAttribute("data-api-pimg");
    const [agent, at, index] = key.split("|");
    api(`/api/prompt-image?agent=${encodeURIComponent(agent)}&at=${encodeURIComponent(at)}&i=${encodeURIComponent(index)}`)
      .then((r) => r.blob())
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        API_IMAGES.set(`p:${key}`, url);
        img.src = url;
      })
      .catch(() => {
        img.replaceWith(Object.assign(document.createElement("div"), { className: "dim", textContent: "이 이미지는 기록에서 찾을 수 없어요" }));
      });
  }
}

function hydrateImages() {
  hydratePromptImages();
  for (const img of document.querySelectorAll("img[data-api-image]")) {
    const key = img.dataset.apiImage;
    img.removeAttribute("data-api-image");
    const [agent, ...rest] = key.split("|");
    const path = rest.join("|");
    api(`/api/image?agent=${encodeURIComponent(agent)}&path=${encodeURIComponent(path)}`)
      .then((r) => r.blob())
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        API_IMAGES.set(key, url);
        img.src = url;
      })
      .catch(() => {
        img.replaceWith(Object.assign(document.createElement("div"), { className: "dim", textContent: "이미지 파일이 지금은 없어요 (임시 파일이었을 수 있어요)" }));
      });
  }
}

// Grep and Glob: a search field, its options as tags, results grouped by file.

// Paths -> nested folders; single-child folders merge ("src/hooks"), like VS Code's compact folders.
function buildTree(items, pathOf) {
  const root = { name: "", path: "", dirs: new Map(), files: [] };
  for (const item of items) {
    const parts = pathOf(item).split("/").filter(Boolean);
    let node = root;
    parts.slice(0, -1).forEach((part, idx) => {
      if (!node.dirs.has(part)) node.dirs.set(part, { name: part, path: parts.slice(0, idx + 1).join("/"), dirs: new Map(), files: [] });
      node = node.dirs.get(part);
    });
    node.files.push({ name: parts[parts.length - 1], item });
  }
  const compact = (node) => {
    const dirs = [...node.dirs.values()].map(compact);
    let out = { ...node, dirs };
    while (out.dirs.length === 1 && out.files.length === 0 && out.name) {
      const only = out.dirs[0];
      out = { ...only, name: `${out.name}/${only.name}` };
    }
    return out;
  };
  const top = compact(root);
  return { ...top, dirs: top.dirs.map((d) => d) };
}

function patternRegex(pattern, flags) {
  try {
    return new RegExp(pattern, flags);
  } catch {
    return null;
  }
}

function matchRanges(text, re) {
  if (!re) return [];
  const out = [];
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(text))) {
    if (!m[0].length) {
      re.lastIndex++;
      continue;
    }
    out.push([m.index, m.index + m[0].length]);
  }
  return out;
}

function searchCapsule(patternHTML, right, iconName = "search") {
  return html`<div class="search-cap">${icon(iconName, 16)}<div class="pat">${patternHTML}</div><div class="res">${right}</div></div>`;
}

// Real Grep results -> {mode, files: [{path, count, matches: [{line, text, ctx, gap}]}]}.
function grepResult(call) {
  const i = call.input ?? {};
  const x = call.result?.extra ?? {};
  const mode = x.mode ?? i.output_mode ?? "files_with_matches";
  const rel = (p) => relPath(p, call.agent);
  if (mode === "files_with_matches") return { mode, files: (x.filenames ?? []).map((p) => ({ path: rel(p), count: 0, matches: [] })) };
  const byPath = new Map();
  const fileOf = (p) => {
    if (!byPath.has(p)) byPath.set(p, { path: rel(p), count: 0, matches: [] });
    return byPath.get(p);
  };
  for (const raw of String(x.content ?? call.result?.text ?? "").split("\n")) {
    if (!raw) continue;
    if (mode === "count") {
      const m = /^(.*):(\d+)$/.exec(raw);
      if (m) fileOf(m[1]).count = Number(m[2]);
      continue;
    }
    if (raw === "--") {
      const last = [...byPath.values()].pop();
      if (last) last.matches.push({ gap: true });
      continue;
    }
    // "path:12:text" is a match, "path-12-text" context; a single-file search has no path.
    const m = /^(.+?)([:-])(\d+)\2(.*)$/.exec(raw) ?? /^()(?:)(\d+)[:-](.*)$/.exec(raw);
    if (!m) continue;
    const path = m[1] || i.path || "";
    const match = m.length === 5 ? { line: Number(m[3]), text: m[4], ctx: m[2] === "-" } : { line: Number(m[2]), text: m[3], ctx: false };
    const f = fileOf(path);
    f.matches.push(match);
    if (!match.ctx) f.count += 1;
  }
  return { mode, files: [...byPath.values()].slice(0, 60).map((f) => ({ ...f, matches: f.matches.slice(0, 80) })) };
}

function renderGrep(call) {
  const i = call.input;
  const r = grepResult(call);
  const re = patternRegex(i.pattern, i["-i"] ? "gi" : "g");
  const files = r.files || [];
  const hits = sum(files, (f) => f.matches.filter((m) => !m.ctx && !m.gap).length);
  const tagKeys = ["path", "glob", "type", "output_mode", "-i", "-n", "-C", "-A", "-B", "multiline", "head_limit"];
  const tags = tagKeys
    .filter((k) => i[k] !== undefined && i[k] !== false)
    .map((k) => html`<span class="tag"><i>${k}</i>${i[k] === true ? "" : k === "path" ? shortPath(i[k]) : String(i[k])}</span>`);
  const mode = r.mode || i.output_mode || "files_with_matches";
  let body;
  if (mode === "count") {
    const max = Math.max(...files.map((f) => f.count), 1);
    body = html`<div class="box" style="padding:8px 0">${files.map(
      (f) => html`<div class="countbar"><span class="mono truncate">${fileIcon(f.path)} ${f.path}</span><span class="bar" style="width:${(f.count / max) * 100}%"></span><span class="num dim">${f.count}</span></div>`,
    )}</div>`;
  } else if (mode === "files_with_matches") {
    body = html`<div class="box gtree">${files.map((f) => html`<div class="gn">${fileIcon(f.path)}<span>${baseName(f.path)}</span><span class="dim mono" style="font-size:12px">${dirName(f.path)}</span></div>`)}</div>`;
  } else {
    body = html`<div class="box">${files.map((f) => {
      const lang = langOf(f.path);
      const n = f.matches.filter((m) => !m.ctx && !m.gap).length;
      return html`<div class="mfile">
        <div class="mfile-h">${fileIcon(f.path)}<b>${baseName(f.path)}</b><span class="dir truncate">${dirName(f.path)}</span><span class="cnt">${n}</span></div>
        <div style="padding:4px 0 6px">${f.matches.map((m) => {
          if (m.gap) return raw(`<div class="mgap">⋯</div>`);
          const toks = tokenize(m.text, lang)[0] || [];
          const marks = m.ctx ? null : matchRanges(m.text, re);
          return raw(`<div class="mline ${m.ctx ? "ctx" : "match"}"><span class="ln">${m.line}</span><span class="tx">${lineHTML(toks, marks)}</span></div>`);
        })}</div>
      </div>`;
    })}</div>`;
  }
  return html`${searchCapsule(hlInline(i.pattern, "regex"), `${hits}개 일치 · 파일 ${files.length}개`)}
    <div class="tags">${tags}<span class="tag"><i>정규식</i>${i["-i"] ? "대소문자 무시" : "대소문자 구분"}</span></div>
    ${body}`;
}

function treeRows(node, depth, rowFor, dirRow) {
  const out = [];
  const dirs = [...node.dirs].sort((a, b) => a.name.localeCompare(b.name));
  for (const d of dirs) {
    out.push(dirRow(d, depth));
    out.push(...treeRows(d, depth + 1, rowFor, dirRow));
  }
  for (const f of node.files) out.push(rowFor(f, depth));
  return out;
}

function renderGlob(call) {
  const i = call.input;
  const x = call.result?.extra ?? {};
  const r = { files: (x.filenames ?? []).map((p) => relPath(p, call.agent)), truncated: !!x.truncated };
  const tree = buildTree(r.files, (p) => p);
  const indent = (d) => `padding-left:${8 + d * 16}px`;
  const rows = treeRows(
    tree,
    0,
    (f, d) => raw(`<div class="gn" style="${indent(d)}">${fileIcon(f.name).s}<span>${esc(f.name)}</span></div>`),
    (dir, d) => raw(`<div class="gn dir" style="${indent(d)}">${folderIcon(baseName(dir.name)).s}<span class="nm">${esc(dir.name)}</span></div>`),
  );
  return html`${searchCapsule(hlInline(i.pattern, "glob"), `파일 ${r.files.length}개`, "folder-search")}
    <div class="tags">${i.path ? html`<span class="tag"><i>path</i>${shortPath(i.path)}</span>` : ""}<span class="tag"><i>정렬</i>수정 시각 (최근 먼저)</span>${r.truncated ? html`<span class="tag" style="color:var(--working)">100개에서 잘림</span>` : ""}</div>
    <div class="box gtree">${rows}</div>`;
}

// WebFetch and WebSearch, drawn as a browser window.

function addressBar(url, running, right) {
  const u = parseUrl(url);
  const secure = u?.protocol === "https:";
  const host = u ? u.hostname : url;
  const rest = u ? `${u.pathname === "/" ? "" : u.pathname}${u.search}${u.hash}` : "";
  return html`<div class="br-bar">
    <div class="br-nav" aria-hidden="true">${icon("chevron-left", 16)}${icon("chevron-right", 16)}${icon("rotate", 14)}</div>
    <div class="addr" title="${url}">
      <span class="${secure ? "lock" : ""}" style="${secure ? "" : "color:var(--working)"}">${icon(secure ? "lock" : "alert", 13)}</span>
      <span class="host">${host}</span><span class="rest">${rest}</span>
    </div>
    ${right}
  </div>
  ${running ? raw('<div class="loadbar"></div>') : ""}`;
}

// Real WebFetch results -> {code, codeText, bytes, result, redirect}.
function fetchResult(call) {
  const x = call.result?.extra ?? {};
  const text = x.result ?? call.result?.text ?? "";
  const to = /Redirect URL:\s*(\S+)/i.exec(text)?.[1];
  const from = /Original URL:\s*(\S+)/i.exec(text)?.[1] ?? call.input?.url;
  return { code: x.code, codeText: x.codeText, bytes: x.bytes, result: to ? "" : text, redirect: to ? { from, to } : null };
}

// Claude nests {content: [{title, url}]}; Codex gives {title, url, snippet} directly.
function searchResult(call) {
  const results = [];
  const walk = (v) => {
    if (!v || typeof v !== "object") return;
    if (Array.isArray(v)) return v.forEach(walk);
    if (typeof v.url === "string" && v.title) results.push({ title: v.title, url: v.url, snippet: v.snippet ?? "" });
    else Object.values(v).forEach(walk);
  };
  const raw = call.result?.extra?.results;
  walk(raw);
  const summary = (Array.isArray(raw) ? raw.find((r) => typeof r === "string") : null) ?? (results.length ? "" : call.result?.text ?? "");
  return { results, summary };
}

function renderWebFetch(call) {
  const i = call.input;
  const r = fetchResult(call);
  const running = call.status === "running";
  const cls = r.code ? `s${String(r.code)[0]}` : "";
  const right = html`${r.code ? html`<span class="http ${cls}">${r.code} ${r.codeText || ""}</span>` : ""}<span class="dim" style="font-size:var(--fs-xs);white-space:nowrap">${r.bytes ? fmtBytes(r.bytes) : ""} · ${fmtDur(call.dur)}</span>`;
  const redirect = r.redirect
    ? html`<div class="redirect">${icon("arrow-up-right", 14)}<span>다른 호스트로 이동해서 따라가지 않았어요: <b class="mono">${hostOf(r.redirect.from)}</b> → <b class="mono">${hostOf(r.redirect.to)}</b>. 같은 주소로 다시 가져와야 해요.</span>
        ${(() => {
          const next = DB.calls.find((c) => c.agent === call.agent && c.name === "WebFetch" && c.input.url === r.redirect.to);
          return next ? html`<button class="btn sm" data-action="select-call" data-call="${next.id}">다음 호출 보기 ${icon("arrow-right", 12)}</button>` : "";
        })()}</div>`
    : "";
  return html`<div class="browser">
    <div class="br-tabs"><div class="br-tab">${fav(i.url, 14)}<span class="truncate">${r.title || hostOf(i.url)}</span></div></div>
    ${addressBar(i.url, running, right)}
    ${redirect}
    ${i.prompt ? html`<div class="br-prompt">${icon("message", 14)}<div><div class="lbl" style="margin-bottom:2px">이 페이지에 물은 것</div>${i.prompt}</div></div>` : ""}
    <div class="br-body">${r.result ? md(r.result) : running ? html`<div class="dim">페이지를 읽는 중…</div>` : r.redirect ? "" : html`<div class="dim">(본문 없음)</div>`}</div>
  </div>`;
}

function renderWebSearch(call) {
  const i = call.input;
  const r = searchResult(call);
  const filters = [
    ...(i.allowed_domains || []).map((d) => html`<span class="tag"><i>허용</i>${d}</span>`),
    ...(i.blocked_domains || []).map((d) => html`<span class="tag"><i>제외</i>${d}</span>`),
  ];
  return html`<div class="browser">
    <div class="br-tabs"><div class="br-tab">${icon("search", 13)}<span class="truncate">${i.query}</span></div></div>
    <div class="br-bar">
      <div class="addr" style="border-radius:10px">${icon("search", 14)}<span class="host" style="font-weight:500">${i.query}</span></div>
      <span class="dim" style="font-size:var(--fs-xs);white-space:nowrap">결과 ${(r.results || []).length}개 · ${fmtDur(call.dur)}</span>
    </div>
    ${filters.length ? html`<div class="tags" style="padding:0 18px">${filters}</div>` : ""}
    <div class="sr">${(r.results || []).map((res) => {
      const u = parseUrl(res.url);
      return html`<div class="sr-item">${fav(res.url, 24)}<div style="min-width:0">
        <div class="sr-url truncate"><span class="d">${u ? u.hostname.replace(/^www\./, "") : ""}</span><span>${u ? u.pathname.replace(/\/$/, "") : ""}</span></div>
        <a class="sr-title" href="${res.url}" target="_blank" rel="noopener noreferrer">${res.title}</a>
        ${res.snippet ? html`<div class="sr-snip">${res.snippet}</div>` : ""}
      </div></div>`;
    })}</div>
    ${r.summary ? html`<div class="br-body" style="border-top:1px solid var(--border)"><div class="lbl" style="margin-bottom:6px">모델이 정리한 답</div>${md(r.summary)}</div>` : ""}
  </div>`;
}

const TODO_GLYPH = { completed: "●", in_progress: "◐", pending: "○" };

function todoIcon(status) {
  if (status === "completed") return raw(`<span style="color:var(--accent);display:inline-flex">${icon("circle-check", 16).s}</span>`);
  if (status === "in_progress") return raw(`<span style="color:var(--working);display:inline-flex">${icon("circle-half", 16).s}</span>`);
  return raw(`<span style="color:var(--dim);display:inline-flex">${icon("circle", 16).s}</span>`);
}

function renderTodo(call) {
  const isPlan = call.name === "update_plan";
  const items = isPlan ? call.input.plan.map((p) => ({ content: p.step, status: p.status })) : call.input.todos;
  const old = call.result?.extra?.old ?? previousItems(call) ?? [];
  const done = items.filter((t) => t.status === "completed").length;
  const doing = items.filter((t) => t.status === "in_progress").length;
  const owner = agentById(call.agent)?.app === "codex" ? "@codex" : "@claude";
  return html`${isPlan && call.input.explanation ? html`<div class="br-prompt" style="margin:0 0 14px">${icon("info", 14)}<div>${call.input.explanation}</div></div>` : ""}
  <div class="todo-prog">
    <b style="font-size:var(--fs-md)">${isPlan ? "계획" : "할 일"}</b>
    <div class="todo-bar" role="img" aria-label="${items.length}개 중 ${done}개 완료">
      <i class="c" style="width:${(done / items.length) * 100}%"></i><i class="p" style="width:${(doing / items.length) * 100}%"></i>
    </div>
    <span class="num muted">${done}/${items.length}</span>
  </div>
  <div class="box" style="padding:6px">${items.map((t, k) => {
    const prev = old.find((o) => o.content === t.content);
    const changed = prev && prev.status !== t.status;
    const fresh = old.length && !prev;
    return html`<div class="todo-item ${t.status} ${changed || fresh ? "changed" : ""}">
      <span class="ic">${todoIcon(t.status)}</span>
      <span class="no">#${k + 1}</span>
      <span class="tx">${t.content}${t.status === "in_progress" && t.activeForm ? html`<span class="af">${t.activeForm}…</span>` : ""}</span>
      <span class="row" style="gap:6px;justify-content:flex-end">
        ${changed ? html`<span class="trans" title="이번 호출에서 바뀜">${TODO_GLYPH[prev.status]} → ${TODO_GLYPH[t.status]}</span>` : ""}
        ${fresh ? html`<span class="trans new">새 항목</span>` : ""}
        ${t.blockedBy ? html`<span class="blockedby">#${t.blockedBy} 기다림</span>` : ""}
        ${t.status === "in_progress" ? html`<span class="owner">${owner}</span>` : ""}
      </span>
    </div>`;
  })}</div>
  ${old.length ? html`<div class="dim" style="font-size:var(--fs-xs);margin-top:8px">왼쪽 선은 이번 호출에서 바뀐 항목이에요. 이전 상태: ${old.map((o) => TODO_GLYPH[o.status]).join(" ")}</div>` : ""}`;
}

function renderAsk(call) {
  // Codex asks with request_user_input ({title, options: [text]}); its answer comes back as a prompt.
  const qs = (call.input.questions || []).map((q) => ({
    header: q.header ?? "질문",
    question: q.question ?? q.title ?? "",
    multiSelect: !!q.multiSelect,
    options: (q.options ?? []).map((o) => (typeof o === "string" ? { label: o } : o)),
  }));
  const answers = call.result?.extra?.answers ?? codexAnswers(call);
  const pending = call.status === "pending" || call.status === "running";
  return html`${qs.map((q) => {
    const ans = answers[q.header] ?? answers[q.question];
    const picked = ans ? (q.multiSelect ? ans.split(", ") : [ans]) : [];
    const typed = ans && !q.options.some((o) => picked.includes(o.label));
    const previewOpt = q.options.find((o) => o.preview && picked.includes(o.label)) || q.options.find((o) => o.preview);
    return html`<div class="ask">
      <div class="row"><span class="ask-head">${q.header}</span>${q.multiSelect ? html`<span class="chip">여러 개 선택</span>` : ""}${pending ? html`<span class="pill blocked">대답 기다리는 중</span>` : ""}</div>
      <div class="ask-q">${q.question}</div>
      <div class="ask-body ${previewOpt ? "with-preview" : ""}">
        <div>${q.options.map((o, k) => {
          const on = picked.includes(o.label);
          return html`<div class="opt ${on ? "on" : ""} ${q.multiSelect ? "multi" : ""}">
            <span class="rd" aria-hidden="true"></span>
            <div><div class="lb">${o.label}</div>${o.description ? html`<div class="ds">${o.description}</div>` : ""}</div>
            ${on ? html`<span class="picked">${icon("check", 12)} 선택</span>` : html`<span class="kbd">${k + 1}</span>`}
          </div>`;
        })}</div>
        ${previewOpt ? html`<div><div class="lbl" style="margin-bottom:6px">미리보기 · ${previewOpt.label}</div><div class="ask-preview">${previewOpt.preview}</div></div>` : ""}
      </div>
      ${typed ? html`<div class="ask-typed">${icon("pen", 13)} 직접 입력한 답: <b style="color:var(--foreground)">${ans}</b></div>` : ""}
      ${call.result?.extra?.annotations?.[q.question]?.notes ? html`<div class="ask-typed">${icon("message", 13)} 메모: ${call.result.extra.annotations[q.question].notes}</div>` : ""}
    </div>`;
  })}
  ${pending ? html`<div class="perm-foot">${icon("info", 13)} 답은 에이전트의 터미널에서 해요. <button class="btn sm" data-action="boundary" data-cmd="herdr-app do agent.focus --terminal ${call.agent}">herdr에서 열기 ${icon("arrow-up-right", 12)}</button></div>` : ""}`;
}

function renderPlan(call) {
  const r = { approved: !!call.result && !call.result.err, feedback: call.result?.err ? call.result.text : "" };
  const status = call.status === "pending" ? html`<span class="pill blocked">승인 기다리는 중</span>` : r.approved ? html`<span class="pill ok">${icon("check", 12)} 승인됨</span>` : html`<span class="pill err">거절됨</span>`;
  return html`<div class="plan">
    <div class="plan-h">${icon("map", 15)} <b style="color:var(--foreground)">계획 모드 종료 요청</b> ${status}
      ${r.mode ? html`<span class="chip">${r.mode === "auto" ? "자동 수락으로 진행" : "편집마다 확인"}</span>` : ""}
      <span class="grow"></span>
      <button class="btn ghost sm" data-action="copy" data-copy="${call.input.plan}">${icon("copy", 12)} 계획 복사</button>
    </div>
    <div class="plan-b">${md(call.input.plan)}</div>
    ${r.feedback ? html`<div class="ask-typed" style="margin:0 16px 16px">${icon("message", 13)} 피드백: ${r.feedback}</div>` : ""}
  </div>`;
}

function renderSkill(call) {
  const i = call.input;
  const x = call.result?.extra ?? {};
  const r = { source: x.commandName ? `/${x.commandName}` : "", description: x.success === false ? "스킬을 불러오지 못했어요" : "스킬 지침을 불러왔어요", routed: null, allowedTools: [] };
  return html`<div class="skill">
    <div class="skill-ic">${icon("sparkles", 26)}</div>
    <div style="min-width:0">
      <div class="row"><h3>${i.skill}</h3>${r.routed ? html`<span class="chip">${icon("arrow-right", 11)} ${r.routed}로 넘김</span>` : ""}</div>
      <div class="dim" style="font-size:var(--fs-xs);margin-top:2px">${r.source}</div>
      <div class="desc">${r.description}</div>
      ${i.args ? html`<div class="args"><span class="dim">args </span>${i.args}</div>` : ""}
      ${r.allowedTools?.length ? html`<div class="chips" style="margin-top:10px">${r.allowedTools.map((t) => html`<span class="chip mono">${t}</span>`)}</div>` : ""}
    </div>
  </div>`;
}

// The list the previous TodoWrite/update_plan call left, for "what changed this time".
function previousItems(call) {
  const prev = [...callsOf(call.agent)].reverse().find((c) => c.name === call.name && c.ts < call.ts);
  if (!prev) return null;
  return prev.name === "update_plan" ? (prev.input.plan ?? []).map((p) => ({ content: p.step, status: p.status })) : prev.input.todos ?? [];
}

function codexAnswers(call) {
  const reply = promptsOf(call.agent).find((p) => p.ts >= call.ts && p.kind === "answer");
  if (!reply) return {};
  try {
    const list = JSON.parse(reply.text.replace(/^<send_user_message_question_reply>\s*/, "").replace(/<\/send_user_message_question_reply>\s*$/, ""));
    return Object.fromEntries(list.map((a) => [a.question, a.answer]));
  } catch {
    return {};
  }
}

/* ---- src/js/tools/mongo.js ---- */
// MongoDB MCP calls, the way Compass shows them: namespace, query bar, documents
// (List / JSON / Table), pipelines, write diffs, schema, indexes and explain plans.

// ---------- BSON values from Extended JSON ----------
const isEjson = (v) => v && typeof v === "object" && !Array.isArray(v) && ("$oid" in v || "$date" in v || "$numberLong" in v || "$numberDecimal" in v);

function bsonType(v) {
  if (v === null) return "Null";
  if (Array.isArray(v)) return "Array";
  if (typeof v === "string") return "String";
  if (typeof v === "boolean") return "Boolean";
  if (typeof v === "number") return Number.isInteger(v) ? "Int32" : "Double";
  if (v.$oid) return "ObjectId";
  if (v.$date) return "Date";
  if (v.$numberLong) return "Int64";
  if (v.$numberDecimal) return "Decimal128";
  return "Object";
}

const isoPlus = (d) => d.replace(/Z$/, "+00:00");

function bsonText(v) {
  switch (bsonType(v)) {
    case "Null":
      return { cls: "bv-null", text: "null" };
    case "String":
      return { cls: "bv-str", text: JSON.stringify(v) };
    case "Boolean":
      return { cls: "bv-bool", text: String(v) };
    case "Int32":
    case "Double":
      return { cls: "bv-num", text: String(v) };
    case "ObjectId":
      return { cls: "bv-oid", text: `ObjectId('${v.$oid}')` };
    case "Date":
      return { cls: "bv-date", text: isoPlus(v.$date) };
    case "Int64":
      return { cls: "bv-wrap", text: `Long('${v.$numberLong}')` };
    case "Decimal128":
      return { cls: "bv-wrap", text: `Decimal128('${v.$numberDecimal}')` };
    default:
      return null;
  }
}

const valueSpan = (v) => {
  const t = bsonText(v);
  return t ? `<span class="${t.cls}">${esc(t.text)}</span>` : "";
};

// mongosh-style text for queries and pipeline stages.
function shellJS(v, indent = 0) {
  const pad = "  ".repeat(indent);
  const key = (k) => (/^[A-Za-z_$][\w$]*$/.test(k) ? k : `'${k}'`);
  if (v === null) return "null";
  if (typeof v === "string") return `'${v.replace(/'/g, "\\'")}'`;
  if (typeof v !== "object") return String(v);
  if (v.$oid) return `ObjectId('${v.$oid}')`;
  if (v.$date) return `ISODate('${v.$date}')`;
  if (v.$numberLong) return `Long('${v.$numberLong}')`;
  if (v.$numberDecimal) return `Decimal128('${v.$numberDecimal}')`;
  const entries = Array.isArray(v) ? v.map((x) => shellJS(x, indent + 1)) : Object.entries(v).map(([k, x]) => `${key(k)}: ${shellJS(x, indent + 1)}`);
  const open = Array.isArray(v) ? "[" : "{";
  const close = Array.isArray(v) ? "]" : "}";
  if (!entries.length) return `${open}${close}`;
  const inline = `${open} ${entries.join(", ")} ${close}`;
  if (inline.length <= 72 && !inline.includes("\n")) return inline;
  return `${open}\n${entries.map((e) => `${pad}  ${e}`).join(",\n")}\n${pad}${close}`;
}

const queryHTML = (v) => hlInline(shellJS(v), "mongo");

// ---------- Document card (List view) ----------
function fieldRows(obj, prefix, depth, extraCls = () => "") {
  const entries = Array.isArray(obj) ? obj.map((v, i) => [String(i), v]) : Object.entries(obj);
  return entries
    .map(([k, v]) => {
      const path = `${prefix}.${k}`;
      const nested = v && typeof v === "object" && !isEjson(v);
      const cls = extraCls(k);
      if (!nested) return `<div class="f ${cls}"><span class="tg"></span><span class="fk">${esc(k)}</span><span class="colon">:</span>${valueSpan(v)}</div>`;
      const open = STATE.openFolds.has(path);
      const count = Array.isArray(v) ? v.length : Object.keys(v).length;
      const label = `${Array.isArray(v) ? "Array" : "Object"} (${count})`;
      return `<div class="f ${cls}"><button class="tg" data-action="unfold" data-fold="${esc(path)}" aria-expanded="${open}" aria-label="${esc(k)} 펼치기">${icon(open ? "chevron-down" : "chevron-right", 12).s}</button><span class="fk">${esc(k)}</span><span class="colon">:</span><span class="ty">${label}</span></div>${open ? `<div class="kids">${fieldRows(v, path, depth + 1)}</div>` : ""}`;
    })
    .join("");
}

function docCard(doc, key, cls = "", header = "") {
  return `<div class="doc ${cls}">${header}<div class="doc-acts"><button class="btn sm icon" data-action="copy" data-copy="${esc(JSON.stringify(doc, null, 2))}" title="문서 복사(EJSON)" aria-label="문서 복사">${icon("copy", 13).s}</button></div>${fieldRows(doc, key, 0)}</div>`;
}

// ---------- Table view ----------
function tableView(docs, key) {
  const cols = [];
  for (const d of docs) for (const [k, v] of Object.entries(d)) if (!cols.some((c) => c.k === k)) cols.push({ k, t: bsonType(v) });
  const cell = (v) => {
    if (v === undefined) return '<span class="bv-null">—</span>';
    if (v && typeof v === "object" && !isEjson(v)) {
      const n = Array.isArray(v) ? v.length : Object.keys(v).length;
      return `<span class="nest">${Array.isArray(v) ? "[ ]" : "{ }"} ${n} ${Array.isArray(v) ? "elements" : "fields"}</span>`;
    }
    return valueSpan(v);
  };
  return raw(`<div class="cp-table-wrap" data-keep-scroll="table-${esc(key)}"><table class="cp-table"><thead><tr><th>#</th>${cols.map((c) => `<th>${esc(c.k)}<small>${c.t}</small></th>`).join("")}</tr></thead><tbody>${docs
    .map((d, i) => `<tr><td class="rn">${i + 1}</td>${cols.map((c) => `<td>${cell(d[c.k])}</td>`).join("")}</tr>`)
    .join("")}</tbody></table></div>`);
}

function jsonView(docs) {
  return raw(`<div class="box"><pre class="code" style="padding:12px 16px;max-height:560px;white-space:pre">${hl(JSON.stringify(docs, null, 2), "json").join("\n")}</pre></div>`);
}

function docsSection(call, docs, { title = "Documents", total = null, cls = "", header = null } = {}) {
  const view = uiGet(`${call.id}:docview`, "list");
  const range = docs.length ? `1 – ${docs.length} of ${fmtInt(total ?? docs.length)}` : "0";
  const body =
    view === "json"
      ? jsonView(docs)
      : view === "table"
        ? tableView(docs, call.id)
        : raw(`<div class="docs">${docs.map((d, i) => docCard(d, `${call.id}:${i}`, cls, header ? header(d, i) : "")).join("")}</div>`);
  return html`<div class="cp-bar">
      <h4>${title}</h4><span class="rng">${range}</span><span class="grow"></span>
      <button class="btn ghost sm" data-action="copy" data-copy="${JSON.stringify(docs, null, 2)}">${icon("copy", 13)} 전부 복사</button>
      <div class="seg" role="group" aria-label="문서 보기">
        <button data-action="ui-set" data-key="${call.id}:docview" data-value="list" aria-pressed="${view === "list"}">${icon("list", 12)} List</button>
        <button data-action="ui-set" data-key="${call.id}:docview" data-value="json" aria-pressed="${view === "json"}">${icon("braces", 12)} JSON</button>
        <button data-action="ui-set" data-key="${call.id}:docview" data-value="table" aria-pressed="${view === "table"}">${icon("table", 12)} Table</button>
      </div>
    </div>
    ${body}`;
}

// ---------- Write diffs ----------
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function diffEntries(before, after) {
  const keys = Array.isArray(after) || Array.isArray(before) ? [...Array(Math.max((before || []).length, (after || []).length)).keys()].map(String) : uniq([...Object.keys(after || {}), ...Object.keys(before || {})]);
  return keys.map((k) => {
    const hasA = before && k in before;
    const hasB = after && k in after;
    const a = hasA ? before[k] : undefined;
    const b = hasB ? after[k] : undefined;
    if (!hasB) return { k, t: "del", v: a };
    if (!hasA) return { k, t: "add", v: b };
    const nested = a && b && typeof a === "object" && typeof b === "object" && !isEjson(a) && !isEjson(b);
    if (nested) {
      const kids = diffEntries(a, b);
      return { k, t: kids.some((x) => x.t !== "same") ? "obj" : "same", v: b, kids, isArr: Array.isArray(b) };
    }
    return same(a, b) ? { k, t: "same", v: b } : { k, t: "mod", a, b };
  });
}

function countChanges(entries) {
  return entries.reduce(
    (acc, e) => {
      if (e.t === "mod") acc.m++;
      if (e.t === "add") acc.a++;
      if (e.t === "del") acc.d++;
      if (e.t === "obj") {
        const c = countChanges(e.kids);
        acc.m += c.m;
        acc.a += c.a;
        acc.d += c.d;
      }
      return acc;
    },
    { m: 0, a: 0, d: 0 },
  );
}

function diffRowsHTML(entries, prefix) {
  return entries
    .map((e) => {
      const path = `${prefix}.${e.k}`;
      const head = `<span class="tg"></span><span class="fk">${esc(e.k)}</span><span class="colon">:</span>`;
      const short = (v) => (v && typeof v === "object" && !isEjson(v) ? `<span class="ty">${Array.isArray(v) ? `Array (${v.length})` : `Object (${Object.keys(v).length})`}</span>` : valueSpan(v));
      if (e.t === "mod") return `<div class="f">${head}<span class="v-old">${esc(bsonText(e.a)?.text ?? "")}</span><span class="v-new">${esc(bsonText(e.b)?.text ?? "")}</span></div>`;
      if (e.t === "add") return `<div class="f f-add">${head}${short(e.v)}</div>`;
      if (e.t === "del") return `<div class="f f-del">${head}${short(e.v)}</div>`;
      if (e.t === "obj") {
        const closed = STATE.openFolds.has(`x:${path}`);
        return `<div class="f"><button class="tg" data-action="unfold" data-fold="x:${esc(path)}" aria-expanded="${!closed}">${icon(closed ? "chevron-right" : "chevron-down", 12).s}</button><span class="fk">${esc(e.k)}</span><span class="colon">:</span><span class="ty">${e.isArr ? "Array" : "Object"}</span></div>${closed ? "" : `<div class="kids">${diffRowsHTML(e.kids, path)}</div>`}`;
      }
      if (e.v && typeof e.v === "object" && !isEjson(e.v)) return fieldRows({ [e.k]: e.v }, prefix, 0);
      return `<div class="f">${head}${valueSpan(e.v)}</div>`;
    })
    .join("");
}

// ---------- Pieces ----------
function cpHeader(call, ns) {
  const p = mcpParts(call.name);
  const op = LT.mongoOp(p.tool);
  const a = agentById(call.agent);

    <div style="min-width:0">
      <div class="cp-crumbs">${ns.map((part, k) => html`${k ? html`<span class="sep">›</span>` : ""}${k === ns.length - 1 ? html`<b>${part}</b>` : html`<span>${part}</span>`}`)}</div>
      <div class="cp-badges">
        <span class="opb ${op}">${op.toUpperCase()}</span>
        <span class="opname">${p.tool}</span>
        <span class="chip">${logo(a?.app || "claude", 14)} ${a?.app === "codex" ? "Codex" : "Claude Code"}</span>
      </div>
    </div>
    ${stageMeta(call)}
  </div>`;
}

function queryBar(rows) {
  return html`<div class="cp-query">${rows.map(([label, value, opts]) =>
    opts
      ? html`<span></span><div class="qopts">${opts.map(([k, v]) => html`<span class="qopt">${k} <code>${v}</code></span>`)}</div>`
      : html`<span class="ql">${label}</span><div class="qfield">${value}</div>`,
  )}</div>`;
}

function findOpts(i) {
  const opts = [];
  if (i.projection) opts.push(["Project", queryHTML(i.projection)]);
  if (i.sort) opts.push(["Sort", queryHTML(i.sort)]);
  if (i.limit != null) opts.push(["Limit", raw(`<span class="tk-num">${i.limit}</span>`)]);
  if (i.skip != null) opts.push(["Skip", raw(`<span class="tk-num">${i.skip}</span>`)]);
  return opts;
}

function pipelineHTML(pipeline) {
  return html`<div class="cp-bar"><h4>Pipeline</h4><span class="rng">${pipeline.length} stages</span></div>
    <div class="pipe">${pipeline.map((stage, k) => {
      const [op, body] = Object.entries(stage)[0];
      return html`${k ? html`<div class="pjoin">${icon("chevron-down", 12)}</div>` : ""}<div class="pstage">
        <div class="pstage-h">Stage ${k + 1} <code>${op}</code></div>
        <div class="pstage-b">${queryHTML(body)}</div>
      </div>`;
    })}</div>`;
