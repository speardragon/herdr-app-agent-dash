function statCards(cards) {
  return html`<div class="cp-stats">${cards.map(([k, v, cls]) => html`<div class="cp-stat ${cls || ""}"><div class="k">${k}</div><div class="v">${fmtInt(v)}</div></div>`)}</div>`;
}

// ---------- Per tool (real MCP results, read with the mod's lib/mongo.js) ----------

const MONGO_MEMO = new WeakMap();

function mongoResult(call) {
  if (!MONGO_MEMO.has(call)) MONGO_MEMO.set(call, LM.readResult(call.result?.text ?? ""));
  return MONGO_MEMO.get(call);
}

function mongoError(call) {
  if (!call.result?.err) return "";
  const text = maskedText(call.result.text ?? "");
  const colon = text.indexOf(":");
  return html`<div class="err-card">${icon("circle-x", 15)}<div><b>${colon > 0 ? text.slice(0, colon) : "실패"}</b>${colon > 0 ? text.slice(colon) : text}</div></div>`;
}

function mongoPending(call) {
  if (call.result) return "";
  return html`<div class="xwarn">${icon("info", 16)}<div>${call.status === "pending" ? "실행 승인을 기다리고 있어요." : "아직 결과가 없어요."}</div></div>`;
}

const countIn = (text, re) => {
  const m = re.exec(text ?? "");
  return m ? Number(m[1].replace(/,/g, "")) : null;
};

// The explain tree, flattened top (output) to bottom (reads) for the stage list.
function explainStages(node, out = []) {
  if (!node) return out;
  out.push({ stage: node.stage, note: node.index ? `index ${node.index}` : "", ms: node.ms ?? "–", nReturned: node.returned ?? 0, docsExamined: node.examined, filter: node.filter ? LM.shellJS(node.filter, 0, 9999) : null });
  for (const kid of node.kids) explainStages(kid, out);
  return out;
}

const MONGO_RENDER = {
  find(call) {
    const i = call.input;
    const r = mongoResult(call);
    return html`${queryBar([["Filter", queryHTML(i.filter || {})], ...(findOpts(i).length ? [[null, null, findOpts(i)]] : [])])}${mongoError(call) || mongoPending(call) || docsSection(call, r.docs, { total: r.total ?? r.docs.length })}`;
  },
  aggregate(call) {
    const r = mongoResult(call);
    return html`${pipelineHTML(call.input.pipeline || [])}${mongoError(call) || mongoPending(call) || docsSection(call, r.docs, { title: "Results", total: r.total ?? r.docs.length })}`;
  },
  count(call) {
    const r = mongoResult(call);
    const n = r.data?.count ?? countIn(r.summary, /(\d[\d,]*)/);
    return html`${queryBar([["Filter", queryHTML(call.input.query || call.input.filter || {})]])}${mongoError(call) || mongoPending(call) || html`<div class="cnt-big"><b>${n == null ? "?" : fmtInt(n)}</b><span>documents · <span class="mono">${call.input.collection}</span></span></div>`}`;
  },
  explain(call) {
    const r = mongoResult(call);
    const plan = LM.readExplain(r.data ?? (r.docs.length === 1 ? r.docs[0] : null));
    const m = call.input.method?.[0]?.arguments ?? call.input;
    const bar = queryBar([["Filter", queryHTML(m.filter || {})], ...(m.sort ? [[null, null, [["Sort", queryHTML(m.sort)]]]] : [])]);
    if (mongoError(call) || !call.result) return html`${bar}${mongoError(call) || mongoPending(call)}`;
    if (!plan) return html`${bar}${genericBody(call)}`;
    const stages = explainStages(plan.tree);
    const st = plan.stats ?? {};
    const ratio = st.returned ? Math.round((st.docs ?? 0) / st.returned) : 0;
    return html`${bar}
      ${plan.stats ? html`<div class="xsum">
        <div class="cp-stat"><div class="k">실행 시간</div><div class="v">${st.ms ?? "–"}<small style="font-size:13px"> ms</small></div></div>
        <div class="cp-stat"><div class="k">반환한 문서</div><div class="v">${fmtInt(st.returned ?? 0)}</div></div>
        <div class="cp-stat"><div class="k">검사한 문서</div><div class="v" style="${plan.collscan ? "color:var(--working)" : ""}">${fmtInt(st.docs ?? 0)}</div></div>
        <div class="cp-stat"><div class="k">검사한 인덱스 키</div><div class="v">${fmtInt(st.keys ?? 0)}</div></div>
      </div>` : ""}
      ${plan.collscan ? html`<div class="xwarn">${icon("alert", 16)}<div><b>인덱스 없이 컬렉션 전체를 훑었어요.</b>${ratio ? ` 문서 ${ratio}개를 봐야 1개를 돌려줘요.` : ""}</div></div>` : ""}
      <div class="cp-bar"><h4>Explain Plan</h4><span class="rng">위에서 아래로: 결과를 내는 단계 ← 데이터를 읽는 단계</span></div>
      <div class="xtree">${stages.map(
        (s, k) => html`${k ? raw('<div class="xedge"></div>') : ""}<div class="xnode ${s.stage === "COLLSCAN" || s.stage === "SORT" ? "bad" : ""}">
          <div class="xnode-h"><b>${s.stage}</b><span class="dim" style="font-size:var(--fs-xs)">${s.note}</span><span class="t">${s.ms} ms</span></div>
          <div class="xm"><span>반환 <b>${fmtInt(s.nReturned)}</b></span>${s.docsExamined != null ? html`<span>검사 <b>${fmtInt(s.docsExamined)}</b></span>` : ""}</div>
          ${s.filter ? html`<div class="mono dim" style="font-size:12px;margin-top:6px;white-space:normal">filter ${s.filter}</div>` : ""}
        </div>`,
      )}</div>`;
  },
  "insert-many"(call) {
    const docs = call.input.documents || [];
    const n = countIn(call.result?.text, /Inserted\D{0,20}(\d[\d,]*)/i) ?? docs.length;
    return html`${mongoError(call) || mongoPending(call) || statCards([["INSERTED", n, "ins"]])}${docsSection(call, docs, { title: "Inserted", cls: "inserted", header: () => `<div class="doc-h"><span class="chg ins">INSERTED</span></div>` })}`;
  },
  "update-many"(call) {
    const i = call.input;
    const text = call.result?.text ?? "";
    const q = queryBar([
      ["Filter", queryHTML(i.filter || {})],
      ["Update", queryHTML(i.update || {})],
    ]);
    if (mongoError(call) || !call.result) return html`${q}${mongoError(call) || mongoPending(call)}`;
    return html`${statCards([
      ["MATCHED", countIn(text, /Matched (\d[\d,]*)/i) ?? 0],
      ["MODIFIED", countIn(text, /Modified (\d[\d,]*)/i) ?? 0],
      ["UPSERTED", countIn(text, /Upserted\D{0,20}(\d[\d,]*)/i) ?? 0],
    ])}${q}
      <div class="xwarn">${icon("info", 16)}<div>대화 기록에는 바뀌기 전 문서가 남지 않아서, 문서별 비교 없이 개수만 보여줘요.</div></div>`;
  },
  "delete-many"(call) {
    const n = countIn(call.result?.text, /Deleted (\d[\d,]*)/i) ?? countIn(call.result?.text, /(\d[\d,]*) documents?/i) ?? 0;
    return html`${mongoError(call) || mongoPending(call) || statCards([["DELETED", n, "del"]])}${queryBar([["Filter", queryHTML(call.input.filter || {})]])}`;
  },
  "list-databases"(call) {
    const r = mongoResult(call);
    const dbs = (r.docs.length ? r.docs : r.data?.databases ?? []).map((d) => ({ name: d.name, size: Number(d.sizeOnDisk?.$numberLong ?? d.sizeOnDisk ?? d.size ?? 0) }));
    if (!dbs.length) return mongoError(call) || genericBody(call);
    const max = Math.max(...dbs.map((d) => d.size), 1);
    return html`<div class="cp-bar"><h4>Databases</h4><span class="rng">${dbs.length}개</span></div>
      <div class="box">${dbs.map(
        (d) => html`<div class="dbrow"><span style="color:var(--k-mongo)">${icon("database", 16)}</span><span class="nm">${d.name}</span><div class="meter"><i style="width:${(d.size / max) * 100}%;background:var(--k-mongo)"></i></div><span class="sz">${d.size ? fmtBytes(d.size) : ""}</span></div>`,
      )}</div>`;
  },
  "list-collections"(call) {
    const r = mongoResult(call);
    const cols = (r.docs.length ? r.docs : r.data?.collections ?? []).map((c) => (typeof c === "string" ? c : c.name)).filter(Boolean);
    if (!cols.length) return mongoError(call) || genericBody(call);
    return html`<div class="cp-bar"><h4>Collections</h4><span class="rng">${cols.length}개 · <span class="mono">${call.input.database}</span></span></div>
      <div class="box">${cols.map((c) => html`<div class="dbrow" style="grid-template-columns:22px minmax(0,1fr)"><span class="dim">${icon("folder", 15)}</span><span class="nm">${c}</span></div>`)}</div>`;
  },
};

function renderMongo(call) {
  const p = mcpParts(call.name);
  const i = call.input || {};
  const ns = [p.server, i.database, i.collection].filter(Boolean);
  const body = MONGO_RENDER[p.tool] ? MONGO_RENDER[p.tool](call) : html`${mongoError(call)}${genericBody(call)}`;
  return html`<div class="cp">${cpHeader(call, ns)}${body}</div>`;
}

/* ---- src/js/tools/product.js ---- */
// Jira, Notion and Slack calls drawn the way those sites look (their light themes, with the
// colors and sizes read from the live pages). Parsing is the mod's lib/ (jira, notion, slack,
// sx_rich); this file turns the parsed views into HTML. css/sites.css holds the looks.

const SITE_MEMO = new WeakMap();
const SITE_PARSERS = [
  ["jira", (call) => LJ.parseJira(call)], ["notion", (call) => LN.parseNotion(call)], ["slack", (call) => LSK.parseSlack(call)],
  ["gmail", (call) => LGM.parseGmail(call)], ["gcal", (call) => LGC.parseGcal(call)], ["gsheets", (call) => LGS.parseGsheets(call)],
];
const SITE_DRAW = {
  jira: (view) => sx_jiraView(view), notion: (view) => sx_notionView(view), slack: (view) => sx_slackView(view),
  gmail: (view) => sx_gmailView(view), gcal: (view) => sx_gcalView(view), gsheets: (view) => sx_gsheetsView(view),
};

function sitePrepared(call) {
  const key = Boolean(call.result);
  const hit = SITE_MEMO.get(call);
  if (hit && hit.key === key) return hit.value;
  let value = null;
  try {
    // The first product that reads the call draws it.
    for (const [site, parse] of SITE_PARSERS) {
      const view = parse(call);
      if (view) {
        value = { site, view };
        break;
      }
    }
  } catch {
    value = null;
  }
  SITE_MEMO.set(call, { key, value });
  return value;
}

// ---------- sx_rich text ----------

const sx_safeUrl = (url) => (/^https?:\/\//i.test(url ?? "") ? url : "");

function sx_runsHTML(runs) {
  return runs.map((r) => {
    let out = esc(r.text).replace(/\n/g, "<br>");
    if (r.code) out = `<code>${out}</code>`;
    if (r.b) out = `<b>${out}</b>`;
    if (r.i) out = `<i>${out}</i>`;
    if (r.s) out = `<s>${out}</s>`;
    if (r.u) out = `<u>${out}</u>`;
    if (r.mention) out = `<span class="mention ${esc(r.mention)}">${out}</span>`;
    const href = sx_safeUrl(r.href);
    return href ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${out}</a>` : out;
  }).join("");
}

function sx_blocksHTML(list) {
  const out = [];
  for (const b of list) {
    switch (b.t) {
      case "h": out.push(`<h${b.level + 1} class="bh${b.level}">${sx_runsHTML(b.runs)}</h${b.level + 1}>`); break;
      case "li": {
        const mark = b.todo ? `<span class="todo ${b.checked ? "on" : ""}">${b.checked ? "✓" : ""}</span>` : `<span class="mk">${b.ordered ? `${b.n ?? 1}.` : b.depth % 2 ? "◦" : "•"}</span>`;
        out.push(`<div class="bli ${b.checked ? "done" : ""}" style="padding-left:${4 + b.depth * 22}px">${mark}<div>${sx_runsHTML(b.runs)}</div></div>`);
        break;
      }
      case "code": out.push(`<pre class="bcode">${esc(b.text)}</pre>`); break;
      case "quote": out.push(`<blockquote>${sx_runsHTML(b.runs)}</blockquote>`); break;
      case "hr": out.push("<hr>"); break;
      case "table":
        out.push(`<div class="btable-wrap"><table class="btable ${b.header ? "head" : ""}">${b.rows.map((row) => `<tr>${row.map((c) => `<td>${sx_runsHTML(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);
        break;
      case "callout": out.push(`<div class="bcallout ${esc(b.color || "default")}">${b.icon ? `<span class="ci">${esc(b.icon)}</span>` : ""}<div class="rich">${sx_blocksHTML(b.blocks)}</div></div>`); break;
      case "toggle": out.push(`<div class="btoggle"><span>▶</span><div>${sx_runsHTML(b.runs)}</div></div>`); break;
      case "embed": {
        const href = sx_safeUrl(b.href);
        out.push(href ? `<a class="bembed" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(b.label)}</a>` : `<div class="bembed">${esc(b.label)}</div>`);
        break;
      }
      case "more": out.push('<p class="bmore">이어지는 내용은 원본에서 볼 수 있어요</p>'); break;
      default: out.push(`<p style="${b.depth ? `padding-left:${b.depth * 22}px` : ""}">${sx_runsHTML(b.runs ?? [])}</p>`);
    }
  }
  return out.join("");
}

const sx_rich = (text, limit) => raw(`<div class="rich">${sx_blocksHTML(LR.blocks(text, limit))}</div>`);
const sx_richBlocks = (list) => raw(`<div class="rich">${sx_blocksHTML(list)}</div>`);
const sx_AVATAR_COLORS = ["#1868DB", "#22A06B", "#8F7EE7", "#E56910", "#C9372C", "#2898BD", "#B38600", "#DA62AC"];
function sx_avatarEl(person, cls = "") {
  const fill = person?.unknown || !person ? "#8C8F97" : sx_AVATAR_COLORS[LR.hueOf(person.name)];
  return raw(`<span class="av ${cls}" style="background:${fill};color:${LF.inkOn(fill, "#1F1F1F")}">${esc(person?.initials ?? "?")}</span>`);
}
const sx_outLink = (url, label) => (sx_safeUrl(url) ? html`<a class="open" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>` : "");

// ---------- Jira ----------

const sx_JIRA_MARK = '<svg viewBox="0 0 24 24" width="22" height="22"><rect width="24" height="24" rx="6" fill="#1868DB"/><path d="M9.2 15.6H7.9c-1.9 0-3.2-1.2-3.2-2.9h6.7c.4 0 .6.2.6.6v6.7c-1.7 0-2.8-1.400-2.800-3.200zm3.300-3.400h-1.300c-1.900 0-3.200-1.200-3.200-2.900h6.700c.4 0 .6.2.6.6v6.700c-1.700 0-2.800-1.400-2.800-3.200zm3.300-3.300h-1.300c-1.900 0-3.200-1.200-3.200-2.900h6.700c.4 0 .6.2.6.6v6.700c-1.700 0-2.800-1.400-2.800-3.200z" fill="#fff"/></svg>';
const sx_JIRA_TYPES = {
  task: '<svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.750" y="1.750" width="12.500" height="12.500" rx="2.500" fill="none" stroke="#1868DB" stroke-width="1.500"/><path d="M4.800 8.200l2.200 2.200 4.200-4.600" fill="none" stroke="#1868DB" stroke-width="1.500" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  story: '<svg viewBox="0 0 16 16" width="16" height="16"><path d="M4.250 2.250h7.500v11.500L8 10.900l-3.750 2.850z" fill="none" stroke="#4C9C2E" stroke-width="1.500" stroke-linejoin="round"/></svg>',
  epic: '<svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.500" y="1.500" width="13" height="13" rx="3" fill="#964AC0"/><path d="M8.900 3.600L5.200 8.600h2.500l-.6 3.800 3.700-5H8.300z" fill="#fff"/></svg>',
  bug: '<svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.500" y="1.500" width="13" height="13" rx="3" fill="#E2483D"/><circle cx="8" cy="8" r="2.600" fill="#fff"/></svg>',
  subtask: '<svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="2" width="6.500" height="6.500" rx="1.500" fill="none" stroke="#1868DB" stroke-width="1.500"/><rect x="7.500" y="7.500" width="6.500" height="6.500" rx="1.500" fill="#fff" stroke="#1868DB" stroke-width="1.500"/></svg>',
};
const sx_jiraType = (type) => raw(`<span class="jt-ico" title="${esc(type?.name ?? "")}">${sx_JIRA_TYPES[type?.kind] ?? sx_JIRA_TYPES.task}</span>`);
const sx_lozenge = (status, button = false) => html`<span class="loz ${status.cat} ${button ? "btn" : ""}">${status.name}${button ? raw(' <i>▾</i>') : ""}</span>`;
const sx_jiraWho = (p) => html`<span class="who">${sx_avatarEl(p, "round")}<span class="truncate">${p.name}</span></span>`;
const sx_jiraSite = (issue) => (issue.url ? /^(https?:\/\/[^/]+)/.exec(issue.url)?.[1] ?? null : null);
const sx_JIRA_NOTICE = { create: "새 업무 항목을 만들었어요", edit: "업무 항목을 고쳤어요", transition: "상태를 바꿨어요" };

function sx_jiraComment(c) {
  return html`<div class="jcomment">${sx_avatarEl(c.author, "round lg")}<div class="grow" style="min-width:0">
    <div class="jc-h"><b>${c.author?.name ?? "작성자 정보 없음"}</b>${c.created ? html`<span>${String(c.created).slice(0, 16).replace("T", " ")}</span>` : ""}</div>${sx_rich(c.body, 80)}</div></div>`;
}

function sx_jiraIssue(view) {
  const { issue } = view;
  const site = sx_jiraSite(issue);
  const browse = (key) => (site ? `${site}/browse/${key}` : "");
  const field = (label, value) => html`<div class="jf"><div class="k">${label}</div><div class="v">${value}</div></div>`;
  const fields = [
    issue.assignee ? field("담당자", sx_jiraWho(issue.assignee)) : "",
    issue.reporter ? field("보고자", sx_jiraWho(issue.reporter)) : "",
    issue.parent ? field("상위 항목", html`${sx_jiraType(issue.parent.type ?? { kind: "story" })}<a class="jparent" href="${browse(issue.parent.key)}" target="_blank" rel="noopener noreferrer"><b>${issue.parent.key}</b> <span class="truncate">${issue.parent.summary}</span></a>`) : "",
    issue.due ? field("기한", html`<span class="jdate">${issue.due}</span>`) : "",
    issue.priority ? field("우선 순위", html`<span class="jprio ${issue.priority}">=</span> ${issue.priority}`) : "",
    issue.labels.length ? field("레이블", issue.labels.slice(0, 12).map((l) => html`<span class="jlabel">${l}</span>`)) : "",
    issue.updated ? field("업데이트", html`<span class="jdim">${String(issue.updated).slice(0, 16).replace("T", " ")}</span>`) : "",
  ].filter(Boolean);
  const notice = sx_JIRA_NOTICE[view.kind] ? `${sx_JIRA_NOTICE[view.kind]}${view.changed?.length ? ` · ${view.changed.join(", ")}` : ""}` : null;
  return html`<div class="site jira">
    <div class="site-top">${raw(sx_JIRA_MARK)}
      <nav class="jcrumbs"><span>스페이스</span>${issue.project ? html`<i>/</i><span>${issue.project.name}</span>` : ""}
        ${issue.parent ? html`<i>/</i>${sx_jiraType(issue.parent.type ?? { kind: "story" })}<a href="${browse(issue.parent.key)}" target="_blank" rel="noopener noreferrer">${issue.parent.key}</a>` : ""}
        <i>/</i>${sx_jiraType(issue.type)}<span>${issue.key}</span></nav>
      <span class="grow"></span>${sx_outLink(issue.url, "Jira에서 열기")}</div>
    <div class="jissue">
      <div class="jmain">
        ${notice ? html`<div class="jnotice ${view.pending ? "wait" : ""}">${view.pending ? "아직 결과가 오지 않았어요 · 보낸 내용이에요" : `✓ ${notice}`}</div>` : ""}
        <h1>${issue.summary || issue.key}</h1>
        ${issue.description != null ? html`<h3 class="jsec">설명</h3>${issue.description.trim() ? sx_rich(issue.description) : html`<p class="jdim">설명 없음</p>`}` : ""}
        ${issue.comments.length ? html`<h3 class="jsec">댓글 ${issue.comments.length}</h3>${issue.comments.map(sx_jiraComment)}` : ""}
      </div>
      <aside class="jside">
        ${issue.status ? html`<div>${sx_lozenge(issue.status, true)}</div>` : ""}
        ${fields.length ? html`<div class="jpanel"><h4>세부 사항</h4>${fields}</div>` : ""}
      </aside>
    </div>
  </div>`;
}

function sx_jiraList(view) {
  const any = (pick) => view.issues.some(pick);
  const cols = { assignee: any((i) => i.assignee), status: any((i) => i.status), priority: any((i) => i.priority), due: any((i) => i.due) };
  const rows = view.issues.slice(0, 100);
  return html`<div class="site jira">
    <div class="jlist">
      <div class="jl-h">${raw(sx_JIRA_MARK)}<h1>업무 항목 검색</h1></div>
      ${view.jql ? html`<div class="jql"><span>JQL</span><code>${maskedText(view.jql)}</code></div>` : ""}
      ${view.pending ? html`<p class="jdim">검색 결과를 기다리고 있어요</p>` : !rows.length ? html`<p class="jdim">조건에 맞는 업무 항목이 없어요</p>` : html`<div class="jtable-wrap"><table class="jtable">
        <thead><tr><th>업무</th>${cols.assignee ? html`<th>담당자</th>` : ""}${cols.status ? html`<th>상태</th>` : ""}${cols.priority ? html`<th>우선 순위</th>` : ""}${cols.due ? html`<th>기한</th>` : ""}</tr></thead>
        <tbody>${rows.map((i) => html`<tr>
          <td><span class="jwork">${sx_jiraType(i.type)}<a href="${sx_safeUrl(i.url)}" target="_blank" rel="noopener noreferrer">${i.key}</a><span class="truncate">${i.summary}</span></span></td>
          ${cols.assignee ? html`<td>${i.assignee ? sx_jiraWho(i.assignee) : html`<span class="jdim">없음</span>`}</td>` : ""}
          ${cols.status ? html`<td>${i.status ? sx_lozenge(i.status) : ""}</td>` : ""}
          ${cols.priority ? html`<td>${i.priority ?? ""}</td>` : ""}
          ${cols.due ? html`<td>${i.due ?? ""}</td>` : ""}
        </tr>`)}</tbody></table><div class="jfoot">${view.issues.length}개${view.issues.length > rows.length ? ` 중 ${rows.length}개` : ""}</div></div>`}
    </div>
  </div>`;
}

function sx_jiraView(view) {
  if (view.kind === "list") return sx_jiraList(view);
  if (view.kind === "comment") {
    return html`<div class="site jira"><div class="site-top">${raw(sx_JIRA_MARK)}<nav class="jcrumbs">${sx_jiraType({ kind: "task" })}<span>${view.key}</span></nav><b style="margin-left:8px">${view.pending ? "댓글을 보내는 중" : "댓글을 달았어요"}</b></div>
      <div class="jpad">${sx_jiraComment(view.comment)}</div></div>`;
  }
  if (view.kind === "transitions") {
    if (!view.transitions.length) return null;
    return html`<div class="site jira"><div class="site-top">${raw(sx_JIRA_MARK)}<nav class="jcrumbs"><span>${view.key}</span></nav><b style="margin-left:8px">바꿀 수 있는 상태</b></div>
      <div class="jpad">${view.transitions.map((x) => html`<div class="jtrans"><span class="grow">${x.name}</span><span class="jdim">→</span>${sx_lozenge(x.to)}</div>`)}</div></div>`;
  }
  return sx_jiraIssue(view);
}

// ---------- Notion ----------

const sx_NOTION_MARK = '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="2.500" y="2.500" width="19" height="19" rx="4" fill="#fff" stroke="#2C2C2B" stroke-width="1.600"/><path d="M8.300 17V7.200h1.500l4.400 6.700V7.200h1.500V17h-1.500l-4.400-6.700V17z" fill="#2C2C2B"/></svg>';
const sx_NOTION_TAGS = [["#E3E2E0", "#32302C"], ["#EEE0DA", "#442A1E"], ["#FADEC9", "#49290E"], ["#FDECC8", "#402C1B"], ["#DBEDDB", "#1C3829"], ["#D3E5EF", "#183347"], ["#E8DEEE", "#412454"], ["#F5E0E9", "#4C2337"], ["#FFE2DD", "#5D1715"]];

function sx_notionValue(v) {
  if (v.kind === "check") return raw(`<span class="ncheck ${v.on ? "on" : ""}">${v.on ? "✓" : ""}</span>`);
  if (v.kind === "tags") return v.tags.slice(0, 10).map((tag) => { const [bg, fg] = sx_NOTION_TAGS[LR.hueOf(tag, sx_NOTION_TAGS.length)]; return html`<span class="ntag" style="background:${bg};color:${fg}">${tag}</span>`; });
  if (v.kind === "empty") return html`<span class="nempty">비어 있음</span>`;
  if (v.kind === "url") return html`<a href="${sx_safeUrl(v.text)}" target="_blank" rel="noopener noreferrer">${v.text}</a>`;
  return raw(sx_runsHTML(LR.inline(v.text.slice(0, 1200))));
}

const sx_notionProps = (props) => (props.length ? html`<div class="nprops">${props.map((p) => html`<div class="k truncate">${p.name}</div><div class="v">${sx_notionValue(p.value)}</div>`)}</div>` : "");
const sx_notionTop = (crumbs, url) => html`<div class="site-top">${raw(sx_NOTION_MARK)}<span class="ncrumbs truncate">${crumbs.map((c, i) => html`${i ? raw("<i>/</i>") : ""}<span>${c}</span>`)}</span><span class="grow"></span>${sx_outLink(url, "Notion에서 열기")}</div>`;
const sx_notionTitle = (title, icon) => html`${icon ? html`<div class="nicon">${icon}</div>` : ""}<h1>${title || "제목 없음"}</h1>`;
const sx_NOTION_COMMAND = { replace_content: "페이지 내용을 새로 썼어요", update_content: "페이지 내용을 고쳤어요", update_properties: "속성을 바꿨어요", insert_content: "내용을 넣었어요", insert_content_after: "내용을 넣었어요" };

function sx_notionView(view) {
  if (view.pending && !["update", "create", "search"].includes(view.kind)) return null;
  if (view.kind === "page") {
    return html`<div class="site notion">${sx_notionTop([...view.crumbs, view.title], view.url)}
      <div class="npage">${sx_notionTitle(view.title, view.icon)}${sx_notionProps(view.props)}${view.props.length ? raw("<hr>") : ""}
        ${view.blank ? html`<p class="ndim">빈 페이지예요</p>` : sx_richBlocks(view.blocks)}
        ${view.cut ? html`<p class="ndim">결과가 길어서 뒷부분은 기록에 남지 않았어요</p>` : ""}</div></div>`;
  }
  if (view.kind === "database") {
    return html`<div class="site notion">${sx_notionTop([...view.crumbs, view.title], view.url)}
      <div class="npage">${sx_notionTitle(view.title, null)}
        ${view.views.length ? html`<div class="nviews">${view.views.map((v, i) => html`<span class="${i === 0 ? "on" : ""}">${v}</span>`)}</div>` : ""}
        <div class="ncols">${view.columns.map((c) => html`<div><span class="grow truncate">${c.name}</span><span class="ndim">${c.type.toLowerCase()}</span></div>`)}</div></div></div>`;
  }
  if (view.kind === "search") {
    return html`<div class="site notion"><div class="nsearch-h">${raw(sx_NOTION_MARK)}<span>🔍</span><b class="truncate">${view.query || "검색"}</b></div>
      ${view.pending ? html`<p class="ndim" style="padding:18px">검색 결과를 기다리고 있어요</p>` : html`<div class="nresults">${view.results.length ? view.results.map((r) => html`<a class="nres" href="${sx_safeUrl(r.url)}" target="_blank" rel="noopener noreferrer">
        <span class="ri">${r.type === "database" ? "🗂" : "📄"}</span>
        <span class="grow" style="min-width:0"><span class="t truncate">${r.title || "제목 없음"}</span>${r.path ? html`<span class="p truncate">${r.path}</span>` : ""}${r.highlight ? html`<span class="h">${raw(sx_runsHTML(LR.inline(r.highlight.slice(0, 260))))}</span>` : ""}</span>
        ${r.time ? html`<span class="d">${String(r.time).slice(0, 10)}</span>` : ""}</a>`) : html`<p class="ndim" style="padding:12px">결과 없음</p>`}</div>`}</div>`;
  }
  if (view.kind === "rows") {
    const rows = view.rows.slice(0, 100);
    return html`<div class="site notion"><div class="site-top">${raw(sx_NOTION_MARK)}<b>표</b><span class="grow"></span><span class="ndim">${view.total}개 행${view.total > rows.length ? ` 중 ${rows.length}개` : ""}</span></div>
      <div class="ntable-wrap"><table class="ntable"><thead><tr>${view.columns.map((c) => html`<th>${c}</th>`)}</tr></thead>
        <tbody>${rows.map((r) => html`<tr>${r.cells.map((v) => html`<td>${v.kind === "empty" ? "" : sx_notionValue(v)}</td>`)}</tr>`)}</tbody></table></div></div>`;
  }
  const state = (done) => (view.failed ? "실패했어요" : view.pending ? "아직 결과가 오지 않았어요 · 보낸 내용이에요" : `✓ ${done}`);
  const tone = view.failed ? "bad" : view.pending ? "wait" : "";
  if (view.kind === "update") {
    return html`<div class="site notion">${sx_notionTop([view.title || `페이지 ${view.pageId.slice(0, 8)}`], null)}
      <div class="npage"><div class="nnotice ${tone}">${state(sx_NOTION_COMMAND[view.command] ?? "페이지를 고쳤어요")}</div>
        ${view.title || view.icon ? sx_notionTitle(view.title, view.icon) : ""}${sx_notionProps(view.props)}${view.blocks.length ? sx_richBlocks(view.blocks) : ""}
        ${view.edits.map((e, i) => html`<div class="nedit"><div class="ndim">바꾼 곳 ${i + 1}</div>${e.from.length ? html`<div class="was">${sx_richBlocks(e.from)}</div>` : ""}${e.to.length ? html`<div class="now">${sx_richBlocks(e.to)}</div>` : ""}</div>`)}</div></div>`;
  }
  if (view.kind === "create") {
    return html`<div class="site notion">${sx_notionTop(["새 페이지"], null)}
      <div class="npage"><div class="nnotice ${tone}">${state(`페이지 ${view.pages.length}개를 만들었어요`)}</div>
        ${view.pages.slice(0, 40).map((p) => html`<section class="nmade"><div class="nmade-h"><h2 class="${view.pages.length > 1 ? "" : "big"}">${p.icon ? `${p.icon} ` : ""}${p.title || "제목 없음"}</h2>${sx_outLink(p.url, "열기")}</div>${sx_notionProps(p.props)}${p.blocks.length ? sx_richBlocks(p.blocks) : ""}</section>`)}</div></div>`;
  }
  return null;
}

// ---------- Slack ----------

const sx_SLACK_MARK = '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="13" width="7.500" height="3.400" rx="1.700" fill="#E01E5A"/><rect x="7.600" y="13" width="3.400" height="9" rx="1.700" fill="#E01E5A"/><rect x="7.600" y="2" width="3.400" height="7.500" rx="1.700" fill="#36C5F0"/><rect x="2" y="7.600" width="9" height="3.400" rx="1.700" fill="#36C5F0"/><rect x="14.500" y="7.600" width="7.500" height="3.400" rx="1.700" fill="#2EB67D"/><rect x="13" y="2" width="3.400" height="9" rx="1.700" fill="#2EB67D"/><rect x="13" y="14.500" width="3.400" height="7.500" rx="1.700" fill="#ECB22E"/><rect x="13" y="13" width="9" height="3.400" rx="1.700" fill="#ECB22E"/></svg>';

function sx_slackMessage(m, thread = false) {
  return html`<div class="smsg">${sx_avatarEl(m.author, "sq")}<div class="grow" style="min-width:0">
    <div class="sm-h"><b>${m.sent ? "보낸 메시지" : m.author.name}</b>${m.bot ? html`<span class="sx-app">앱</span>` : ""}${m.time ? html`<span class="ts">${m.time}</span>` : ""}</div>
    ${sx_rich(m.text, 120)}
    ${!m.text && !m.files ? html`<div class="sdim">본문 글자가 없는 메시지예요 (버튼·카드만 있는 앱 메시지)</div>` : ""}
    ${m.around ? html`<div class="sdim">앞뒤 메시지 ${m.around}개는 '원본'에 있어요</div>` : ""}
    ${m.cut ? html`<div class="sdim">검색 결과라 여기까지만 왔어요</div>` : ""}
    ${m.files ? html`<div class="sdim">📎 ${m.files}</div>` : ""}
    ${m.reactions?.length ? html`<div class="sreact">${m.reactions.map((r) => html`<span>${r.name} ${r.count}</span>`)}</div>` : ""}
    ${m.replies && !thread ? html`<div class="sreplies">답글 ${m.replies}개</div>` : ""}
    ${m.link ? html`<div style="margin-top:6px">${sx_outLink(m.link, "Slack에서 열기")}</div>` : ""}
  </div></div>`;
}

function sx_slackView(view) {
  const head = (title, sub) => html`<div class="shead">${raw(sx_SLACK_MARK)}<b>${title}</b>${sub ? html`<span class="truncate">${sub}</span>` : ""}</div>`;
  const list = view.messages.slice(0, 100);
  if (view.kind === "search") {
    return html`<div class="site slack">${head("검색", null)}<div class="sbox"><span>🔍</span><span class="truncate">${view.query}</span></div>
      ${view.pending ? html`<p class="sdim" style="padding:14px 20px">검색 결과를 기다리고 있어요</p>` : html`<div class="scount">메시지 ${view.messages.length}개</div>
      <div class="scards">${list.map((m) => html`<div class="scard"><div class="sch">${m.channel ?? ""}</div>${sx_slackMessage(m)}</div>`)}</div>`}</div>`;
  }
  if (view.kind === "sent") {
    return html`<div class="site slack">${head(view.failed ? "보내지 못했어요" : view.pending ? "보내는 중" : "메시지를 보냈어요", view.threadTs ? `${view.channel} · 스레드에 답글` : view.channel)}<div class="slist">${list.map((m) => sx_slackMessage(m))}</div></div>`;
  }
  if (view.pending) return html`<div class="site slack">${head(view.kind === "thread" ? "스레드" : "채널", null)}<p class="sdim" style="padding:14px 20px">메시지를 기다리고 있어요</p></div>`;
  if (view.kind === "thread") {
    const [root, ...replies] = list;
    return html`<div class="site slack">${head("스레드", view.channel || view.channelId)}<div class="slist">${sx_slackMessage(root, true)}
      ${replies.length ? html`<div class="sdivider"><span>답글 ${view.messages.length - 1}개</span><i></i></div>` : ""}${replies.map((m) => sx_slackMessage(m, true))}</div></div>`;
  }
  return html`<div class="site slack">${head(view.channel || "채널", view.channelId && view.channel ? view.channelId : null)}<div class="slist">${list.map((m) => sx_slackMessage(m))}</div></div>`;
}

/** The site-looking view of a Jira / Notion / Slack call, or null (the generic view draws it). */
function siteView(call, strict = false) {
  const prepared = sitePrepared(call);
  if (!prepared) return null;
  const draw = SITE_DRAW[prepared.site];
  if (strict) return draw(prepared.view);
  try {
    return draw(prepared.view);
  } catch {
    return null;
  }
}

/* ---- src/js/tools/product-google.js ---- */
// Gmail, Google Calendar and Google Sheets calls drawn the way those sites look (light themes,
// Google's Material palette). Parsing is the mod's lib/ (gmail, gcal, gsheets); this file turns
// the parsed views into HTML, and css/sites-google.css holds the looks.
// A mail's HTML body is never put into the page: only its plain text is drawn.

const sx_GMAIL_MARK = '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M2 17.800c0 .900.700 1.600 1.600 1.600H6V10L2 7z" fill="#4285F4"/><path d="M18 19.400h2.400c.900 0 1.600-.700 1.600-1.600V7l-4 3z" fill="#34A853"/><path d="M18 5.200V10l4-3V6.200c0-2-2.300-3.100-3.800-1.900z" fill="#FBBC04"/><path d="M6 10V5.200l6 4.500 6-4.500V10l-6 4.500z" fill="#EA4335"/><path d="M2 6.200V7l4 3V5.200l-.200-.900C4.300 3.100 2 4.200 2 6.200z" fill="#C5221F"/></svg>';
const sx_GCAL_MARK = '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M17.300 6.700H6.700v10.600h10.600z" fill="#fff"/><path d="M17.300 22 22 17.300h-4.700z" fill="#EA4335"/><path d="M22 6.700h-4.700v10.600H22z" fill="#FBBC04"/><path d="M17.300 17.300H6.700V22h10.600z" fill="#34A853"/><path d="M2 17.300v3.100c0 .900.700 1.600 1.600 1.600h3.100v-4.700z" fill="#188038"/><path d="M22 6.700V3.600c0-.900-.700-1.600-1.600-1.600h-3.100v4.700z" fill="#1967D2"/><path d="M17.300 2H3.600C2.700 2 2 2.700 2 3.600v13.700h4.700V6.700h10.600z" fill="#4285F4"/><text x="12" y="15.300" text-anchor="middle" font-size="7.500" font-weight="700" fill="#4285F4" font-family="Arial">31</text></svg>';
const sx_GSHEETS_MARK = '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M14.500 2H6.200C5.300 2 4.500 2.800 4.500 3.700v16.600c0 .900.800 1.700 1.700 1.700h11.600c.900 0 1.700-.800 1.700-1.700V7z" fill="#0F9D58"/><path d="M14.500 2v3.300c0 .900.800 1.700 1.700 1.700h3.300z" fill="#87CEAC"/><path d="M8 11v7h8v-7zm3.500 6h-2.500v-1.500h2.500zm0-2.500h-2.500V13h2.500zm3.500 2.500h-2.500v-1.500H15zm0-2.500h-2.500V13H15z" fill="#F1F1F1"/></svg>';

const sx_gTop = (mark, title, sub, url, label) => html`<div class="g-top">${raw(mark)}<span class="g-name">${title}</span><span class="g-sub truncate">${sub ?? ""}</span><span class="grow"></span>${sx_outLink(url, label)}</div>`;
const sx_gChip = (text) => html`<span class="g-chip">${text}</span>`;

// ---------- Gmail ----------

function sx_gmailRow(row) {
  const names = row.senders.length ? row.senders.slice(0, 3).map((p) => p.name).join(", ") : "임시보관";
  const href = sx_safeUrl(row.url);
  const inner = html`<span class="gm-star ${row.starred ? "on" : ""}">${row.starred ? "★" : "☆"}</span>
    <span class="gm-from truncate ${row.senders.length ? "" : "draft"}">${names}${row.count > 1 ? html` <i>${row.count}</i>` : ""}</span>
    <span class="gm-line">${row.labels.slice(0, 2).map(sx_gChip)}<b class="truncate">${row.subject}</b><span class="truncate">${row.snippet ? `- ${row.snippet}` : ""}</span></span>
    ${row.attachments ? html`<span class="gm-clip">📎</span>` : ""}<span class="gm-date">${LGM.listDate(row.date)}</span>`;
  return href
    ? html`<a class="gm-row ${row.unread ? "unread" : ""}" href="${href}" target="_blank" rel="noopener noreferrer">${inner}</a>`
    : html`<div class="gm-row ${row.unread ? "unread" : ""}">${inner}</div>`;
}

function sx_gmailMessage(m) {
  const toLine = [...m.to, ...m.cc].slice(0, 4).map((p) => p.name).join(", ");
  return html`<div class="gm-msg">
    <div class="gm-mh">${sx_avatarEl(m.from, "gm")}<div class="gm-who"><div><b>${m.from.name}</b><span class="truncate">${m.from.email ? `<${m.from.email}>` : ""}</span><time>${LGM.fullDate(m.date)}</time></div>
      ${toLine ? html`<div class="gm-to truncate">${toLine}에게</div>` : ""}</div></div>
    <div class="gm-body">${m.body ? sx_rich(m.body, 160) : html`<p class="g-dim">${m.snippet || "본문 없이 불러왔어요"}</p>`}</div>
    ${m.attachments.length ? html`<div class="gm-atts">${m.attachments.slice(0, 12).map((a) => html`<span class="gm-att"><i>📎</i><span class="truncate">${a.name}</span></span>`)}</div>` : ""}
  </div>`;
}

const sx_gmailPeople = (label, people) => (people.length ? html`<div class="gm-field"><span>${label}</span>${people.map((p) => html`<span class="gm-pill">${sx_avatarEl(p, "xs")}${p.email || p.name}</span>`)}</div>` : "");

function sx_gmailView(view) {
  if (view.kind === "list") {
    const count = view.total != null && view.total > view.rows.length ? `${view.rows.length}개 표시 · 약 ${view.total}개` : `${view.rows.length}개${view.more ? " 이상" : ""}`;
    return html`<div class="site gmail">${sx_gTop(sx_GMAIL_MARK, view.drafts ? "임시보관함" : "Gmail", null, null, "")}
      <div class="gm-search"><span>🔍</span><span class="truncate ${view.query ? "" : "g-dim"}">${view.query || "메일 검색"}</span></div>
      ${view.pending ? html`<p class="g-dim g-pad">메일을 찾고 있어요</p>` : view.rows.length
        ? html`<div class="gm-list">${view.rows.slice(0, 100).map(sx_gmailRow)}<div class="gm-count">${count}</div></div>`
        : html`<p class="g-dim g-pad">일치하는 메일이 없어요</p>`}</div>`;
  }
  if (view.kind === "thread") {
    return html`<div class="site gmail">${sx_gTop(sx_GMAIL_MARK, "Gmail", view.count > 1 ? `메일 ${view.count}개` : null, view.url, "Gmail에서 열기")}
      ${view.pending ? html`<p class="g-dim g-pad">메일을 불러오고 있어요</p>` : html`<h1 class="gm-subject">${view.subject}${view.labels.map(sx_gChip)}</h1>${view.messages.slice(0, 50).map(sx_gmailMessage)}`}</div>`;
  }
  if (view.kind === "draft") {
    const title = view.pending ? "임시보관함에 저장하는 중" : view.update ? "임시보관 메일을 고쳤어요" : view.reply ? "답장을 임시보관함에 저장했어요" : "임시보관함에 저장했어요";
    return html`<div class="site gmail">${sx_gTop(sx_GMAIL_MARK, "Gmail", title, view.url, "Gmail에서 열기")}
      <div class="gm-compose"><div class="gm-ch">${view.reply ? "답장" : "새 메일"}</div>
        ${sx_gmailPeople("받는사람", view.to)}${sx_gmailPeople("참조", view.cc)}${sx_gmailPeople("숨은참조", view.bcc)}
        <div class="gm-field ${view.subject ? "" : "g-dim"}">${view.subject || "제목"}</div>
        <div class="gm-cbody">${view.body ? sx_rich(view.body, 160) : html`<p class="g-dim">(본문 없음)</p>`}</div>
        <div class="gm-cfoot"><span class="g-btn">보내기</span><span class="g-dim">${view.signature ? "서명 포함 · " : ""}아직 보내지 않았어요</span></div></div></div>`;
  }
  return html`<div class="site gmail">${sx_gTop(sx_GMAIL_MARK, "Gmail", `라벨 ${view.labels.length}개`, null, "")}
    <div class="gm-labels">${view.labels.slice(0, 80).map((l) => html`<div class="gm-label ${l.unread > 0 ? "unread" : ""}"><i>${l.system ? "▸" : "🏷"}</i><span class="truncate grow">${l.name}</span><span>${l.unread > 0 ? l.unread : ""}</span></div>`)}</div></div>`;
}

// ---------- Calendar ----------

const sx_GCAL_STATUS = { accepted: ["✓", "#188038"], declined: ["✕", "#C5221F"], tentative: ["?", "#5E5E5E"] };
const sx_GCAL_COLORS = ["#039BE5", "#33B679", "#8E24AA", "#F4511E", "#F6BF26", "#7986CB", "#D50000", "#616161"];

function sx_gcalEvent(e) {
  const href = sx_safeUrl(e.url);
  const inner = html`<i class="gc-dot" style="background:${e.color}"></i><span class="gc-time truncate">${LGC.timeRange(e.start, e.end)}</span><b class="truncate ${e.cancelled ? "gone" : ""}">${e.title}</b><span class="gc-loc truncate">${e.location ?? ""}</span>`;
  return href ? html`<a class="gc-ev" href="${href}" target="_blank" rel="noopener noreferrer">${inner}</a>` : html`<div class="gc-ev">${inner}</div>`;
}

function sx_gcalGuest(g) {
  const mark = sx_GCAL_STATUS[g.status];
  const note = [g.self ? "나" : null, g.optional ? "선택" : null].filter(Boolean).join(" · ");
  return html`<div class="gc-guest"><span class="gc-av">${sx_avatarEl(g, "")}${mark ? html`<i style="background:${mark[1]}">${mark[0]}</i>` : ""}</span><span class="truncate">${g.name}</span><small>${note}</small></div>`;
}

const sx_gcalLine = (mark, body) => html`<div class="gc-line"><span class="gc-mark">${mark}</span><div class="gc-val">${body}</div></div>`;

function sx_gcalView(view) {
  if (view.kind === "agenda") {
    const range = view.from ? `${LGC.dayLabel(view.from).long}${view.to ? ` ~ ${view.to.mo}월 ${view.to.d}일` : " 부터"}` : null;
    const sub = [view.calendar, view.query ? `검색: ${view.query}` : null, range].filter(Boolean).join(" · ");
    return html`<div class="site gcal">${sx_gTop(sx_GCAL_MARK, "일정", sub, null, "")}
      ${view.pending ? html`<p class="g-dim g-pad">일정을 불러오고 있어요</p>` : view.days.length
        ? html`<div class="gc-days">${view.days.map((day) => html`<div class="gc-day"><div class="gc-date"><b>${day.label.num}</b><span>${day.label.sub}</span></div><div class="gc-evs">${day.events.map(sx_gcalEvent)}</div></div>`)}</div>
          <div class="gc-count">일정 ${view.count}개${view.more ? " 이상" : ""}</div>`
        : html`<p class="g-dim g-pad">이 기간에 일정이 없어요</p>`}</div>`;
  }
  if (view.kind === "event") {
    const e = view.event;
    if (!e) return html`<div class="site gcal">${sx_gTop(sx_GCAL_MARK, "일정", view.notice, null, "")}<p class="g-dim g-pad">일정을 기다리고 있어요</p></div>`;
    const when = e.start ? `${LGC.dayLabel(e.start).long} · ${LGC.timeRange(e.start, e.end)}` : "";
    const places = [e.location, ...e.rooms.map((r) => r.name)].filter((v, i, all) => v && all.indexOf(v) === i);
    const meet = sx_safeUrl(e.meet);
    return html`<div class="site gcal">${sx_gTop(sx_GCAL_MARK, "일정", view.pending ? "보내는 중" : view.notice, e.url, "Calendar에서 열기")}
      <div class="gc-card">
        ${sx_gcalLine(html`<i class="gc-sq" style="background:${e.color}"></i>`, html`<h1 class="${view.deleted || e.cancelled ? "gone" : ""}">${e.title}</h1><p class="gc-when">${[when, e.recurring ? "반복 일정" : null, e.typeLabel].filter(Boolean).join(" · ")}</p>`)}
        ${meet ? sx_gcalLine("📹", html`<a class="g-btn" href="${meet}" target="_blank" rel="noopener noreferrer">Google Meet으로 참여</a><span class="g-dim gc-meet truncate">${meet.replace(/^https?:\/\//, "")}</span>`) : ""}
        ${places.length ? sx_gcalLine("📍", places.map((p) => html`<div>${p}</div>`)) : ""}
        ${e.guests.length ? sx_gcalLine("👥", html`<div>참석자 ${e.guests.length}명</div><p class="g-dim gc-tally">수락 ${e.guests.filter((g) => g.status === "accepted").length}명 · 응답 대기 ${e.guests.filter((g) => g.status === "needsAction").length}명</p>${e.guests.slice(0, 60).map(sx_gcalGuest)}`) : ""}
        ${e.description ? sx_gcalLine("≡", sx_rich(e.description, 80)) : ""}
        ${e.organizer ? sx_gcalLine("📅", e.organizer.self ? "내 캘린더" : `${e.organizer.name} (주최)`) : ""}
      </div></div>`;
  }
  if (view.kind === "calendars") {
    return html`<div class="site gcal">${sx_gTop(sx_GCAL_MARK, "캘린더", `내 캘린더 ${view.calendars.length}개`, null, "")}
      <div class="gc-cals">${view.calendars.map((c, i) => html`<div class="gc-cal"><i style="background:${sx_GCAL_COLORS[i % sx_GCAL_COLORS.length]}">✓</i><span class="truncate">${c.name}</span><small class="truncate">${c.description ?? ""}</small></div>`)}</div></div>`;
  }
  const sub = [view.minutes ? `${view.minutes}분` : null, view.guests.length ? `참석자 ${view.guests.length}명` : null].filter(Boolean).join(" · ");
  return html`<div class="site gcal">${sx_gTop(sx_GCAL_MARK, "추천 시간", sub, null, "")}
    <div class="gc-slots">${view.slots.map((s) => html`<div class="gc-slot"><i class="gc-dot" style="background:#039BE5"></i><b>${LGC.dayLabel(s.start).long}</b><span>${LGC.timeRange(s.start, s.end)}</span></div>`)}</div></div>`;
}

// ---------- Sheets ----------

function sx_gsheetsView(view) {
  if (view.kind === "grid") {
    const g = view.grid;
    const size = `${g.totalRows}행 × ${g.totalCols}열`;
    const cut = g.totalRows > g.rows.length || g.totalCols > g.cols.length;
    const note = view.pending ? "기다리는 중" : view.write ? `${view.notice}${view.cells != null ? ` · 셀 ${view.cells}개` : ""}` : size;
    return html`<div class="site gsheets">${sx_gTop(sx_GSHEETS_MARK, g.sheet || "스프레드시트", view.write ? view.notice : "값 읽기", view.url, "Sheets에서 열기")}
      <div class="gs-fx"><span class="gs-ref truncate">${g.cells || g.text || "A1"}</span><i>fx</i><span class="truncate">${note}</span></div>
      ${view.empty || !g.rows.length ? html`<p class="g-dim g-pad">${view.pending ? "값을 기다리고 있어요" : "이 범위는 비어 있어요"}</p>` : html`<div class="gs-wrap"><table class="gs-grid ${view.write ? "write" : ""}">
        <thead><tr><th class="gs-corner"></th>${g.cols.map((c) => html`<th>${c}</th>`)}</tr></thead>
        <tbody>${g.rows.map((r) => html`<tr><th>${r.n}</th>${r.cells.map((c) => html`<td class="${c.number ? "num" : ""} ${c.formula ? "fx" : ""} ${c.text === "" ? "" : "set"}" title="${c.text}">${c.text}</td>`)}</tr>`)}</tbody></table></div>`}
      <div class="gs-tabs"><span class="gs-plus">+</span><span class="gs-tab">${g.sheet || "시트1"}</span><span class="grow"></span><span class="g-dim">${cut ? `${size} 중 ${g.rows.length}행 × ${g.cols.length}열 표시` : size}</span></div></div>`;
  }
  if (view.kind === "book") {
    return html`<div class="site gsheets">${sx_gTop(sx_GSHEETS_MARK, view.title ?? "스프레드시트", `시트 ${view.sheets.length}개`, view.url, "Sheets에서 열기")}
      ${view.pending ? html`<p class="g-dim g-pad">스프레드시트를 불러오고 있어요</p>` : html`<div class="gs-tabs wrap">${view.sheets.map((s, i) => html`<span class="gs-tab ${i === 0 ? "" : "off"}" title="${s.rows && s.cols ? `${s.rows}행 × ${s.cols}열` : ""}">${s.title}</span>`)}</div>`}</div>`;
  }
  return html`<div class="site gsheets">${sx_gTop(sx_GSHEETS_MARK, "스프레드시트", view.pending ? "지우는 중" : "값을 지웠어요", view.url, "Sheets에서 열기")}
    <div class="gs-cleared">${view.ranges.map((r) => html`<span>${r}</span>`)}</div></div>`;
}

// Any other MCP tool: inputs as key/value, result as a summary (Jira, Notion, Markdown) or raw JSON.

const JIRA_TYPE = {
  Epic: ["#904ee2", '<path d="M13 3 6 14h5l-1 7 7-11h-5z" fill="#fff"/>'],
  Story: ["#63ba3c", '<path d="M8 5h8v14l-4-3-4 3z" fill="#fff"/>'],
  Task: ["#4bade8", '<path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'],
  Bug: ["#e5493a", '<circle cx="12" cy="12" r="4.2" fill="#fff"/>'],
};

const jiraTypeIcon = (type, size = 16) => {
  const [bg, glyph] = JIRA_TYPE[type] || JIRA_TYPE.Task;
  return raw(`<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-label="${esc(type)}"><rect width="24" height="24" rx="5" fill="${bg}"/>${glyph}</svg>`);
};

const PRIORITY = {
  Highest: ["#ff5630", "m6 11 6-6 6 6M6 18l6-6 6 6"],
  High: ["#ff7452", "m6 15 6-6 6 6"],
  Medium: ["#ffab00", "M6 10h12M6 15h12"],
  Low: ["#4c9aff", "m6 9 6 6 6-6"],
};

const priorityIcon = (p) => {
  const [c, d] = PRIORITY[p] || PRIORITY.Medium;
  return raw(`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="우선순위 ${esc(p)}"><path d="${d}"/></svg>`);
};

function avatar(name, size = 18) {
  if (!name) return raw(`<span class="av" style="width:${size}px;height:${size}px;background:#ffffff18;color:var(--dim)">?</span>`);
  return raw(`<span class="av" style="width:${size}px;height:${size}px;background:hsl(${hashStr(name) % 360} 60% 72%)">${esc(name.slice(0, 1).toUpperCase())}</span>`);
}

const jiraStatus = (status, cat) => html`<span class="jst ${cat}">${status.toUpperCase()}</span>`;

function jiraCards(issues) {
  return html`<div class="jcards">${issues.map(
    (x) => html`<div class="jcard">
      ${jiraTypeIcon(x.type)}
      <div style="min-width:0">
        <div><span class="key">${x.key}</span><span class="sm">${x.summary}</span></div>
        <div class="meta">${priorityIcon(x.priority)} ${x.priority} · ${avatar(x.assignee, 16)} ${x.assignee || "담당자 없음"}${x.updated ? ` · 업데이트 ${relTime(atOffset(x.updated))}` : ""}</div>
      </div>
      ${jiraStatus(x.status, x.cat)}
    </div>`,
  )}</div>`;
}

function jiraIssue(x) {
  const pct = Math.round((x.children.done / x.children.total) * 100);
  return html`<div class="jira-issue">
    <div class="ji-h">
      <div class="ji-crumbs">${jiraTypeIcon(x.type, 14)} <span class="mono">${x.key}</span> · ${x.type}</div>
      <h3>${x.summary}</h3>
    </div>
    <div class="ji-grid">
      <div class="ji-main">
        <div class="lbl" style="margin-bottom:6px">설명</div>
        ${md(x.description)}
        <div class="lbl" style="margin:16px 0 6px">하위 이슈 ${x.children.done}/${x.children.total} 완료</div>
        <div class="meter"><i style="width:${pct}%;background:#63ba3c"></i></div>
      </div>
      <div class="ji-side">
        <span class="k">상태</span><span>${jiraStatus(x.status, x.cat)}</span>
        <span class="k">우선순위</span><span class="row" style="gap:5px">${priorityIcon(x.priority)} ${x.priority}</span>
        <span class="k">담당</span><span class="row" style="gap:6px">${avatar(x.assignee)} ${x.assignee}</span>
        <span class="k">보고</span><span class="row" style="gap:6px">${avatar(x.reporter)} ${x.reporter}</span>
        <span class="k">스프린트</span><span>${x.sprint}</span>
        <span class="k">기한</span><span class="num">${x.due}</span>
        <span class="k">레이블</span><span class="chips">${x.labels.map((l) => html`<span class="chip">${l}</span>`)}</span>
      </div>
    </div>
  </div>`;
}

function linkCards(results) {
  return html`<div class="jcards">${results.map(
    (x) => html`<div class="jcard" style="grid-template-columns:24px minmax(0,1fr) auto">
      ${fav(x.url, 22)}
      <div style="min-width:0"><a class="sm" href="${x.url}" target="_blank" rel="noopener noreferrer" style="color:var(--foreground)">${x.title}</a><div class="meta"><span class="truncate">${hostOf(x.url)}</span>${x.edited ? html` · 수정 ${relTime(atOffset(x.edited))}` : ""}</div></div>
      <span class="chip">${x.type || "page"}</span>
    </div>`,
  )}</div>`;
}

// Collapsible JSON tree; first level open.
function jsonTree(value, key, path, depth) {
  const isObj = value && typeof value === "object";
  const k = key != null ? `<span class="jt-k">${esc(JSON.stringify(key))}</span><span class="jt-meta">: </span>` : "";
  if (!isObj) {
    const cls = typeof value === "string" ? "tk-str" : typeof value === "number" ? "tk-num" : "tk-kw";
    return `<div class="jt-row"><span style="width:14px"></span>${k}<span class="${cls}">${esc(JSON.stringify(value))}</span></div>`;
  }
  const entries = Array.isArray(value) ? value.map((v, i) => [i, v]) : Object.entries(value);
  const foldKey = `j:${path}`;
  const open = depth < 1 ? !STATE.openFolds.has(foldKey) : STATE.openFolds.has(foldKey);
  const meta = Array.isArray(value) ? `[${entries.length}]` : `{${entries.length}}`;
  return `<div class="jt-row"><button data-action="unfold" data-fold="${esc(foldKey)}" aria-expanded="${open}">${icon(open ? "chevron-down" : "chevron-right", 12).s}</button>${k}<span class="jt-meta">${meta}</span></div>${open ? `<div class="jt-kids">${entries.map(([ck, cv]) => jsonTree(cv, Array.isArray(value) ? null : ck, `${path}.${ck}`, depth + 1)).join("")}</div>` : ""}`;
}

function mcpSummary(r) {
  if (r.issues) return html`<div class="row" style="padding:10px 12px 0;gap:6px"><span class="tag"><i>isLast</i>${String(r.isLast)}</span><span class="tag"><i>total</i>${r.total}</span></div>${jiraCards(r.issues)}`;
  if (r.issue) return html`<div style="padding:10px">${jiraIssue(r.issue)}</div>`;
  if (r.results) return linkCards(r.results);
  if (r.markdown) return html`<div style="padding:14px 18px">${md(r.markdown)}</div>`;
  return null;
}

const MCP_MEMO = new WeakMap();

// Jira issue JSON (REST or Rovo) -> the card shapes above.
function jiraFlat(n) {
  const f = n.fields ?? {};
  return {
    key: n.key,
    summary: f.summary ?? "",
    type: f.issuetype?.name ?? "Task",
    priority: f.priority?.name ?? "",
    assignee: f.assignee?.displayName ?? "",
    reporter: f.reporter?.displayName ?? "",
    status: f.status?.name ?? "",
    cat: f.status?.statusCategory?.key ?? "",
    updated: f.updated ? (Date.parse(f.updated) - T0) / 1000 : 0,
  };
}

// Atlassian document format -> plain text paragraphs.
function adfText(node) {
  if (!node || typeof node !== "object") return typeof node === "string" ? node : "";
  if (node.type === "text") return node.text ?? "";
  const inner = (node.content ?? []).map(adfText).join(node.type === "doc" ? "\n\n" : "");
  return node.type === "paragraph" || node.type === "heading" ? inner : inner;
}

function jiraFull(n) {
  const f = n.fields ?? {};
  const subs = f.subtasks ?? [];
  return {
    ...jiraFlat(n),
    description: typeof f.description === "string" ? f.description : adfText(f.description),
    children: { done: subs.filter((x) => x.fields?.status?.statusCategory?.key === "done").length, total: subs.length || 1 },
    sprint: (f.sprint?.name ?? (Array.isArray(f.customfield_10020) ? f.customfield_10020.at(-1)?.name : "")) || "—",
    due: f.duedate ?? "—",
    labels: f.labels ?? [],
  };
}

// A real MCP result: JSON (with Jira as cards), or text shown as Markdown.
function mcpResult(call) {
  if (MCP_MEMO.has(call)) return MCP_MEMO.get(call);
  const text = call.result?.text ?? "";
  let data;
  try {
    data = /^\s*[[{]/.test(text) ? JSON.parse(text) : undefined;
  } catch {
    data = undefined;
  }
  let value;
  if (data === undefined) value = { payload: { text: maskedText(text) }, summary: text ? { markdown: maskedText(text) } : {} };
  else {
    const issues = Array.isArray(data?.issues) ? data.issues : Array.isArray(data?.issues?.nodes) ? data.issues.nodes : null;
    const summary = issues
      ? { issues: issues.map(jiraFlat), total: data.total ?? data.issues?.totalCount ?? issues.length, isLast: data.isLast ?? !data.issues?.pageInfo?.hasNextPage }
      : data?.key && data?.fields ? { issue: jiraFull(data) } : {};
    value = { payload: data, summary };
  }
  MCP_MEMO.set(call, value);
  return value;
}

function renderMcpGeneric(call) {
  const p = mcpParts(call.name);
  const i = call.input || {};
  const view = uiGet(`${call.id}:mcpview`, "summary");
  // Jira, Notion and Slack calls are drawn the way those sites look.
  const site = view === "raw" || call.result?.err ? null : siteView(call);
  if (site) {
    return html`<div class="mcp-h">
        <div class="kind-tile" style="--kc:var(--k-mcp)">${icon("plug", 17)}</div>
        <div style="min-width:0"><div class="mono" style="font-weight:600;font-size:var(--fs-md)">${p.tool}</div><div class="dim" style="font-size:var(--fs-xs)">${p.server} · MCP</div></div>
        ${stageMeta(call)}
      </div>
      <div class="res-bar"><span class="lbl">사이트에서 보이는 모양</span><span class="grow"></span>
        <div class="seg" role="group" aria-label="결과 보기">
          <button data-action="ui-set" data-key="${call.id}:mcpview" data-value="summary" aria-pressed="true">사이트 모양</button>
          <button data-action="ui-set" data-key="${call.id}:mcpview" data-value="raw" aria-pressed="false">원본</button>
        </div>
      </div>
      ${site}`;
  }
  const known = LJ.jiraTool(call.name) || LN.notionTool(call.name) || LSK.slackTool(call.name) || LGM.gmailTool(call.name) || LGC.gcalTool(call.name) || LGS.gsheetsTool(call.name);
  const res = mcpResult(call);
  const payload = res.payload;
  const bytes = (call.result?.text ?? "").length;
  const summary = mcpSummary(res.summary);
  const showSummary = summary && view === "summary";
  const inputRows = Object.entries(i).map(([k, v]) => {
    const value = typeof v === "string" ? maskedText(v) : maskedText(JSON.stringify(v));
    return html`<div class="k">${k}</div><div class="v">${value}</div>`;
  });
  return html`<div class="mcp-h">
      <div class="kind-tile" style="--kc:var(--k-mcp)">${icon("plug", 17)}</div>
      <div style="min-width:0"><div class="mono" style="font-weight:600;font-size:var(--fs-md)">${p.tool}</div><div class="dim" style="font-size:var(--fs-xs)">${p.server} · MCP</div></div>
      ${stageMeta(call)}
    </div>
    <div class="lbl" style="margin-bottom:6px">입력</div>
    ${inputRows.length ? html`<div class="kvt">${inputRows}</div>` : html`<div class="dim">(입력 없음)</div>`}
    <div class="res-bar"><span class="lbl">결과</span><span class="meta">JSON · ${fmtBytes(bytes || JSON.stringify(payload).length)}</span>
      ${summary || known
        ? html`<div class="seg" role="group" aria-label="결과 보기">
            <button data-action="ui-set" data-key="${call.id}:mcpview" data-value="summary" aria-pressed="${view === "summary"}">${known ? "사이트 모양" : "요약"}</button>
            <button data-action="ui-set" data-key="${call.id}:mcpview" data-value="raw" aria-pressed="${view === "raw"}">원본</button>
          </div>`
        : ""}
    </div>
    ${call.result?.err ? html`<div class="err-card">${icon("circle-x", 15)}<div><b>도구가 오류를 돌려줬어요</b></div></div>` : ""}
    ${!call.result ? html`<div class="dim">${call.status === "pending" ? "실행 승인을 기다리고 있어요" : "결과가 아직 없어요"}</div>` : html`<div class="box">${showSummary ? summary : raw(`<div class="jt">${jsonTree(payload, null, call.id, 0)}</div>`)}</div>`}`;
}

/* ---- src/js/tools/stage.js ---- */
// The stage: one call, its header, an approval prompt when blocked, the tool's own renderer,
// and the raw input/result underneath.

function rendererFor(call) {
  if (isMongo(call)) return renderMongo;
  if (call.name.startsWith("mcp__")) return renderMcpGeneric;
  switch (call.name) {
    case "Bash":
    case "shell":
      return renderShell;
    case "Read":
      return renderRead;
    case "Edit":
    case "MultiEdit":
      return renderEdit;
    case "Write":
      return renderWrite;
    case "apply_patch":
      return renderPatch;
    case "Grep":
      return renderGrep;
    case "Glob":
      return renderGlob;
    case "WebFetch":
      return renderWebFetch;
    case "WebSearch":
      return renderWebSearch;
    case "Agent":
    case "Task":
      return renderAgent;
    case "TodoWrite":
    case "update_plan":
      return renderTodo;
    case "AskUserQuestion":
      return renderAsk;
    case "ExitPlanMode":
      return renderPlan;
    case "Skill":
      return renderSkill;
    default:
      return genericBody;
  }
}

// Any tool: its input as a table, its result as text (JSON spread out).
function genericBody(call) {
  const entries = Object.entries(call.input ?? {}).filter(([, v]) => v !== "" && v != null);
  const text = call.result?.text ?? "";
  let shown = text;
  try {
    if (/^\s*[[{]/.test(text)) shown = JSON.stringify(JSON.parse(text), null, 2);
  } catch {
    shown = text;
  }
  return html`${entries.length ? html`<div class="box"><table class="kvt">${entries.slice(0, 40).map(([k, v]) => html`<tr><th>${k}</th><td class="mono">${maskedText(typeof v === "string" ? v : JSON.stringify(v)).slice(0, 3000)}</td></tr>`)}</table></div>` : ""}
    ${shown ? html`<div class="box" style="margin-top:10px">${codeView(maskedText(shown).slice(0, 200000), { lang: /^\s*[[{]/.test(shown) ? "json" : "text", scrollKey: `gen-${call.id}` })}</div>` : ""}`;
}

function toolUseId(call) {
  const alphabet = "0123456789ABCDEFGHJKMNPQRSTVWXYZabcdefghijkmnopqrstuvwxyz";
  let h = hashStr(call.id);
  let s = "";
  for (let k = 0; k < 22; k++) {
    s += alphabet[h % alphabet.length];
    h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0;
  }
  return call.id || (agentById(call.agent)?.app === "codex" ? `call_${s.slice(0, 24)}` : `toolu_01${s}`);
}

function statusPill(call) {
  switch (call.status) {
    case "running":
      return html`<span class="pill working">${spinner(12)} 실행 중</span>`;
    case "pending":
      return html`<span class="pill blocked">${icon("alert", 12)} 승인 대기</span>`;
    case "error":
      return html`<span class="pill err">${icon("circle-x", 12)} 실패</span>`;
    case "interrupted":
      return html`<span class="pill unknown">중단됨</span>`;
    default:
      return html`<span class="pill ok">${icon("check", 12)} 완료</span>`;
  }
}

function permissionBanner(call) {
  if (call.status !== "pending" || !call.permission) return "";
  const p = call.permission;
  const a = agentById(call.agent);
  return html`<div class="perm" role="region" aria-label="승인 요청">
    <div class="perm-h">${icon("alert", 15)}<span>응답 필요 · <span data-elapsed-ko="${call.ts}">${fmtDurKo((Date.now() - call.ts) / 1000)}</span>째 기다리는 중</span></div>
    <div class="perm-q">${p.question}</div>
    <div class="perm-opts">${p.options.map(
      (o, k) => html`<button class="perm-opt" data-action="boundary" data-cmd="hc send ${a.id} '${k + 1}'" data-note="답은 에이전트 터미널로 보냅니다">
        <span class="kbd">${k + 1}</span>${o}
      </button>`,
    )}</div>
    <div class="perm-foot"><span class="grow" style="text-align:left">${icon("info", 12)} ${p.impact}</span>
      <button class="btn sm" data-action="boundary" data-cmd="herdr-app do agent.focus --terminal ${a.id}">herdr에서 열기 ${icon("arrow-up-right", 12)}</button>
    </div>
  </div>`;
}

function rawSection(call) {
  const cut = (s) => (s.length > 6000 ? `${s.slice(0, 6000)}\n… (${fmtInt(s.length - 6000)}자 더)` : s);
  const input = cut(maskedText(JSON.stringify(call.input || {}, null, 2)));
  const result = call.result ? cut(JSON.stringify(call.result, null, 2)) : "null";
  return html`<details class="raw" ${STATE.openFolds.has(`raw:${call.id}`) ? raw("open") : ""} data-raw="${call.id}">
    <summary>${icon("chevron-right", 12, "chev")} 원본 입력·결과 <span class="mono">${toolUseId(call)}</span></summary>
    <div class="raw-grid">
      <div><div class="raw-lbl">INPUT</div><pre>${raw(hl(input, "json").join("\n"))}</pre></div>
      <div><div class="raw-lbl">RESULT</div><pre>${raw(hl(result, "json").join("\n"))}</pre></div>
    </div>
  </details>`;
}

function stageMeta(call) {
  return html`<div class="stage-meta">${statusPill(call)}<span class="when num">${hhmmss(call.ts)}</span>${call.dur != null ? html`<span class="num">${fmtDur(call.dur)}</span>` : call.status === "running" ? html`<span class="num" data-elapsed="${call.ts}">${fmtDur((Date.now() - call.ts) / 1000)}</span>` : ""}</div>`;
}

function stageView(call, { compact = false } = {}) {
  if (!call) {
    return html`<div class="empty"><div class="e-ico">${icon("terminal", 20)}</div><h3>호출을 고르면 여기서 열려요</h3><p>도구마다 원래 화면으로 보여줘요: Bash는 터미널, Edit는 편집기, Mongo는 Compass.</p></div>`;
  }
  const parent = call.parent ? callById(call.parent) : null;
  const p = mcpParts(call.name);
  const ownHeader = !!p;
  let body;
  try {
    body = rendererFor(call)(call);
  } catch (error) {
    body = html`<div class="err-card">${icon("circle-x", 15)}<div><b>이 호출을 그리지 못했어요</b>${String(error?.message ?? error)}</div></div>${genericBody(call)}`;
  }
  return html`<div class="stage"><div class="stage-in">
    ${parent ? html`<div class="crumb-nav"><button data-action="select-call" data-call="${parent.id}">${icon("arrow-left", 12)} ${toolTitle(parent)} · ${parent.input.description}</button><span>안의 단계</span></div>` : ""}
    ${ownHeader ? "" : html`<div class="stage-head">
      <div class="kind-tile" style="--kc:${kindColor(call)}">${toolIcon(call, 17)}</div>
      <div style="min-width:0;flex:1">
        <div class="stage-title"><span>${toolTitle(call)}</span>${p ? html`<span class="chip mono">${p.server}</span>` : ""}</div>
        <div class="stage-sub truncate" title="${toolTarget(call)}">${toolTarget(call)}</div>
      </div>
      ${stageMeta(call)}
    </div>`}
    ${permissionBanner(call)}
    ${body}
    ${compact ? "" : rawSection(call)}
  </div></div>`;
}

/* ---- src/js/views/rail.js ---- */
// Left rail: every agent, grouped by what needs you (herdr's agents mod order) or by space.

function statusGlyph(a, size = 14) {
  switch (a.status) {
    case "working":
      return spinner(size);
    case "blocked":
      return raw('<span class="st blocked" aria-label="응답 필요"></span>');
    case "done":
      return raw('<span class="st dot" aria-label="완료"></span>');
    case "offline":
      return raw('<span class="st unknown" aria-label="연결 필요"></span>');
    case "ended":
      return raw(`<span class="sub-mark ${a.exit ? "bad" : ""}" aria-label="끝남">${icon(a.exit ? "circle-x" : "check", size - 2).s}</span>`);
    case "running":
      return raw(`<span class="sub-mark" aria-label="실행 중">${icon("play", size - 4).s}</span>`);
    default:
      return raw('<span class="st ring" aria-label="대기"></span>');
  }
}

function agentRow(a) {
  const current = STATE.scope === a.id;
  const place = a.machine ? `${a.machine} · ${a.space}` : `${a.space} › ${a.tab}`;
  const sub = a.summary && a.summary !== a.title ? a.summary : place;
  return html`<button class="agent-item ${a.status} ${a.status === "offline" ? "offline" : ""}" data-action="scope" data-scope="${a.id}" aria-current="${current}" title="${a.title} · ${STATUS_LABEL[a.status]}">
    ${logo(a.app, 26)}
    ${a.unseen ? raw('<span class="unseen" aria-label="안 본 완료"></span>') : ""}
    <span class="grow"><div class="t truncate">${a.title}</div><div class="s truncate">${sub}</div></span>
    <span class="r">${statusGlyph(a)}<span data-ago="${a.sinceTs}">${shortAgo(a.sinceTs)}</span></span>
  </button>`;
}

// A sub-agent under whoever started it: tree lines, a small mark, its name and how it is doing.
const ENDED_IN_RAIL_MS = 30 * 60 * 1000;
const inRail = (n) => n.state === "live" || Date.now() - (n.finished ?? 0) < ENDED_IN_RAIL_MS;

function treeLines(lines) {
  return lines.map((l) => raw(`<i class="tl ${l === "└" ? "end" : l === "├" ? "mid" : l === "│" ? "bar" : ""}"></i>`));
}

function subRow({ node: a, lines }) {
  const current = STATE.scope === a.id || (STATE.lens === "subs" && pickedSub()?.id === a.id);
  return html`<button class="agent-sub ${a.state === "ended" ? "ended" : ""}" data-action="scope" data-scope="${a.id}" aria-current="${current}" title="${a.title} · ${STATUS_LABEL[a.status] ?? a.status}">
    ${treeLines(lines)}${logo(a.app, 18)}<span class="t truncate grow">${a.title}</span>${statusGlyph(a, 13)}
  </button>`;
}

const withSubs = (a) => html`${agentRow(a)}${LTR.descendants(DB.roster, a.id, inRail).map(subRow)}`;
// An agent sits in the group of its most urgent live sub-agent.
const groupStatus = (a) => {
  const s = LTR.urgentStatus(DB.roster, a.id);
  return STATUS_RANK[s] > STATUS_RANK[a.status] && ["blocked", "working"].includes(s) ? s : a.status;
};

// A space's mark as the app draws it: a picked image, a character, or its first letter on its color.
const SPACE_TINT = { ansi6: "#22a99a", ansi3: "#e3814f", ansi4: "#5b8def", ansi5: "#8b7cf6", ansi2: "#3fae6a", ansi1: "#d9649a" };
function spaceMark(name) {
  const space = (LIVE.spaces ?? []).find((s) => s.name === name);
  if (space?.image) return html`<img class="sp-mark" src="${space.image}" alt="" />`;
  const tint = space?.color?.startsWith("#") ? space.color : SPACE_TINT[space?.color] ?? SPACE_TINT.ansi6;
  const letter = space?.text || [...String(name ?? "?")][0]?.toUpperCase() || "?";
  // The letter is white or dark, whichever reads better on the space's color.
  return html`<span class="sp-mark" style="${space?.text ? "" : `background:${tint};color:${LF.inkOn(tint)}`}">${letter}</span>`;
}

function railGroups() {
  const agents = DB.roster.roots.map((id) => DB.roster.nodes[id]);
  if (STATE.railGroup === "space") {
    const bySpace = groupBy(agents, (a) => (a.machine ? `${a.machine} · ${a.space}` : a.space));
    // The app's own order first (empty spaces too), then spaces it doesn't list (other machines').
    const named = (LIVE.spaces ?? []).map((sp) => sp.name).filter(Boolean);
    const order = [...new Set([...named, ...Object.keys(bySpace)])];
    return order.map((space) => ({ key: space, label: space, cls: "", list: bySpace[space] ?? [], mark: spaceMark(space) }));
  }
  const order = ["blocked", "done", "working", "idle", "offline"];
  return order
    .map((s) => ({ key: s, label: STATUS_LABEL[s], cls: s, list: agents.filter((a) => groupStatus(a) === s).sort((x, y) => y.sinceTs - x.sinceTs) }))
    .filter((g) => g.list.length);
}

// By space, as in the app: the space (mark, name, fold), then its agents under a line, each
// with its sub-agents.
function spaceGroup(g) {
  const closed = Boolean(STATE.foldedSpaces?.[g.key]);
  const top = g.list.reduce((best, a) => (STATUS_RANK[groupStatus(a)] > STATUS_RANK[best] ? groupStatus(a) : best), "idle");
  return html`<div class="sp-group">
    <button class="sp-head" data-action="space-fold" data-space="${g.key}" aria-expanded="${!closed}">
      ${g.mark}<span class="grow truncate">${g.label}</span>
      ${closed && g.list.length ? html`<span class="sp-count">${["blocked", "working"].includes(top) ? statusGlyph({ status: top }, 13) : ""}${g.list.length}</span>` : ""}
      ${g.list.length ? icon(closed ? "chevron-right" : "chevron-down", 13) : ""}
    </button>
    ${closed || !g.list.length ? "" : html`<div class="sp-sub">
      <div class="sp-agents">${icon("bot", 14)}<span>에이전트</span><span class="sp-n">${g.list.length}</span></div>
      ${g.list.map((a) => html`<div class="sp-kid">${withSubs(a)}</div>`)}
    </div>`}
  </div>`;
}

function railView() {
  const groups = railGroups();
  const machines = groupBy(DB.agents.filter((a) => !a.sub), (a) => a.machine || "");
  const subs = DB.agents.filter((a) => a.sub && a.state === "live").length;
  return html`<div class="rail-head">
      <span class="rail-title grow">에이전트<b>${DB.roster.roots.length}</b>${subs ? html`<small class="dim"> · 하위 ${subs}</small>` : ""}</span>
      <button class="follow ${STATE.followFocus ? "on" : ""}" data-action="follow-focus" aria-pressed="${STATE.followFocus}" title="${STATE.followFocus ? "Herdr에서 포커스한 에이전트를 따라가요 (끄려면 클릭)" : "Herdr 포커스를 따라가지 않아요 (켜려면 클릭)"}">${icon("link", 12)} 포커스</button>
      <div class="seg" role="group" aria-label="묶는 방식">
        <button data-action="rail-group" data-value="status" aria-pressed="${STATE.railGroup === "status"}" title="급한 순서">${icon("clock", 12)}</button>
        <button data-action="rail-group" data-value="space" aria-pressed="${STATE.railGroup === "space"}" title="스페이스별">${icon("layers", 12)}</button>
      </div>
    </div>
    <nav class="rail-body" aria-label="에이전트" data-keep-scroll="rail">
      <button class="rail-all" data-action="scope" data-scope="all" aria-current="${STATE.scope === "all"}">
        <span class="tile">${icon("grid", 14)}</span><span>전체 현황</span>
      </button>
      ${STATE.railGroup === "space" ? groups.map(spaceGroup) : groups.map(
        (g) => html`<div class="rail-group ${g.cls}"><span>${g.label}</span><span class="n">${g.list.length}</span></div>${g.list.map(withSubs)}`,
      )}
    </nav>
    <div class="rail-foot">
      ${Object.entries(machines).map(([m, list]) => {
        const off = list.every((a) => a.status === "offline");
        return html`<div class="machine ${off ? "off" : ""}">${icon(m ? "server" : "monitor", 14)}<span class="grow">${m || "This computer"}</span>${off ? html`<em>로그인 필요</em>` : html`<span>${list.length}</span>`}</div>`;
      })}
    </div>`;
}
